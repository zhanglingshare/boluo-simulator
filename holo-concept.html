<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f5f2ec">
<title>博罗 · 全息版｜关系世界概念预览</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--paper:#f5f2ec;--ink:#19374b;--muted:#83919b;--line:rgba(39,67,83,.09);--glass:rgba(255,255,255,.79);--blue:#4b91d5;--amber:#d39a4d;--teal:#579d9a;--green:#79a77c;--violet:#9584c5;--red:#d76d5d;--shadow:0 8px 28px rgba(31,53,67,.075)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input{font:inherit}
button{cursor:pointer;color:inherit}
.topbar{height:68px;display:flex;align-items:center;gap:25px;padding:0 25px;background:rgba(255,255,255,.74);border-bottom:1px solid rgba(31,58,74,.055);position:relative;z-index:20;backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:12px;min-width:265px}
.brand-mark{width:42px;height:42px;display:grid;place-items:center;color:#245366}
.brand-mark svg{width:40px;height:40px}
.brand-name{font-weight:760;letter-spacing:.04em;font-size:21px;line-height:1.15}
.brand-sub{font-size:10px;color:#a2a9ad;letter-spacing:.1em;margin-top:4px}
.topnav{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.topnav button{border:0;background:transparent;padding:11px 15px;border-radius:15px;font-size:14px;font-weight:620;white-space:nowrap;transition:.2s}
.topnav button:hover{background:#eef2f2}
.topnav button.active{background:#18384b;color:white;box-shadow:0 4px 12px #19374b18}
.search-wrap{display:flex;align-items:center;gap:8px;background:#f2f2ef;border:1px solid #ebece8;border-radius:24px;padding:0 13px;height:40px;width:260px;flex-shrink:0}
.search-wrap svg{width:17px;height:17px;color:#536978;flex-shrink:0}
.search-wrap input{border:0;outline:0;background:transparent;min-width:0;width:100%;font-size:12px;color:var(--ink)}
.shell{height:calc(100% - 68px);display:grid;grid-template-columns:184px minmax(0,1fr);grid-template-rows:84px minmax(0,1fr);gap:10px 13px;padding:12px 15px 14px}
.sidebar{grid-column:1;grid-row:1/3;display:flex;flex-direction:column;gap:16px;min-height:0;z-index:5}
.side-nav,.scenario-panel{background:rgba(255,255,255,.63);border:1px solid rgba(255,255,255,.8);border-radius:19px;padding:9px;box-shadow:0 4px 18px rgba(34,60,73,.025)}
.side-nav{display:flex;flex-direction:column;gap:3px}
.side-nav button{height:43px;display:flex;align-items:center;gap:12px;padding:0 12px;border:1px solid transparent;border-radius:12px;background:transparent;text-align:left;font-size:13px;color:#304b5c;transition:.18s}
.side-nav button svg{width:18px;height:18px;flex-shrink:0}
.side-nav button:hover{background:#f4f6f3}
.side-nav button.active{background:linear-gradient(115deg,#e9f3f6,#dfeaf0);border-color:white;box-shadow:0 4px 14px rgba(45,87,104,.09);font-weight:700}
.scenario-panel{margin-top:auto;padding:14px 11px 12px}
.section-title{font-size:13px;font-weight:760;letter-spacing:.02em;margin:0 0 12px 2px}
.scenario-list{display:flex;flex-direction:column;gap:5px}
.scenario-btn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;border-radius:10px;background:transparent;padding:8px 7px;color:#687b87;font-size:12px;line-height:1.2}
.scenario-btn:hover{background:#f5f5f0}
.scenario-btn.active{color:#203f52;font-weight:700;background:#f0f4f2}
.radio-dot{width:14px;height:14px;border-radius:50%;border:2px solid #d1d7d9;flex-shrink:0;position:relative}
.scenario-btn.active .radio-dot{border-color:#21445a}
.scenario-btn.active .radio-dot:after{content:"";position:absolute;inset:3px;border-radius:50%;background:#21445a}
.metrics{grid-column:2;grid-row:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(210px,1.45fr);gap:10px;min-width:0}
.metric{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:5px;min-width:0;padding:11px 15px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.92);border-radius:15px;box-shadow:0 3px 12px rgba(35,56,68,.025)}
.metric-label{font-size:11px;color:#71818c;white-space:nowrap}
.metric-bottom{display:flex;align-items:baseline;gap:7px;min-width:0}
.metric-value{font-size:23px;font-weight:760;letter-spacing:-.03em;white-space:nowrap}
.metric-change{font-size:10px;font-weight:700;white-space:nowrap}
.spark{position:absolute;right:9px;bottom:11px;height:26px;display:flex;align-items:flex-end;gap:2px;opacity:.7}
.spark i{display:block;width:4px;border-radius:3px 3px 0 0;background:var(--spark,#7db6cc);height:var(--h,40%)}
.year-card{display:flex;flex-direction:column;justify-content:center;gap:8px;padding:10px 14px;background:rgba(255,255,255,.77);border:1px solid rgba(255,255,255,.92);border-radius:15px}
.year-tabs{display:flex;justify-content:space-between;gap:6px}
.year-tab{border:0;border-radius:10px;padding:7px 12px;min-width:56px;background:#f3f3f0;color:#8b969c;font-size:12px}
.year-tab.active{background:#18384b;color:#fff;font-weight:700}
.year-rail{height:12px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.year-rail:before{content:"";position:absolute;height:2px;background:#dce1e1;left:3px;right:3px;top:5px}
.year-rail span{width:9px;height:9px;border-radius:50%;background:#c5ccce;position:relative;z-index:1}
.year-rail span:first-child,.year-rail span:nth-child(2){background:#21465a}
.year-note{font-size:9px;color:#9aa5aa;margin-top:-3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{grid-column:2;grid-row:2;position:relative;min-width:0;min-height:0;border-radius:23px;overflow:hidden;background:radial-gradient(ellipse at 50% 47%,#ffffff 0%,#f7f5ef 50%,#eeeee8 100%);isolation:isolate}
.stage:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 44%,rgba(245,242,236,.32) 79%,rgba(245,242,236,.85) 100%)}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none;outline:none}
.world-hint{position:absolute;left:18px;top:14px;z-index:3;display:flex;align-items:center;gap:8px;color:#7f9097;font-size:10px;letter-spacing:.03em;pointer-events:none}
.live-dot{width:6px;height:6px;border-radius:50%;background:#72b2a0;box-shadow:0 0 0 4px rgba(114,178,160,.12)}
.right-panel{position:absolute;z-index:6;right:14px;top:15px;width:164px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.94);border-radius:17px;padding:14px 13px 12px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
.panel-heading{font-size:13px;font-weight:780;margin:0 0 12px}
.legend-row{display:flex;align-items:center;gap:9px;margin:10px 0;font-size:10px;color:#7d8b93}
.legend-line{width:29px;height:0;border-top:var(--thick,2px) solid var(--c,#8cb3c4);border-radius:10px;flex-shrink:0}
.legend-caption{margin:12px 0 7px;color:#9ba5aa;font-size:9px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0 1px;font-size:11px;color:#526a79}
.switch{width:32px;height:18px;border:0;border-radius:12px;background:#d9dfe0;padding:2px;transition:.2s}
.switch:after{content:"";display:block;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0002;transition:.2s}
.switch.on{background:#1c4054}
.switch.on:after{transform:translateX(14px)}
.detail-view{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.right-panel.has-detail .legend-view{display:none}
.right-panel.has-detail .detail-view{display:block}
.detail-name{font-size:14px;font-weight:780;line-height:1.35;margin-bottom:5px}
.detail-type{display:inline-flex;align-items:center;border-radius:7px;padding:4px 7px;background:#eef3f3;color:#607783;font-size:9px;margin-bottom:9px}
.detail-desc{font-size:10px;line-height:1.65;color:#667b86;margin-bottom:10px}
.detail-meta{font-size:9px;color:#98a3a8;margin-bottom:10px}
.relation-list{display:flex;flex-direction:column;gap:7px;max-height:185px;overflow:auto}
.relation-item{border:1px solid #edf0ed;border-radius:9px;padding:8px;background:rgba(248,249,246,.9)}
.relation-title{font-size:10px;font-weight:700;line-height:1.4}
.relation-sub{font-size:9px;color:#87949a;margin-top:4px;line-height:1.4}
.panel-back{border:0;background:#f0f3f1;border-radius:8px;padding:6px 8px;font-size:10px;margin-top:10px}
.bottom-dock{position:absolute;z-index:7;left:14px;bottom:14px;display:flex;gap:9px;padding:10px;background:rgba(255,255,255,.83);border:1px solid rgba(255,255,255,.94);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(14px);max-width:calc(100% - 420px)}
.action-btn{display:flex;align-items:center;gap:10px;min-width:118px;border:1px solid transparent;border-radius:13px;padding:11px 14px;background:rgba(247,248,245,.8);font-size:12px;font-weight:730;white-space:nowrap;transition:.2s}
.action-btn:hover{background:#f1f4f1;border-color:#e6ece9}
.action-btn svg{width:22px;height:22px;flex-shrink:0}
.action-btn.primary{background:#18384b;color:white;min-width:168px}
.action-btn.primary:hover{background:#244d62}
.action-sub{display:block;font-size:9px;font-weight:450;opacity:.68;margin-top:3px}
.scenario-shelf{position:absolute;z-index:7;right:14px;bottom:14px;width:min(420px,42%);padding:12px 13px 10px;border-radius:18px;background:rgba(255,255,255,.84);border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow);backdrop-filter:blur(14px)}
.shelf-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.shelf-head strong{font-size:12px}
.more-btn{border:0;background:transparent;color:#85939a;font-size:10px}
.scenario-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.scenario-card{border:1px solid transparent;background:transparent;border-radius:11px;padding:4px;text-align:left;min-width:0}
.scenario-card:hover,.scenario-card.active{background:#f1f4f2;border-color:#e2eae6}
.mini-scene{height:51px;border-radius:8px;position:relative;overflow:hidden;margin-bottom:5px;background:var(--mini,#e2f0f1)}
.mini-scene:before,.mini-scene:after{content:"";position:absolute;border-radius:50%;width:52px;height:22px;left:calc(50% - 26px);top:16px;background:rgba(255,255,255,.68);box-shadow:0 5px 0 rgba(79,123,133,.14)}
.mini-scene:after{width:4px;height:4px;left:calc(50% - 2px);top:7px;background:var(--accent,#579d9a);box-shadow:-18px 19px 0 var(--accent,#579d9a),14px 13px 0 var(--accent,#579d9a),26px 24px 0 var(--accent,#579d9a),-28px 12px 0 var(--accent,#579d9a)}
.mini-scene svg{position:absolute;inset:0;width:100%;height:100%}
.scenario-card span{display:block;font-size:9px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-line{position:absolute;z-index:5;left:50%;bottom:104px;transform:translateX(-50%);padding:8px 14px;border-radius:20px;background:rgba(255,255,255,.86);border:1px solid #fff;box-shadow:0 5px 18px #2440520d;font-size:10px;color:#73848e;white-space:nowrap;max-width:75%;overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:opacity .25s}
.status-line.hidden{opacity:0}
.stage-label{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:2;font-size:10px;color:#9ba6aa;letter-spacing:.16em;pointer-events:none}
@media(max-width:1100px){.brand{min-width:205px}.topbar{gap:10px;padding:0 15px}.topnav button{padding:10px}.search-wrap{width:195px}.shell{grid-template-columns:160px minmax(0,1fr);padding:9px}.metrics{grid-template-columns:repeat(5,minmax(0,1fr));}.year-card{display:none}.metric{padding:9px}.metric-value{font-size:19px}.right-panel{width:150px}.bottom-dock{max-width:calc(100% - 360px);gap:5px}.action-btn{min-width:94px;padding:10px}.action-btn.primary{min-width:130px}.scenario-shelf{width:340px}}
@media(max-width:760px){html,body{overflow:auto;height:auto;min-height:100%;}.topbar{height:58px;padding:0 12px;gap:8px}.brand{min-width:0;flex:1}.brand-mark{width:32px;height:32px}.brand-mark svg{width:31px;height:31px}.brand-name{font-size:16px}.brand-sub{font-size:8px}.topnav{display:none}.search-wrap{width:40px;padding:0 11px}.search-wrap input{display:none}.shell{height:auto;min-height:calc(100vh - 58px);display:flex;flex-direction:column;padding:8px;gap:8px}.sidebar{display:contents}.side-nav{order:2;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px}.side-nav button{height:36px;font-size:10px;justify-content:center;gap:5px;padding:0 3px}.side-nav button svg{width:14px;height:14px}.scenario-panel{order:3;margin:0;padding:10px}.scenario-list{display:grid;grid-template-columns:repeat(2,1fr)}.metrics{order:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.metric{min-height:63px;padding:8px 11px}.metric:last-of-type{grid-column:span 2}.metric-value{font-size:18px}.metric-label{font-size:10px}.year-card{display:flex;grid-column:span 2;order:2}.stage{order:4;height:calc(100vh - 110px);min-height:560px;max-height:780px;flex-shrink:0}.right-panel{right:7px;top:7px;width:132px;padding:10px;border-radius:13px}.panel-heading{font-size:11px}.legend-row{font-size:9px;margin:7px 0}.legend-line{width:22px}.toggle-row{font-size:9px}.scenario-shelf{left:7px;right:7px;bottom:7px;width:auto;padding:8px}.shelf-head{margin-bottom:5px}.scenario-cards{gap:4px}.mini-scene{height:37px}.scenario-card span{font-size:8px}.bottom-dock{left:7px;right:7px;bottom:112px;max-width:none;display:grid;grid-template-columns:repeat(2,1fr);gap:5px;padding:6px}.action-btn,.action-btn.primary{min-width:0;padding:8px;font-size:10px;gap:7px}.action-btn svg{width:17px;height:17px}.action-sub{display:none}.status-line{bottom:230px;font-size:9px;max-width:90%}.stage-label{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

}
function applyScenario(key){
 computeScenario(key);compareMode=false;
 const data=scenarioData[key];selectedNodeId=data&&data.seed?data.seed:null;
 if(key==="base"){$("right-panel").classList.remove("has-detail");focusMode=false;$("focus-toggle").classList.remove("on");$("focus-toggle").setAttribute("aria-pressed","false")}
 else{$("right-panel").classList.remove("has-detail");focusMode=true;$("focus-toggle").classList.add("on");$("focus-toggle").setAttribute("aria-pressed","true")}
 updateVisualState();
 if(key==="base")setStatus("基准结构：展示现有模型关系；不代表预测",true);
 else setStatus("情景演示 · "+data.label+"：亮起相关传导关系，不代表实际发生或预测结果",false);
}
function setFilter(key){
 activeFilter=key;selectedNodeId=null;compareMode=false;$("right-panel").classList.remove("has-detail");
 updateVisualState();setStatus(key==="all"?"显示整个博罗关系世界":"已聚焦："+clusterMeta[key].label+" 群落",true);
}
function bindUI(){
 document.querySelectorAll("[data-filter]").forEach(function(b){b.addEventListener("click",function(){setFilter(b.dataset.filter)})});
 document.querySelectorAll("[data-scenario]").forEach(function(b){b.addEventListener("click",function(){applyScenario(b.dataset.scenario)})});
 $("labels-toggle").addEventListener("click",function(){labelsOn=!labelsOn;this.classList.toggle("on",labelsOn);this.setAttribute("aria-pressed",String(labelsOn));updateVisualState()});
 $("focus-toggle").addEventListener("click",function(){focusMode=!focusMode;this.classList.toggle("on",focusMode);this.setAttribute("aria-pressed",String(focusMode));if(focusMode&&!selectedNodeId&&activeScenario==="base")setStatus("先点击一个主体，关系聚焦才会显示它的直接关联",true);updateVisualState()});
 $("back-to-legend").addEventListener("click",showLegend);
 $("explore-btn").addEventListener("click",function(){applyScenario("base");activeFilter="all";setFilter("all");setStatus("拖动旋转全景，点击任意主体查看它连接着谁",true)});
 $("trace-btn").addEventListener("click",function(){if(!selectedNodeId){setStatus("先点击中央关系世界中的一个主体，再开始追踪",true);return}focusMode=!focusMode;$("focus-toggle").classList.toggle("on",focusMode);$("focus-toggle").setAttribute("aria-pressed",String(focusMode));updateVisualState();setStatus(focusMode?"已突出该主体的直接关系":"已恢复整体关系",true)});
 $("simulate-btn").addEventListener("click",function(){document.querySelector(".scenario-panel").scrollIntoView({behavior:"smooth",block:"nearest"});setStatus("选择左侧任一情景，观察关系网络如何变化",true)});
 $("compare-btn").addEventListener("click",function(){if(activeScenario==="base"){setStatus("请先选择一个情景，再查看基准结构与受影响关系的视觉对照",true);return}compareMode=!compareMode;updateVisualState();setStatus(compareMode?"对照模式：突出情景涉及的关系，其余连接淡出":"已退出对照模式",true)});
 $("more-scenarios").addEventListener("click",function(){const shelf=$("scenario-cards");if(shelf.dataset.expanded==="true"){shelf.dataset.expanded="false";this.textContent="更多情景　›";shelf.querySelectorAll('[data-extra="true"]').forEach(function(n){n.remove()})}else{shelf.dataset.expanded="true";this.textContent="收起　⌃";["lq"].forEach(function(key){const b=document.createElement("button");b.className="scenario-card";b.dataset.scenario=key;b.dataset.extra="true";const m=document.createElement("div");m.className="mini-scene";m.style.setProperty("--mini","#e6e9df");m.style.setProperty("--accent","#c39a62");m.innerHTML='<svg viewBox="0 0 120 60" fill="none"><path d="M8 43Q34 16 62 35T114 22" stroke="#c39a62" stroke-width="2.5"/></svg>';const t=document.createElement("span");t.textContent=scenarioData[key].label;b.appendChild(m);b.appendChild(t);b.addEventListener("click",function(){applyScenario(key)});shelf.appendChild(b)})}});
 document.querySelectorAll("[data-year]").forEach(function(b){b.addEventListener("click",function(){document.querySelectorAll("[data-year]").forEach(function(x){x.classList.toggle("active",x===b)});$("year-note").textContent=b.dataset.year==="2025"?"2025 公开数据基准 · 非预测":b.dataset.year+" 情景观察点 · 非官方预测";setStatus(b.dataset.year==="2025"?"顶部指标为2025公开数据基准":b.dataset.year+" 仅用于观察结构变化，不代表官方预测数值",true)})});
 $("search").addEventListener("keydown",function(e){if(e.key!=="Enter")return;const q=this.value.trim().toLowerCase();if(!q)return;const n=nodes.find(function(x){return x.name.toLowerCase().indexOf(q)>=0||x.town.toLowerCase().indexOf(q)>=0||x.desc.toLowerCase().indexOf(q)>=0});if(n){setFilter("all");renderNodeDetails(n.id);this.blur()}else setStatus("没有找到匹配主体，请尝试更短的关键词",true)});
 const canvas=$("world");
 canvas.addEventListener("pointerdown",function(e){dragging=true;pointerMoved=false;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
 canvas.addEventListener("pointermove",function(e){if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(dx)+Math.abs(dy)>3)pointerMoved=true;if(pointerMoved){theta-=dx*.006;phi=Math.max(.38,Math.min(1.06,phi+dy*.004));updateCamera()}lastX=e.clientX;lastY=e.clientY});
 canvas.addEventListener("pointerup",function(e){dragging=false;if(pointerMoved)return;const rect=canvas.getBoundingClientRect();mouse.x=((e.clientX-rect.left)/rect.width)*2-1;mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(pickables,false);if(hits.length){renderNodeDetails(hits[0].object.userData.nodeId)}});
 canvas.addEventListener("pointercancel",function(){dragging=false});
 canvas.addEventListener("wheel",function(e){e.preventDefault();camera.zoom=Math.max(.72,Math.min(1.65,camera.zoom+(e.deltaY<0?.06:-.06)));camera.updateProjectionMatrix()},{passive:false});
 window.addEventListener("resize",resizeWorld);
}
function animate(){
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 flowObjects.forEach(function(o){if(o.dot){o.dot.position.copy(o.curve.getPoint((t*.085+o.phase)%1));o.dot.visible=activeScenario==="base"||o.edges.some(function(e){return scenarioEdgeIds.has(edges.indexOf(e))});}if(o.material){o.material.opacity=o.baseOpacity*(.88+.12*Math.sin(t*1.05+o.phase))}});
 Object.keys(nodeObjects).forEach(function(id){const o=nodeObjects[id];o.root.position.y=nodePositions[id].y+Math.sin(t*.8+o.root.userData.phase)*.025});
 renderer.render(scene,camera);
}
if(!window.THREE){setStatus("3D 引擎未加载，请检查网络后刷新页面",false)}else{try{initWorld();updateCamera();bindUI();computeScenario("base");updateVisualState()}catch(e){console.error(e);setStatus("3D 场景初始化失败："+e.message,false)}}
})();
</script>
</body>
</html>
