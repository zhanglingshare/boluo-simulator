    深圳福田区（深博福田产业园）≠ 博罗长宁原福田；深圳龙华区 ≠ 博罗龙华镇。 */
 const TOWN_16=['罗阳','龙溪','石坝','麻陂','观音阁','公庄','杨村','杨侨','柏塘','湖镇','长宁','石湾','园洲','龙华','泰美','横河'];
 const STREETS=new Set(['罗阳','龙溪']);
 const TOWN_NORMALIZE={'福田':'长宁'};
 const RICH_TOWNS=TOWN_16; // 兼容旧名；rich 与否由 life 资料决定
 const SPARSE_TOWNS=[];
 const TOWN_ALIASES={
  '长宁':['长宁镇','罗浮山','飞云顶','冲虚观','酥醪','葛洪','福田菜心','福田镇'],
  '横河':['横河','显岗','秋枫寨','花园村'],
  '罗阳':['罗阳'],
  '园洲':['园洲','深博福田产业园'],
  '石湾':['石湾'],
  '泰美':['泰美','车村','象头山','赣深高铁博罗站'],
  '柏塘':['柏塘','双罗','白花公路','古榄'],
  '龙华':['龙华镇','旭日古村'],
  '公庄':['公庄'],
  '杨村':['杨村','皇帝柑'],
  '杨侨':['杨侨','红江橙'],
  '观音阁':['观音阁'],
  '龙溪':['龙溪'],
  '湖镇':['湖镇'],
  '石坝':['石坝','三黄鸡','胡须鸡'],
  '麻陂':['麻陂','肉丸']
 };
 // 跨区域地标（不属于单一镇，归到产业/文旅网络节点 lswh）
 const LANDMARK_PATTERNS=[{id:'lswh',name:'环两山引领区',terms:['环南昆山','罗浮山引领区','引领区']}];

 function normalizeTown(name){if(!name)return name;return TOWN_NORMALIZE[name]||name;}
 function nodeTowns(raw){ // 解析产业节点 town，归一旧名，剔除非镇名
  if(!raw)return[];
  return [...new Set(raw.split(/[\/、，,\s]+/).map(s=>normalizeTown(s.trim())).filter(s=>TOWN_16.includes(s)))];
 }
 function classifyEvent(ev){
  const text=(ev.title||'')+' '+(ev.summary||'');
  const towns=new Set();
  let landmark=null;
  for(const lm of LANDMARK_PATTERNS){if(lm.terms.some(t=>text.includes(t))){landmark=lm.id;break}}
  for(const [town,aliases] of Object.entries(TOWN_ALIASES)){
   if(aliases.some(a=>text.includes(a)))towns.add(town);
  }
  // 罗浮山（非引领区语境）也是长宁的文旅地标
  if(text.includes('罗浮山')&&!towns.has('长宁'))towns.add('长宁');
  const located=towns.size>0||!!landmark;
  return {towns:[...towns],landmark,located};
 }

 /* ---------- 规范化 live JSON ---------- */
 function normalizeLife(raw){
  if(!raw||!Array.isArray(raw.towns))return null;
  const towns=raw.towns.map(t=>({n:normalizeTown(t.n),tag:t.tag||'',foods:t.foods||t.food? (Array.isArray(t.foods)?t.foods:[t.food]):[],plays:t.plays||t.play?(Array.isArray(t.plays)?t.plays:[t.play]):[],why:t.why||'',hot:Number(t.hot)||0,level:t.level||'中',verified_status:t.verified_status||'pending'}));
  // 归一后若长宁/福田合并，合并食物/玩法
  const byName=new Map();
  for(const t of towns){
   if(byName.has(t.n)){const m=byName.get(t.n);m.foods=[...new Set([...m.foods,...t.foods])];m.plays=[...new Set([...m.plays,...t.plays])];m.hot=Math.max(m.hot,t.hot);}
   else byName.set(t.n,t);
  }
  return {updated:raw.updated||'',sourceLabel:raw.sourceLabel||'',pulse:raw.pulse||[],veg:raw.veg||[],season:raw.season||'',fetched_at:raw.fetched_at||'',towns:[...byName.values()]};
 }
 function normalizeHot(raw){
  if(!raw||!Array.isArray(raw.items))return null;
  const items=raw.items.map((it,i)=>({id:'ev'+i+'_'+(it.url||'').slice(-12),title:it.title||'',cat:it.cat||'',source:it.source||'',url:it.url||'',summary:it.summary||'',published_at:it.published_at||null,event_date:it.event_date||null,fetched_at:it.fetched_at||'',verified_status:it.verified_status||'待核实',tier:it.tier||'',srcLevel:it.srcLevel||''}));
  return {updated:raw.updated||'',fetched_at:raw.fetched_at||'',items};
 }

 /* ---------- 16 镇街锚点：atlas 权威 + life 生活资料 ---------- */
 function buildAnchors(atlas,life){
  const lifeMap=new Map((life?.towns||[]).map(t=>[t.n,t]));
  const atlasMap=new Map((atlas?.towns||[]).map(t=>[t.name,t]));
  return TOWN_16.map(name=>{
   const a=atlasMap.get(name);
   const t=lifeMap.get(name);
   const rich=!!t;
   const pop=a?.population||{};
   const inds=(a?.industries||[]);
   return {id:'town:'+name,name,kind:'anchor',cluster:'life',rich,
    type:a?.type||(STREETS.has(name)?'街道':'镇'),
    area:a?.area_km2||null,
    population:(pop.value??null),popLevel:pop.level||a?.pop_level||'D',popLabel:pop.label||'',
    role:a?.role||'',industries:inds,metrics:a?.metrics||null,
    tag:t?.tag||a?.role||'',
    foods:t?.foods||[],plays:t?.plays||[],why:t?.why||'',
    hot:t?.hot||0,level:t?.level||'',verified_status:t?.verified_status||(rich?'pending':'missing'),
    desc:(t?.tag||a?.role||name)+(t?.foods?.length?' · '+t.foods.join(' / '):'')};
  });
 }

 /* ---------- 构建跨层世界模型 ---------- */
 function buildModel(life,hot,atlas){
  const anchors=buildAnchors(atlas,life);
  const anchorMap=new Map(anchors.map(a=>[a.name,a]));
  // dataNodes = 产业/文旅/农业/外部节点 + 15 个镇锚点
  const dataNodes=D.nodes.concat(anchors);
  const nodeMap=new Map(dataNodes.map(n=>[n.id,n]));
  // 产业→镇 located_in（明示于 node.town，属"已收录"，但语义是归属而非供应链）
  const crossLinks=[];
  const industriesByTown=new Map();
  for(const n of D.nodes){
   const ts=nodeTowns(n.town);
   for(const t of ts){
    if(!anchorMap.has(t))continue;
    crossLinks.push({id:'loc:'+n.id+'@'+t,source:n.id,target:'town:'+t,linkType:'located_in',evidenceLevel:'A',sourceRefs:['network.html#rawNodes'],timeScope:'static'});
    (industriesByTown.get(t)||industriesByTown.set(t,[]).get(t)).push(n.id);
   }
  }
  // 镇→生活特色 has_feature（life.json 明示，pending 为分档非实测）
  for(const a of anchors){if(!a.rich)continue;
   const feats=[...a.foods.map(f=>({kind:'food',text:f})),...a.plays.map(p=>({kind:'play',text:p}))];
   feats.forEach((f,i)=>crossLinks.push({id:'feat:'+a.name+':'+i,source:a.id,target:'life:'+a.name+':'+i,linkType:'has_feature',evidenceLevel:'B',feature:f,sourceRefs:['life.json'],timeScope:life?.updated||''}));
  }
  // 事件归属 mentioned_in
  const eventsByTown=new Map();
  const landmarkEvents=new Map();
  const unlocated=[];
  const events=(hot?.items||[]).map((ev,i)=>{
   const c=classifyEvent(ev);
   const e={...ev,index:i,towns:c.towns,landmark:c.landmark,located:c.located};
   if(!c.located){unlocated.push(e);return e}
   for(const t of c.towns){if(!eventsByTown.has(t))eventsByTown.set(t,[]);eventsByTown.get(t).push(e);crossLinks.push({id:'ment:'+i+'@'+t,source:'event:'+i,target:'town:'+t,linkType:'mentioned_in',evidenceLevel:ev.verified_status==='已核验'?'A':'B',sourceRefs:[ev.url],timeScope:ev.fetched_at});}
   if(c.landmark){if(!landmarkEvents.has(c.landmark))landmarkEvents.set(c.landmark,[]);landmarkEvents.get(c.landmark).push(e);}
   return e;
  });
  return {anchors,anchorMap,dataNodes,nodeMap,crossLinks,events,eventsByTown,landmarkEvents,unlocated,industriesByTown,life,hot,atlas:atlas||null,flows:atlas?.flows||[],crossTransit:atlas?.crossTransit||[],flying:atlas?.industrialFlying||[],dataGaps:atlas?.dataGaps||[],county:atlas?.county||null};
 }

 /* ---------- 快照对比（当前 vs 上次），key 用 url ---------- */
 function diffSnapshots(prev,next){
  const pm=new Map((prev?.items||[]).map(x=>[x.url,x]));
  const nm=new Map((next?.items||[]).map(x=>[x.url,x]));
  const added=[],updated=[],removed=[];
  for(const [k,x] of nm){if(!pm.has(k)){added.push(x);continue}const p=pm.get(k);if(p.summary!==x.summary||p.verified_status!==x.verified_status||p.title!==x.title)updated.push({prev:p,next:x});}
  for(const [k,x] of pm){if(!nm.has(k))removed.push(x);}
  return {added,updated,removed,hasChange:added.length+updated.length+removed.length>0};
 }

 /* ---------- 产业图（保留 M1 确定性布局 + 加权重算） ---------- */
 const _clusterBuckets={};
 for(const n of buildModel(D.life,D.hot,null).dataNodes){(_clusterBuckets[n.cluster]=_clusterBuckets[n.cluster]||[]).push(n.id);}
 const _clusterIdx=new Map();
 for(const [cid,ids] of Object.entries(_clusterBuckets)){ids.forEach((id,i)=>_clusterIdx.set(id,{i,total:ids.length,cid}));}
 function originalPosition(n){
  const c=groups.get(n.cluster), p=c.pos;
  const info=_clusterIdx.get(n.id)||{i:0,total:1,cid:n.cluster};
  const nTotal=Math.max(1,info.total);
  const angle=(nTotal>1?(info.i/nTotal)*Math.PI*2:0)+(rand(n.id,7)-.5)*0.3;
  const baseR=nTotal>9?1.55:nTotal>5?1.15:nTotal>2?0.8:0.45;
  const ring=(info.i%2===0)?1.0:0.55;
  const r=baseR*ring;
  const b=(rand(n.id,3)-.5)*baseR*0.7;
  return [p[0]+Math.cos(angle)*r, p[1]+Math.sin(angle)*r*0.82, p[2]+b];
 }
 function edgeStrength(edge,uncertainty){const u=clamp(uncertainty,0,1);if(edge.level==='A')return 1;if(edge.level==='B')return 0.12+u*0.85;return 0.035+u*0.22;}
 function compute(uncertainty=0.50,grade='all',model){
  const nodes=model.dataNodes.map(n=>({...n}));
  const edges=D.edges.filter(e=>grade==='all'||e.level===grade).map(e=>({...e,strength:edgeStrength(e,uncertainty)}));
  const scores=new Map(nodes.map(n=>[n.id,0]));
  const neighbors=new Map(nodes.map(n=>[n.id,new Set()]));
  for(const e of edges){scores.set(e.source,(scores.get(e.source)||0)+e.strength);scores.set(e.target,(scores.get(e.target)||0)+e.strength);neighbors.get(e.source)?.add(e.target);neighbors.get(e.target)?.add(e.source)}
  const basePositions=new Map(model.dataNodes.map(n=>[n.id,originalPosition(n)]));
  const top=[...scores.entries()].sort((a,b)=>b[1]-a[1]);
  const positions=new Map();
  for(const n of nodes){let base=basePositions.get(n.id).slice();
   const touch=edges.filter(e=>e.source===n.id||e.target===n.id);
   if(touch.length){let fx=0,fy=0,fz=0,ws=0;for(const e of touch){const other=basePositions.get(e.source===n.id?e.target:e.source);if(!other)continue;const w=e.strength*0.08;fx+=(other[0]-base[0])*w;fy+=(other[1]-base[1])*w;fz+=(other[2]-base[2])*w;ws+=w;}const q=1/(1+ws);base=[base[0]+fx*q,base[1]+fy*q,base[2]+fz*q];}
   positions.set(n.id,base);}
  const totalWeight=edges.reduce((a,e)=>a+e.strength,0);
  return {nodes,edges,scores,neighbors,positions,basePositions,top,totalWeight,grade,uncertainty,edgeCount:edges.length};
 }
 function neighborhood(graph,id,depth=1){let visited=new Set([id]);let frontier=new Set([id]);for(let step=0;step<depth;step++){let next=new Set();for(const n of frontier)for(const x of graph.neighbors.get(n)||[]){if(!visited.has(x)){visited.add(x);next.add(x)}}frontier=next;}return visited}
 function clusterCounts(model){return D.clusters.map(c=>({...c,nodes:model.dataNodes.filter(n=>n.cluster===c.id).length,edges:D.edges.filter(e=>model.nodeMap.get(e.source)?.cluster===c.id||model.nodeMap.get(e.target)?.cluster===c.id).length}))}
 function intervalComparison(model){const low=compute(.16,'all',model),high=compute(.88,'all',model);return {low,high,delta:high.totalWeight-low.totalWeight}}

 /* ---------- M2 镇聚焦视图：围绕锚点重组跨层节点 ----------
    产业在左环、外部在远端、生活特色在右环、事件在上环；位置确定性。
    返回 {items:[{id,name,kind,layer,color,pos,data}], links:[...]} */
 function townView(townName,layer,model){
  const anchor=model.anchorMap.get(townName);
  if(!anchor)return null;
  const aPos=originalPosition(anchor);
  const items=[];
  const links=[];
  items.push({id:anchor.id,name:townName,kind:'anchor',layer:'anchor',color:'#ffbc70',pos:aPos,data:anchor});
  const inds=model.industriesByTown.get(townName)||[];
  const extSet=new Set();
  inds.forEach((nid,i)=>{
   const n=model.nodeMap.get(nid);const ang=Math.PI*0.18+(i/Math.max(1,inds.length))*Math.PI*0.64;
   const r=1.65;
   items.push({id:nid,name:n.name,kind:'industry',layer:'industry',color:'#48c8ef',pos:[aPos[0]-Math.cos(ang)*r,aPos[1]+Math.sin(ang)*r*0.92,aPos[2]+(rand(nid,'tv')-.5)*0.6],data:n});
   // 外部城市
   D.edges.filter(e=>e.source===nid||e.target===nid).forEach(e=>{const other=e.source===nid?e.target:e.source;const on=model.nodeMap.get(other);if(on&&on.cluster==='external')extSet.add(other);});
  });
  [...extSet].forEach((extId,i)=>{const n=model.nodeMap.get(extId);items.push({id:extId,name:n.name,kind:'external',layer:'industry',color:'#b79cff',pos:[aPos[0]+2.45,aPos[1]+(i-0.5)*1.2,aPos[2]-0.3+(rand(extId,'tv')-.5)*0.5],data:n});});
  // 生活特色
  const feats=[...anchor.foods.map((t,i)=>({t,kind:'food',i})),...anchor.plays.map((t,i)=>({t,kind:'play',i:i+10}))];
  feats.forEach((f,i)=>{const ang=Math.PI*0.18+(i/Math.max(1,feats.length))*Math.PI*0.64;const r=1.65;
   items.push({id:'life:'+townName+':'+f.kind+f.i,name:f.t,kind:'feature',layer:'life',color:f.kind==='food'?'#ffd9a8':'#ffc98a',pos:[aPos[0]+Math.cos(ang)*r,aPos[1]+Math.sin(ang)*r*0.92,aPos[2]+(rand(f.t,'tv')-.5)*0.6],data:f});});
  // 事件
  const evs=model.eventsByTown.get(townName)||[];
  evs.forEach((e,i)=>{const x=Math.min(2.2,Math.max(-2.2,(i-(evs.length-1)/2)*1.5));items.push({id:'event:'+e.index,name:'事件',kind:'event',layer:'events',color:'#f2cd6b',pos:[aPos[0]+x,aPos[1]+2.15-Math.abs(i-(evs.length-1)/2)*0.25,aPos[2]+(rand('ev'+i,'tv')-.5)*0.5],data:e});});
  // 跨层边
  items.forEach(it=>{
   if(it.kind==='industry'||it.kind==='external')links.push({source:anchor.id,target:it.id,kind:'located_in',level:'A'});
   if(it.kind==='feature')links.push({source:anchor.id,target:it.id,kind:'has_feature',level:'B'});
   if(it.kind==='event')links.push({source:anchor.id,target:it.id,kind:'mentioned_in',level:it.data.verified_status==='已核验'?'A':'B'});
  });
  // 产业内部边 + 产业-外部边（镇内）
  const indSet=new Set(inds);
  D.edges.forEach(e=>{const a=e.source,b=e.target;
   const aIn=indSet.has(a)||extSet.has(a),bIn=indSet.has(b)||extSet.has(b);
   const aShown=items.some(x=>x.id===a),bShown=items.some(x=>x.id===b);
   if(aShown&&bShown&&(aIn||bIn))links.push({source:a,target:b,kind:e.kind,level:e.level,detail:e.detail});
  });
  return {anchor,items,links,industries:inds,events:evs,feats,external:[...extSet],layer};
 }
 return {D,groups,hash,rand,clamp,TOWN_16,STREETS,TOWN_NORMALIZE,TOWN_ALIASES,normalizeTown,nodeTowns,classifyEvent,normalizeLife,normalizeHot,buildAnchors,buildModel,diffSnapshots,compute,neighborhood,clusterCounts,intervalComparison,edgeStrength,originalPosition,townView};
})();
</script>
<script>
(()=>{'use strict';
const E=window.BOLUO_ENGINE,D=window.BOLUO_DATA;
const el=id=>document.getElementById(id), all=sel=>[...document.querySelectorAll(sel)];
const canvas=el('universeCanvas'), linkCanvas=el('linkCanvas'), ctx=linkCanvas.getContext('2d');
let gl=canvas.getContext('webgl2',{alpha:true,antialias:true,powerPreference:'high-performance'});
const fallbackCanvas=gl?null:canvas.getContext('2d');
const prefersReduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let width=window.innerWidth,height=window.innerHeight,dpr=1;
const S={mode:'universe',focusCluster:null,focusTown:null,layer:'industry',selected:null,path:[],grade:'all',uncertainty:.5,
 activeFlow:null,flowScenario:'mid',snapshotDiff:null,dataSource:'boot',
 rotate:false,yaw:-.18,pitch:-.17,distance:6.9,center:[0,0,0],aim:[0,0,0],targetDistance:6.9,drag:false,moved:false,mobileOpen:false,frame:0};
let M=E.buildModel(D.life,D.hot,null);
let G=E.compute(S.uncertainty,S.grade,M);
let TV=null;
const colorHex=s=>{let h=s.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255)};
const colorFor=group=>E.groups.get(group)?.color||'#97d8e8';
const TYPE_LABEL={eco:'生态水系',anchor:'链主企业',champ:'冠军企业',capillary:'配套企业',legacy:'镇村老厂',agri:'特色农业',gi:'地理标志',ext:'外部城市'};
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let toastTimer=0;
function toast(s){const x=el('toast');x.textContent=s;x.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.remove('show'),2700)}
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);width=window.innerWidth;height=window.innerHeight;for(const c of [canvas,linkCanvas]){c.width=Math.round(width*dpr);c.height=Math.round(height*dpr)}if(gl)gl.viewport(0,0,canvas.width,canvas.height);ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize,{passive:true});resize();
function project(p){const px=p[0]-S.center[0],py=p[1]-S.center[1],pz=p[2]-S.center[2];let ca=Math.cos(S.yaw),sa=Math.sin(S.yaw);let rx=ca*px-sa*pz,rz=sa*px+ca*pz;let cb=Math.cos(S.pitch),sb=Math.sin(S.pitch);let ry=cb*py-sb*rz;rz=sb*py+cb*rz;let depth=Math.max(1.6,S.distance-rz);const scale=Math.min(width,height)*1.35/depth;return {x:width*.51+rx*scale,y:height*.515-ry*scale,z:rz,depth,scale}}
function lerp(a,b,t){return a+(b-a)*t}
function interpolate(){const t=prefersReduced?.35:.065;S.center=S.center.map((v,i)=>lerp(v,S.aim[i],t));S.distance=lerp(S.distance,S.targetDistance,t);if(S.rotate&&!S.drag&&!prefersReduced)S.yaw+=.00125}
function focusedNode(){return S.selected?M.nodeMap.get(S.selected):null}
function getTV(){
 if(!S.focusTown)return null;
 if(!TV||TV.anchor.name!==S.focusTown||TV.layer!==S.layer)TV=E.townView(S.focusTown,S.layer,M);
 return TV;
}
/* ---------- 显示节点：全景 / 簇 / 镇 ---------- */
function townNodes(){
 const tv=getTV(),L=S.layer;
 return tv.items.map(it=>{
  let a=1,size;
  if(it.kind==='anchor'){size=34;a=1}
  else if(it.kind==='industry'){size=15;a=L==='industry'?1:.12}
  else if(it.kind==='external'){size=13;a=L==='industry'?.9:.1}
  else if(it.kind==='feature'){size=11;a=L==='life'?1:.18}
  else{size=12;a=L==='events'?1:.16}
  return {id:it.id,name:it.name,position:it.pos,color:it.color,size,alpha:a,kind:it.kind,raw:it};
 });
}
function displayNodes(){
 if(S.focusTown)return townNodes();
 const visible=[];
 if(!S.focusCluster){for(const c of D.clusters)visible.push({id:'cluster:'+c.id,name:c.name,cluster:c.id,position:c.pos,major:true,color:c.color,size:68,alpha:1});
  for(const n of M.dataNodes){if(E.rand(n.id,8)>.78)visible.push({...n,position:G.positions.get(n.id),color:colorFor(n.cluster),size:4.2,alpha:.34})}
  return visible}

async function getJSON(path){
 // 静态托管边缘代理偶发 503/网络抖动，做轻量重试（退避），三次仍失败才由调用方兜底
 let lastErr=null;
 for(let attempt=0;attempt<3;attempt++){
  const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),6500);
  try{
   const r=await fetch(path,{signal:ctrl.signal,cache:'no-store'});
   if(!r.ok)throw new Error('HTTP '+r.status);
   return await r.json();
  }catch(e){
   lastErr=e;
   if(attempt<2)await new Promise(res=>setTimeout(res,400*(attempt+1)));
  }finally{clearTimeout(t);}
 }
 throw lastErr;
}

 else if(okCount>0){S.dataSource='partial';chip.textContent='部分实时 · 已用兜底补齐';dot.className='pulse-dot snap';}
 else{S.dataSource='boot';chip.textContent='出厂快照 · '+(M.hot.updated||D.snapshot);dot.className='pulse-dot snap';}
}
async function loadData(){
 const r=await Promise.all([getJSON('../../hot.json').catch(()=>null),getJSON('../../life.json').catch(()=>null),getJSON('data/atlas.json').catch(()=>null)]);
 let ok=0;
 const hotRaw=r[0],lifeRaw=r[1],atlas=r[2];
 if(hotRaw)ok++;if(lifeRaw)ok++;if(atlas)ok++;
 const hot=E.normalizeHot(hotRaw)||D.hot;
 const life=E.normalizeLife(lifeRaw)||D.life;
 // 快照 diff（hot，按 url）
 try{const prev=JSON.parse(localStorage.getItem('boluo_prev_hot')||'null');
  if(prev)S.snapshotDiff=E.diffSnapshots(prev,hot);
  localStorage.setItem('boluo_prev_hot',JSON.stringify(hot));}catch(e){}
 M=E.buildModel(life,hot,atlas);

}

function chooseAt(x,y){
 const cand=displayNodes().map(n=>({...n,p:project(n.position)})).filter(n=>n.alpha>.3);
 cand.sort((a,b)=>Math.hypot(a.p.x-x,a.p.y-y)-Math.hypot(b.p.x-x,b.p.y-y));
 const v=cand[0];if(!v)return;
 const d=Math.hypot(v.p.x-x,v.p.y-y),max=v.major?68:Math.max(18,v.size*1.4);
 if(d>max)return;
 if(v.id.startsWith('cluster:'))openCluster(v.cluster);
 else selectNode(v.id);
}
canvas.addEventListener('pointerdown',e=>{S.drag=true;S.moved=false;pointer.x=e.clientX;pointer.y=e.clientY;pointer.dist=0;canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!S.drag)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;pointer.dist+=Math.abs(dx)+Math.abs(dy);if(pointer.dist>6)S.moved=true;S.yaw+=dx*.004;S.pitch=E.clamp(S.pitch+dy*.003,-1.12,1.12);pointer.x=e.clientX;pointer.y=e.clientY});
canvas.addEventListener('pointerup',e=>{if(!S.moved)chooseAt(e.clientX,e.clientY);S.drag=false});canvas.addEventListener('pointercancel',()=>S.drag=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();S.targetDistance=E.clamp(S.targetDistance+Math.sign(e.deltaY)*.35,3.2,11)},{passive:false});
let touchLast=0;canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(touchLast)S.targetDistance=E.clamp(S.targetDistance+(touchLast-d)*.012,3.2,11);touchLast=d}},{passive:true});canvas.addEventListener('touchend',()=>touchLast=0);
all('.mode-tab').forEach(b=>b.onclick=()=>mode(b.dataset.mode));
el('homeBtn').onclick=home;el('zoomIn').onclick=()=>S.targetDistance=E.clamp(S.targetDistance-.45,3.2,11);el('zoomOut').onclick=()=>S.targetDistance=E.clamp(S.targetDistance+.45,3.2,11);
el('autoRotate').onclick=()=>{S.rotate=!S.rotate;el('autoRotate').setAttribute('aria-pressed',String(S.rotate));toast(S.rotate?'自动旋转已开启':'自动旋转已关闭')};
el('backButton').onclick=back;
el('depthButton').onclick=()=>{if(!S.focusCluster&&!S.focusTown){openCluster('industry');return}if(S.mode!=='relations')mode('relations');else if(S.selected){S.targetDistance=E.clamp(S.targetDistance-.5,3.2,11);toast('已展开两度联系')}else toast('请先选择节点')};
el('evidenceButton').onclick=nextGrade;
el('mobileInfoButton').onclick=()=>S.mobileOpen?closeMobile():openMobile();
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.mobileOpen)closeMobile();else back()}if(e.key==='+'||e.key==='=')S.targetDistance=E.clamp(S.targetDistance-.35,3.2,11);if(e.key==='-')S.targetDistance=E.clamp(S.targetDistance+.35,3.2,11)});
window.__boluoDebug={get state(){return{mode:S.mode,focusCluster:S.focusCluster,focusTown:S.focusTown,layer:S.layer,selected:S.selected,grade:S.grade,uncertainty:S.uncertainty,score:G.totalWeight,webgl:!!gl,dataSource:S.dataSource}},
 getGraph:()=>({nodes:G.nodes.length,edges:G.edges.length,anchors:M.anchors.length,flows:M.flows.length}),
 openCluster,openNode:(id)=>selectNode(id),enterTown,setLayer,mode,home,back,loadData,
 setScenario:v=>{S.uncertainty=E.clamp(v,0,1);G=E.compute(S.uncertainty,S.grade,M);inspector();},
 getBounds:()=>({width,height})};
navigationUI();
loadData();
if(!gl)toast('设备不支持WebGL2，已启用二维节点备选');
console.log('看见博罗 V2（M2）；锚点',M.anchors.length,'流场区间',M.flows.length);
})();
</script>
