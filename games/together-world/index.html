<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>我们的小世界 · 免费试玩</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,"PingFang SC",sans-serif;background:#101b2a;color:#ffe9ca}canvas{width:100%;height:100%;position:fixed;inset:0;touch-action:none}.shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(#081523aa,transparent 30%,transparent 70%,#081523dd)}.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;padding:18px;gap:10px}.ui>*{pointer-events:auto}.top{display:flex;justify-content:space-between;gap:10px;align-items:start}.name{font-weight:800;font-size:clamp(20px,5vw,32px)}.muted{font-size:12px;color:#d4c8b5}.controls{display:flex;gap:8px;flex-wrap:wrap;max-width:660px}.btn{border:1px solid #d6bf9755;background:#243b52e8;color:#fff2d8;border-radius:14px;padding:11px 13px;font-size:13px;font-weight:650;cursor:pointer}.btn.main{background:#efd096;color:#352c25}.bottom{display:flex;flex-direction:column;gap:12px}.panel{background:#14273fdd;padding:12px 16px;border-radius:16px;max-width:600px;backdrop-filter:blur(8px);border:1px solid #e8c78e30}.panel p{font-size:12px;color:#ced3d6;margin:5px 0}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#0b1729d5;padding:18px;z-index:4}.modal{background:#1b3148;border:1px solid #e8c78e40;padding:25px;border-radius:24px;width:min(420px,100%);box-shadow:0 24px 65px #0008}.modal h1{margin:8px 0;font-size:27px}.modal p{font-size:14px;line-height:1.7;color:#cad8dd}.modal button,.modal input{width:100%;border-radius:12px;padding:12px;margin-top:9px;font:inherit}.modal button{background:#efd096;color:#32281c;border:0;font-weight:700}.modal input{background:#102338;color:white;border:1px solid #64798c}.hidden{display:none}#msg{position:fixed;z-index:6;left:50%;top:14%;transform:translateX(-50%);background:#111f31ed;padding:12px 18px;border-radius:15px;display:none;max-width:85%;text-align:center}small{font-size:11px;color:#9cbbce}@media(min-width:900px){.bottom{flex-direction:row;align-items:end;justify-content:space-between}.panel{width:280px}}</style></head>
<body><canvas id="scene"></canvas><div class="shade"></div><div class="ui"><div class="top"><div><div class="name">我们的小世界</div><div class="muted">一座岛 · 两个人的故事 · 免费试玩</div></div><button class="btn" id="sceneBtn">⛰ 换个地方</button></div><div class="bottom"><div class="controls"><button class="btn" data-act="tree">🌳 种树</button><button class="btn" data-act="bridge">🌉 修桥</button><button class="btn" data-act="lantern">🏮 点灯</button><button class="btn" data-act="tea">🍵 泡茶</button><button class="btn" data-act="stars">✨ 捡星叶</button><button class="btn" id="noteBtn">💌 留便签</button><button class="btn main" id="shareBtn">↗ 接力分享</button></div><div class="panel"><strong id="place">山间小屋</strong><p id="stats"></p><p id="record"></p><small>当前为浏览器存档 + 分享快照，不是实时云联机。</small></div></div></div><div id="welcome" class="overlay"><div class="modal"><small>无需账号 · 免费 · 手机可玩</small><h1>给彼此留一个<br>可以走进去的地方。</h1><p>你种一棵树，另一个人打开接力链接就能看到；对方留下变化，再把新链接交给你。先体验这一种最简单的共同生活。</p><input maxlength="14" id="who" placeholder="怎么称呼你？"><button id="start">进入小岛</button></div></div><div id="msg"></div>
<script>
const $=x=>document.getElementById(x),c=$('scene'),ctx=c.getContext('2d');
let w=0,h=0,t=0,who='',pos={x:.5,y:.75},target={x:.5,y:.75};
const places=['山间小屋','海边夜风','星空营地'];
const initial={scene:0,trees:0,bridge:false,lantern:false,tea:0,stars:0,notes:[],events:[]};
let state={...initial};
function save(){try{localStorage.setItem('together_world_demo_1',JSON.stringify(state))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('together_world_demo_1'));if(s&&typeof s==='object')state={...initial,...s};const arg=new URLSearchParams(location.search).get('world');if(arg){const parsed=JSON.parse(decodeURIComponent(escape(atob(arg.replace(/-/g,'+').replace(/_/g,'/')))));if(parsed&&typeof parsed==='object'&&Number.isInteger(parsed.scene)){state={...initial,...parsed};save();history.replaceState(null,'',location.pathname)}}}catch(e){}}
function tip(s){$('msg').textContent=s;$('msg').style.display='block';clearTimeout(window.tipTimer);window.tipTimer=setTimeout(()=>$('msg').style.display='none',3000)}
function track(s){state.events.unshift(s);state.events=state.events.slice(0,8);save();render()}
function render(){$('place').textContent=places[state.scene]||places[0];$('stats').textContent='🌳 '+state.trees+'棵树  ·  ✨ '+state.stars+'片星叶  ·  🍵 '+state.tea+'壶茶';$('record').textContent=state.events[0]||'世界正等着你留下第一个变化。'}
function action(a){if(a==='tree'){if(state.trees>=12)return tip('小岛已经种满树啦');state.trees++;track(who+'种下一棵树')}if(a==='bridge'){if(state.trees<1)return tip('先种一棵树，才能建桥');state.bridge=true;track(who+'修好一座桥')}if(a==='lantern'){state.lantern=!state.lantern;track(who+(state.lantern?'点亮了灯':'熄灭了灯'))}if(a==='tea'){state.tea++;track(who+'泡了一壶茶')}if(a==='stars'){state.stars++;track(who+'发现了一片星叶')}tip('世界发生了一点变化 ✨')}
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act));
$('sceneBtn').onclick=()=>{state.scene=(state.scene+1)%3;track(who+'走进'+places[state.scene])};
$('noteBtn').onclick=()=>{const m=prompt('给另一个人留一句话（最多100字）');if(!m)return;const s=m.trim().slice(0,100);if(!s)return;state.notes=[...state.notes.slice(-9),{by:who,text:s}];track(who+'留下便签：“'+s+'”');tip(s)};
$('shareBtn').onclick=async()=>{try{const encoded=btoa(unescape(encodeURIComponent(JSON.stringify(state)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');const url=location.origin+location.pathname+'?world='+encoded;if(url.length>3500)return tip('存档太大，请减少便签后再分享');if(navigator.share)await navigator.share({title:'我们的小世界',text:'我给你留了一个世界，进来继续玩吧',url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);tip('接力链接已复制，发给朋友吧')}else prompt('复制接力链接：',url)}catch(e){tip('分享未完成，可以重试')}};
$('start').onclick=()=>{who=$('who').value.trim().slice(0,14)||'小岛访客';$('welcome').classList.add('hidden');render();tip('点一下草地可以散步')};
function size(){const d=Math.min(window.devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=Math.floor(w*d);c.height=Math.floor(h*d);ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);
function poly(p,color){ctx.fillStyle=color;ctx.beginPath();p.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill()}
function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function paint(){t+=.016;const sky=ctx.createLinearGradient(0,0,0,h);if(state.scene===0){sky.addColorStop(0,'#234262');sky.addColorStop(1,'#d8a779')}else if(state.scene===1){sky.addColorStop(0,'#1e385c');sky.addColorStop(1,'#c97e89')}else{sky.addColorStop(0,'#101d41');sky.addColorStop(1,'#56568b')}ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);
circle(w*.75,h*.21,state.scene===2?35:48,state.scene===2?'#ffedd2':'#ffe5bb');
for(let i=0;i<45;i++){const x=((i*917)%997)/997*w,y=((i*193)%601)/601*h*.53;circle(x,y,1+(i%3===0?1:0),'#fff6cc80')}
poly([[0,h*.59],[w*.22,h*.36],[w*.4,h*.57],[w*.7,h*.31],[w,h*.62]],'#365766');
poly([[0,h*.66],[w*.3,h*.49],[w*.53,h*.63],[w*.82,h*.43],[w,h*.68]],'#3e716c');
ctx.fillStyle=state.scene===1?'#477b91':'#2e5772';ctx.fillRect(0,h*.66,w,h*.34);
ctx.beginPath();ctx.ellipse(w*.5,h*.77,Math.max(150,w*.36),h*.145,0,0,Math.PI*2);ctx.fillStyle='#456a54';ctx.fill();
ctx.beginPath();ctx.ellipse(w*.5,h*.74,Math.max(135,w*.32),h*.118,0,0,Math.PI*2);ctx.fillStyle='#789568';ctx.fill();
const x=w*.5,y=h*.665;ctx.fillStyle='#b88c6d';ctx.fillRect(x-48,y-40,96,48);poly([[x-62,y-41],[x,y-92],[x+62,y-41]],'#695049');ctx.fillStyle='#f4dca2';ctx.fillRect(x-29,y-28,17,15);ctx.fillStyle='#4a3632';ctx.fillRect(x+10,y-25,18,33);
for(let i=0;i<Math.min(state.trees,12);i++){const a=i*2.399,r=63+Math.sqrt(i)*24,px=w*.5+Math.cos(a)*r,py=h*.77+Math.sin(a)*r*.34;ctx.strokeStyle='#66503b';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px,py-35);ctx.stroke();circle(px,py-44,20,'#365c45');circle(px+8,py-49,15,'#648c63')}
if(state.bridge){ctx.strokeStyle='#dbb68b';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(w*.71,h*.77);ctx.quadraticCurveTo(w*.88,h*.60,w*.99,h*.78);ctx.stroke()}
if(state.lantern){circle(x+73,y-6,21,'#ffdf8d55');circle(x+73,y-6,9,'#ffcb68')}
ctx.fillStyle='#b38d66';ctx.fillRect(w*.27,h*.79,54,9);if(state.tea){circle(w*.29,h*.78,8,'#f2e6c2');ctx.strokeStyle='#d4e8db';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(w*.29,h*.76);ctx.quadraticCurveTo(w*.27,h*.73,w*.295,h*.71);ctx.stroke()}
pos.x+=(target.x-pos.x)*.055;pos.y+=(target.y-pos.y)*.055;const cx=w*pos.x,cy=h*pos.y;ctx.fillStyle='#e3ad7a';ctx.fillRect(cx-10,cy-12,21,33);circle(cx,cy-22,13,'#f4ca9f');circle(cx-5,cy-24,1.7,'#303a40');circle(cx+5,cy-24,1.7,'#303a40');
requestAnimationFrame(paint)}
c.addEventListener('pointerdown',e=>{target={x:Math.max(.06,Math.min(.94,e.clientX/w)),y:Math.max(.42,Math.min(.91,e.clientY/h))}});
load();size();paint();render();
</script></body></html>
