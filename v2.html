<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>博罗产业全息风洞 V2</title>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#030711;color:#e6edf3;font:13px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
#bg{position:fixed;inset:0;z-index:0}
#bg canvas{width:100%;height:100%;display:block}
/* 顶栏 */
.top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:linear-gradient(180deg,rgba(3,7,17,.92),transparent);pointer-events:none}
.top h1{font-size:16px;letter-spacing:.5px;pointer-events:auto}
.top h1 b{color:#4ade80}
.ver{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;font-size:10px;font-weight:800;
  padding:2px 8px;border-radius:9px;letter-spacing:1px}
.blood{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;font-size:10px;pointer-events:auto}
.blood span{padding:2px 7px;border-radius:7px;background:rgba(14,21,35,.7);border:1px solid #1c2739;color:#93a4bd;backdrop-filter:blur(6px)}
.blood .g{color:#4ade80;border-color:#166534}
.blood .y{color:#fbbf24;border-color:#854d0e}
.blood .r{color:#f87171;border-color:#7f1d1d}
/* 苗头条 */
.shockbar{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);z-index:10;
  display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:96vw;
  padding:9px 12px;background:rgba(10,18,36,.78);border:1px solid rgba(56,189,248,.25);
  border-radius:30px;backdrop-filter:blur(10px)}
.shockbar .lab{font-size:11px;color:#fca5a5;align-self:center}
.sbtn{background:rgba(30,18,22,.7);color:#fca5a5;border:1px solid #7f1d1d;padding:7px 13px;border-radius:20px;
  font-size:12px;cursor:pointer;transition:.15s;backdrop-filter:blur(6px)}
.sbtn.on{background:#dc2626;border-color:#f87171;color:#fff;font-weight:700;box-shadow:0 0 18px rgba(239,68,68,.5)}
#resetBtn{background:rgba(19,28,43,.8);color:#93a4bd;border:1px solid #22304a;padding:7px 13px;border-radius:20px;font-size:12px;cursor:pointer}
/* 信息卡 */
.info{position:fixed;bottom:140px;left:12px;right:12px;z-index:10;max-width:680px;margin:auto;
  background:rgba(10,18,36,.85);border:1px solid rgba(239,68,68,.35);border-radius:14px;
  padding:13px 15px;font-size:12.5px;line-height:1.75;color:#cbd5e1;backdrop-filter:blur(12px);
  display:none;max-height:38vh;overflow:auto}
.info.show{display:block;animation:fd .4s ease-out}
.info .t{color:#f87171;font-weight:800;font-size:13.5px}
.info .dim{color:#7d8fa8;font-size:11px}
.info b.k{color:#fca5a5}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 底部 */
.foot{position:fixed;bottom:0;left:0;right:0;z-index:9;padding:7px 14px;
  background:linear-gradient(0deg,rgba(3,7,17,.95),transparent);
  font-size:10.5px;color:#5b6b82;text-align:center}
.foot b{color:#94a3b8}
/* tooltip */
.tip{position:fixed;pointer-events:none;background:rgba(10,18,36,.96);border:1px solid #22304a;
  border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.6;color:#cbd5e1;
  max-width:220px;display:none;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.tip b{color:#fff}
.tip .town{color:#fbbf24;font-size:10.5px}
.tip .desc{color:#94a3b8;margin-top:3px;font-size:11px}
.hint{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:9;
  font-size:10.5px;color:#475569;pointer-events:none;letter-spacing:1px}
</style></head><body>
<div id="bg"></div>
<div class="hint">🔄 拖动旋转 · 双指缩放 · 点节点看详情</div>

<div class="top">
  <h1>博罗产业全息风洞 <span class="ver">V2</span></h1>
  <div class="blood">
    <span class="g">● 公开硬数据</span>
    <span class="y">● 合理估算</span>
    <span class="r">● 待内网</span>
  </div>
</div>

<div class="info" id="info"></div>

<div class="shockbar">
  <span class="lab">💥 苗头</span>
  <button class="sbtn" data-shock="xwd" data-kinds="供应链,资源竞争" data-name="链主飞走（欣旺达/锂威总部外迁）">A 链主飞走</button>
  <button class="sbtn" data-shock="dj" data-kinds="环保约束,供应链" data-name="东江喊停（沿江环保限产）">B 东江喊停</button>
  <button class="sbtn" data-shock="lq" data-kinds="资源竞争,供应链" data-name="老厂腾退（亩均改造）">C 老厂腾退</button>
  <button class="sbtn" data-shock="mj" data-kinds="供应链" data-name="外溢断流（东莞外溢减弱·石湾模具首当其冲）">D 外溢断流</button>
  <button id="resetBtn">↺</button>
</div>

<div class="foot">
  博罗家底：GDP 1005亿（2025广东首个千亿县）· 电子信息770亿 · 工业用电60亿度+11.5% · <b>小巨人10家 / 专精特新165家 / 高企686家</b><br>
  全息沙盘＝可被重跑的产业世界，不预测、不替人拍板。节点依据公开报告搭建，内网数据接入后重算。<b>欢迎质疑、改参数、重跑。</b>
</div>
<div class="tip" id="tip"></div>

<script>
const rawNodes=[
  {id:"dj",name:"东江",type:"terrain",town:"沿江多镇",desc:"母亲河·饮用水源Ⅱ类·沿江镇街排污上限——它是地形，不是产业"},
  {id:"lswh",name:"环两山",type:"terrain",town:"长宁/横河/福田",desc:"南昆山-罗浮山·北部绿色屏障——它是生态背景，不是产业"},
  {id:"xwd",name:"欣旺达/锂威",type:"anchor",town:"园洲",desc:"锂电池·深圳总部订单·高用电·高外部依赖"},
  {id:"htd",name:"华通电脑",type:"anchor",town:"园洲/石湾",desc:"电子信息770亿基本盘代表·规上300多家之一"},
  {id:"zw",name:"正威新材料",type:"anchor",town:"罗阳",desc:"25万吨铜杆/年·重资产原材料底座"},
  {id:"jq",name:"嘉奇新能源",type:"anchor",town:"园洲",desc:"奇瑞系·深博福田产业园2026开园·梯次电池基地"},
  {id:"jf",name:"江丰精密",type:"anchor",town:"园洲",desc:"溅射靶材全球第一·3纳米"},
  {id:"bmc",name:"表面处理集群",type:"capillary",town:"龙溪·金茂园",desc:"2025省级特色集群·年产值超50亿·省内最大电镀基地·受东江环保约束"},
  {id:"mj",name:"石湾模具群落",type:"capillary",town:"石湾",desc:"全镇2461家工业企业·承接东莞外溢·客户特斯拉/比亚迪/拓竹"},
  {id:"ddc",name:"电动车配套群落",type:"capillary",town:"石湾",desc:"台铃/小刀/新日/绿佳·智能出行全产业链"},
  {id:"sr",name:"散热产业集群",type:"capillary",town:"多镇",desc:"2026省级特色集群·电子散热配套"},
  {id:"lq",name:"传统老厂存量",type:"legacy",town:"园洲/龙溪/罗阳",desc:"园洲桔龙制衣（金丰/骏达）+五金塑胶三旧改造（环亚/立泰）+纸品建材·数千家小微·用电+11.5%大头·亩均达标压力"},
  {id:"dl",name:"电力保障",type:"infra",town:"全县电网",desc:"1-8月工业用电60亿度+11.5%·变电站负荷是硬约束"},
  {id:"pk1",name:"智能装备产业园",type:"park",town:"罗阳/园洲",desc:"承载欣旺达/正威等重资产项目的空间载体"},
  {id:"pk2",name:"深博福田产业园",type:"park",town:"园洲",desc:"2026年6月全面开园·21宗项目·嘉奇/欣旺达入驻·福田总部+博罗基地"},
  {id:"bss",name:"百岁山",type:"agri",town:"湖镇",desc:"374万吨/年·罗浮山水源·真成了产业的农产品"},
  {id:"lfs",name:"罗浮山文旅",type:"agri",town:"长宁",desc:"5A景区·国庆引领区91万人次/4.6亿·民宿入住率78%·道教第七洞天"},
  {id:"lfsgy",name:"罗浮山国药",type:"agri",town:"长宁",desc:"中华老字号·近1000员工·片剂150亿片/年·红脚艾"},
  {id:"sb",name:"石坝胡须鸡",type:"agri",town:"石坝",desc:"全国名特优新·真成了产业的农业"},
  {id:"hh",name:"横河户外小镇",type:"agri",town:"横河",desc:"华南户外水经济港·承接大湾区客流"},
];
const rawEdges=[
  ["mj","ddc",2,"供应链"],["bmc","ddc",2,"供应链"],["jf","htd",2,"供应链"],
  ["xwd","mj",2,"供应链"],
  ["jq","ddc",2,"供应链"],["lq","htd",2,"供应链"],["sr","htd",2,"供应链"],
  ["zw","xwd",2,"供应链"],
  ["dj","bmc",3,"环保约束"],["dj","bss",3,"环保约束"],["dj","lq",1,"环保约束"],
  ["xwd","lq",1,"资源竞争"],["htd","lq",1,"资源竞争"],
  ["lswh","lfsgy",3,"生态补偿"],["lswh","hh",2,"生态补偿"],["lswh","lfs",3,"生态补偿"],
  ["lfs","lfsgy",2,"供应链"],["lfs","bss",2,"供应链"],
  ["dl","xwd",3,"设施承载"],["dl","htd",2,"设施承载"],["dl","lq",2,"设施承载"],
  ["pk1","xwd",2,"载体承载"],["pk1","zw",2,"载体承载"],["pk2","jq",3,"载体承载"],
];
// 仲恺式8位势：链主/配套/设施/载体/生态/农业/地标/外部
const typeColor={anchor:0x3b5bdb,capillary:0x0e7490,infra:0x64748b,park:0x65a30d,
  eco:0x0ea5e9,agri:0xa3e635,gi:0x4ade80,ext:0xa78bfa,legacy:0xa16207,terrain:0x38bdf8};
const edgeColor={供应链:0x38bdf8,环保约束:0xef4444,资源竞争:0xf59e0b,生态补偿:0x0ea5e9,
  设施承载:0x94a3b8,载体承载:0x84cc16};
const radius={anchor:11,capillary:7,infra:6,park:7,eco:11,agri:5,gi:4.5,ext:5,legacy:6};

// ===== Three.js 场景 =====
const bg=document.getElementById("bg");
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x030711,0.0012);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,2000);
let renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
}catch(e){
  bg.innerHTML='<div style="color:#f87171;padding:40px;text-align:center;font-size:13px">此设备不支持 WebGL，全息舞台无法渲染。<br>请用较新的手机浏览器或电脑 Chrome 打开。</div>';
  throw e;
}
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
bg.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,0.4));
const key=new THREE.PointLight(0x88ccff,1.2,800);key.position.set(100,150,100);scene.add(key);

// 节点按层摆到球壳上：上=生态农业，中=工业
const layerR={anchor:55,capillary:105,infra:145,park:145,eco:90,agri:100,gi:95,ext:210,terrain:0,legacy:130};
const nodes=rawNodes.map(d=>{
  if(d.type==='terrain' && d.id==='dj'){
    return Object.assign({},d,{pos:new THREE.Vector3(-20,-22,0),baseColor:0x38bdf8});
  }
  if(d.type==='terrain' && d.id==='lswh'){
    return Object.assign({},d,{pos:new THREE.Vector3(0,85,0),baseColor:0x4ade80});
  }
  const R=layerR[d.type];
  const same=rawNodes.filter(x=>x.type===d.type);
  const idx=same.indexOf(d);
  const ang=(idx/same.length)*Math.PI*2;
  let y=(d.type==='agri')?55+Math.sin(ang)*18:Math.sin(ang)*R*0.4;
  return Object.assign({},d,{
    pos:new THREE.Vector3(Math.cos(ang)*R, y, Math.sin(ang)*R),
    baseColor:typeColor[d.type]
  });
});
const nodeById={};nodes.forEach(n=>nodeById[n.id]=n);

// 创建节点mesh：外层光晕+内层核心+标签
const group=new THREE.Group();scene.add(group);
const nodeMeshes={};
nodes.forEach(n=>{
  // 标签sprite——放在节点下方
  const c=document.createElement('canvas');c.width=256;c.height=56;
  const ctx=c.getContext('2d');ctx.font='bold 24px sans-serif';ctx.fillStyle='#d6e8ff';
  ctx.textAlign='center';ctx.fillText(n.name,128,36);
  const tex=new THREE.CanvasTexture(c);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,opacity:0.7,depthTest:false}));

  if(n.type==='terrain' && n.id==='dj'){
    // 东江：蜿蜒蓝色光带（TubeGeometry）
    const pts=[
      new THREE.Vector3(-240,-25,-40),
      new THREE.Vector3(-140,-20,15),
      new THREE.Vector3(-50,-24,-20),
      new THREE.Vector3(40,-20,25),
      new THREE.Vector3(130,-26,-15),
      new THREE.Vector3(230,-22,20),
    ];
    const curve=new THREE.CatmullRomCurve3(pts);
    const tube=new THREE.TubeGeometry(curve,60,2.2,8,false);
    const mesh=new THREE.Mesh(tube,new THREE.MeshBasicMaterial({color:0x38bdf8,transparent:true,opacity:0.45}));
    group.add(mesh);
    sp.position.copy(n.pos).y-=10;sp.scale.set(90,20,1);
    group.add(sp);
    nodeMeshes[n.id]={river:mesh,label:sp,pos:n.pos,terrain:true};
    return;
  }
  if(n.type==='terrain' && n.id==='lswh'){
    // 环两山：绿色粒子雾团
    const g=new THREE.BufferGeometry();
    const p=[];
    for(let i=0;i<400;i++){
      const r=50+Math.random()*50,a=Math.random()*Math.PI*2;
      p.push(Math.cos(a)*r, 70+Math.random()*35, Math.sin(a)*r);
    }
    g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
    const mist=new THREE.Points(g,new THREE.PointsMaterial({color:0x4ade80,size:3.5,transparent:true,opacity:0.3}));
    group.add(mist);
    sp.position.copy(n.pos).y+=25;sp.scale.set(100,22,1);
    group.add(sp);
    nodeMeshes[n.id]={mist:mist,label:sp,pos:n.pos,terrain:true};
    return;
  }

  const r=radius[n.type];
  const glow=new THREE.Mesh(
    new THREE.SphereGeometry(r*1.9,16,16),
    new THREE.MeshBasicMaterial({color:n.baseColor,transparent:true,opacity:0.12})
  );
  const core=new THREE.Mesh(
    new THREE.SphereGeometry(r,20,20),
    new THREE.MeshStandardMaterial({color:n.baseColor,emissive:n.baseColor,emissiveIntensity:0.6,transparent:true,opacity:0.95})
  );
  const ring=new THREE.Mesh(
    new THREE.SphereGeometry(r*1.15,16,16),
    new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.25,wireframe:false})
  );
  glow.position.copy(n.pos);core.position.copy(n.pos);ring.position.copy(n.pos);
  group.add(glow);group.add(core);group.add(ring);
  sp.scale.set(r*9,r*2,1);sp.position.copy(n.pos).y-=r+7;
  group.add(sp);
  nodeMeshes[n.id]={glow,core,ring,label:sp,pos:n.pos};
});

// 边：静态线 + 流动粒子
const lines={},particles=[];
rawEdges.forEach((e,i)=>{
  const s=nodeById[e[0]],t=nodeById[e[1]];
  const g=new THREE.BufferGeometry().setFromPoints([s.pos,t.pos]);
  const m=new THREE.LineBasicMaterial({color:edgeColor[e[3]],transparent:true,opacity:0.35});
  const line=new THREE.Line(g,m);group.add(line);
  lines[e[0]+'-'+e[1]]=line;
  // 流动粒子
  const p=new THREE.Mesh(new THREE.SphereGeometry(1.5,8,8),
    new THREE.MeshBasicMaterial({color:edgeColor[e[3]],transparent:true,opacity:0.9}));
  p.userData={s:s.pos,e:t.pos,t:Math.random(),w:e[2]};
  group.add(p);particles.push(p);
});

// 背景星尘
const starsGeo=new THREE.BufferGeometry();
const starPos=[];for(let i=0;i<400;i++){starPos.push((Math.random()-0.5)*800,(Math.random()-0.5)*800,(Math.random()-0.5)*800-200);}
starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));
scene.add(new THREE.Points(starsGeo,new THREE.PointsMaterial({color:0x3a5a8a,size:1,transparent:true,opacity:0.6})));

// ===== 轨道相机（自己写，不依赖OrbitControls）=====
let rotY=0.6,rotX=-0.15,dist=260;
let drag=false,px=0,py=0,moved=0;
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;moved=0;});
addEventListener('pointermove',e=>{if(!drag)return;
  const dx=e.clientX-px,dy=e.clientY-py;moved+=Math.abs(dx)+Math.abs(dy);
  rotY+=dx*0.006;rotX+=dy*0.006;rotX=Math.max(-1.4,Math.min(1.4,rotX));px=e.clientX;py=e.clientY;});
addEventListener('pointerup',()=>drag=false);
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();
  dist+=e.deltaY*0.2;dist=Math.max(120,Math.min(600,dist));},{passive:false});
// 双指缩放
let lastPinch=0;
renderer.domElement.addEventListener('touchmove',e=>{
  if(e.touches.length===2){e.preventDefault();
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(lastPinch)dist+=(lastPinch-d)*0.5;dist=Math.max(120,Math.min(600,dist));lastPinch=d;}
},{passive:false});
renderer.domElement.addEventListener('touchend',()=>lastPinch=0);

// 点选节点
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
const tip=document.getElementById('tip');
renderer.domElement.addEventListener('click',e=>{
  if(moved>5)return; // 拖拽后不触发click
  mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const meshes=Object.values(nodeMeshes).map(m=>m.core);
  const hit=ray.intersectObjects(meshes)[0];
  if(hit){const id=Object.keys(nodeMeshes).find(k=>nodeMeshes[k].core===hit.object);
    const n=nodeById[id];
    tip.style.display='block';
    tip.innerHTML=`<b>${n.name}</b> <span class="town">${n.town}</span><div class="desc">${n.desc}</div>`;
    tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';
  } else tip.style.display='none';
});
addEventListener('click',e=>{if(e.target.closest('.shockbar')||e.target.closest('.top'))return;
  if(!e.target.closest('canvas'))tip.style.display='none';});

// ===== 苗头级联 =====
function parseKinds(s){return new Set((s||'供应链,资源竞争').split(','));}
function bfs(seedId,kinds){
  const level={};level[seedId]=1;const layers=[[seedId]];
  let frontier=[seedId],hop=0;
  while(frontier.length&&hop<4){hop++;const next=[];
    frontier.forEach(nid=>{rawEdges.forEach(e=>{
      if(!kinds.has(e[3]))return;
      const oth=(e[0]===nid)?e[1]:(e[1]===nid?e[0]:null);
      if(!oth||level[oth]!==undefined)return;
      level[oth]=Math.max(0.18,1-hop*0.26-(5-e[2])*0.05);next.push(oth);
    });});
    layers.push(next);frontier=next;}
  return {level,layers};
}
const info=document.getElementById('info');
function resetShock(){
  info.classList.remove('show');
  document.querySelectorAll('.sbtn').forEach(b=>b.classList.remove('on'));
  nodes.forEach(n=>{const m=nodeMeshes[n.id];if(m.terrain)return;
    m.core.material.color.setHex(n.baseColor);
    m.core.material.emissive.setHex(n.baseColor);
    m.core.material.emissiveIntensity=0.6;
    m.core.material.opacity=0.95;
    m.glow.material.color.setHex(n.baseColor);m.glow.material.opacity=0.12;
    m.ring.material.opacity=0.25;
    m.label.material.opacity=0.9;});
  rawEdges.forEach(e=>{const k=e[0]+'-'+e[1];if(lines[k]){lines[k].material.color.setHex(edgeColor[e[3]]);lines[k].material.opacity=0.35;}});
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
}
function runShock(seedId,seedName,kindsStr){
  const kinds=parseKinds(kindsStr);
  const kindLabel={供应链:'供货关系',资源竞争:'抢地抢电',环保约束:'环保红线'};
  const kindText=[...kinds].map(k=>kindLabel[k]||k).join(' / ');
  const {level,layers}=bfs(seedId,kinds);
  const hitE=new Set();
  Object.keys(level).forEach(nid=>{rawEdges.forEach(e=>{
    if(!kinds.has(e[3]))return;
    if((e[0]===nid&&level[e[1]]!==undefined)||(e[1]===nid&&level[e[0]]!==undefined))hitE.add(e[0]+'-'+e[1]);
  });});
  // 先全部压暗
  nodes.forEach(n=>{if(level[n.id]===undefined){const m=nodeMeshes[n.id];if(m.terrain)return;
    m.core.material.opacity=0.15;m.glow.material.opacity=0.02;m.label.material.opacity=0.1;}});
  rawEdges.forEach(e=>{const k=e[0]+'-'+e[1];if(lines[k]){
    lines[k].material.opacity=hitE.has(k)?0.9:0.03;
    lines[k].material.color.setHex(hitE.has(k)?0xef4444:edgeColor[e[3]]);}});
  // 逐层点亮
  layers.forEach((layer,i)=>{setTimeout(()=>{layer.forEach(id=>{
    let col;
    if(level[id]===1)col=0xffffff;
    else if(level[id]>0.55)col=0xef4444;
    else if(level[id]>0.32)col=0xf97316;
    else col=0xfacc15;
    const m=nodeMeshes[id];if(m.terrain)return;
    m.core.material.color.setHex(col);m.core.material.emissive.setHex(col);
    m.core.material.emissiveIntensity=1.5;m.core.material.opacity=1;
    m.glow.material.color.setHex(col);m.glow.material.opacity=0.4;
    m.label.material.opacity=1;
  });},i*460);});
  const hop1=(layers[1]||[]).map(id=>nodeById[id].name);
  const hop2=(layers[2]||[]).map(id=>nodeById[id].name);
  const total=Object.keys(level).length-1;
  info.classList.add('show');
  info.innerHTML=`<span class="t">💥 ${seedName}</span>
    <div>沿 <b class="k">${kindText}</b> 级联，波及 <b class="k">${total}</b> 节点、${layers.length-1} 层。</div>
    <div><b class="k">① 抵抗（第1层直接受影响）</b>：${hop1.length?hop1.join('、'):'—'}</div>
    <div><b class="k">② 传导（第2层+）</b>：${hop2.length?hop2.join('、'):'末梢已衰减为黄色'}</div>
    <div class="dim">颜色越红＝离苗头越近；越黄＝传得越远衰减越多。这是按公开关系规则做的级联演示，不是预测真实损失，可质疑、可重跑。</div>`;
  try{history.replaceState(null,'','#shock='+seedId);}catch(e){}
}
document.querySelectorAll('.sbtn').forEach(btn=>{
  btn.onclick=(e)=>{e.stopPropagation();
    const on=btn.classList.contains('on');
    document.querySelectorAll('.sbtn').forEach(b=>b.classList.remove('on'));
    if(on){resetShock();return;}
    btn.classList.add('on');
    runShock(btn.dataset.shock,btn.dataset.name,btn.dataset.kinds);};
});
document.getElementById('resetBtn').onclick=(e)=>{e.stopPropagation();resetShock();};
const m=location.hash.match(/shock=(\w+)/);
if(m){const btn=document.querySelector(`.sbtn[data-shock="${m[1]}"]`);
  if(btn){btn.classList.add('on');runShock(m[1],btn.dataset.name,btn.dataset.kinds);}}

// ===== 动画循环 =====
const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const t=clock.getElapsedTime();
  // 相机轨道
  camera.position.set(
    dist*Math.cos(rotX)*Math.sin(rotY),
    dist*Math.sin(rotX),
    dist*Math.cos(rotX)*Math.cos(rotY)
  );
  camera.lookAt(0,0,0);
  // 粒子沿边流动
  particles.forEach(p=>{
    p.userData.t+=0.004+p.userData.w*0.001;
    if(p.userData.t>1)p.userData.t=0;
    p.position.lerpVectors(p.userData.s,p.userData.e,p.userData.t);
  });
  // 节点微微浮动
  nodes.forEach((n,i)=>{const m=nodeMeshes[n.id];if(m.terrain)return;
    m.core.position.y=n.pos.y+Math.sin(t*1.2+i)*1.2;
    m.glow.position.copy(m.core.position);
    m.ring.position.copy(m.core.position);
    m.label.position.y=m.core.position.y-radius[n.type]-7;});
  renderer.render(scene,camera);
}
tick();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
