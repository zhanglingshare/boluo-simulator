function translate(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i]').forEach(e=>{const v=tr[e.dataset.i];if(v)e.textContent=v[lang==='zh'?0:1]});$('lang').textContent=lang==='zh'?'English':'中文';$('sound').querySelector('span').textContent=tr.sound[lang==='zh'?0:1];drawWorld();if($('work').classList.contains('open'))renderWork();}

function renderWork(){let w=worlds[world],isCord=w.task==='cord',i=lang==='zh'?0:1;$('workLocale').textContent=w.where[i]+' · '+w.year[i];$('workTitle').textContent=w.mission[i];$('mode').classList.toggle('active',modern);$('mode').querySelector('span').textContent=modern?Q('关闭现代分析','Hide modern analysis'):Q('开启现代分析','Show modern analysis');$('materialChoices').innerHTML=materials[w.task].map((v,j)=>'<button class="choice '+(material===j?'chosen':'')+'" data-idx="'+j+'">'+(lang==='zh'?v.zh:v.en)+'<small>'+Q('材料 '+(j+1),'Material '+(j+1))+'</small></button>').join('');$('materialChoices').querySelectorAll('button').forEach(b=>b.onclick=()=>{material=Number(b.dataset.idx);attempt=0;quality=0;damage=0;edge=0;twist=0;prevDir=0;completed=false;$('testResult').classList.remove('on');renderWork()});$('stoneCanvas').style.display=isCord?'none':'block';$('cordCanvas').style.display=isCord?'block':'none';$('lab').classList.toggle('on',modern);let m=materials[w.task][material];$('labCopy').textContent=isCord?Q('Cord behaviour depends on fibre length, surface friction, tension and twisting sequence. These values are illustrative.','绳索表现受纤维长度、摩擦、张力与捻合顺序影响，以下数值仅用于玩法。'):Q('Fracture depends on stone heterogeneity, strike location and impact. A stronger hit is not always better.','破裂受石料非均匀性、打击位置及冲击影响；打得越重未必越好。');$('labCopy').textContent+=' · '+Q('Material profile ','材料示意 ')+' '+m.tough+'/'+m.brittle+'/'+m.edge;$('benchTip').textContent=isCord?Q('Swipe left and right in alternating directions across the strands.','在纤维上交替向左、向右滑动，完成捻合。'):Q('Tap different places along the highlighted rim. Repeated hits in one place can ruin the core.','点击石核边缘的不同位置。反复敲同一处会损坏石核。');updateMeters();drawBench()}
function updateMeters(){let w=worlds[world];let cord=w.task==='cord';let labels=cord?[Q('Twist consistency','捻合一致性'),Q('Cord strength','绳索强度'),Q('Damage','损伤')]:[Q('Useful edge','有效刃口'),Q('Core integrity','石核完整度'),Q('Attempts','敲击次数')];labels.forEach((t,j)=>$('meterLabel'+(j+1)).textContent=t);let a=cord?[Math.min(100,twist*10),Math.min(100,quality),Math.min(100,damage)]:[Math.min(100,edge),Math.max(0,100-damage),Math.min(100,attempt*13)];a.forEach((n,j)=>$('meter'+(j+1)).style.width=n+'%');$('feedback').textContent=cord?(twist===0?Q('Make your first swipe on the strands. Alternate directions to keep the twist balanced.','先在纤维上滑动。交替捻合才能保持相对均衡。'):Q('Twists: '+twist+' · Strength: '+Math.round(quality)+' · Damage: '+damage,'已捻合 '+twist+' 次 · 强度 '+Math.round(quality)+' · 损伤 '+damage)):attempt===0?Q('Observe the striking ridge and choose your first impact point.','观察石块突出的棱，选择第一次打击位置。'):Q('Strikes: '+attempt+' · Edge: '+Math.round(edge)+' · Core damage: '+damage,'敲击 '+attempt+' 次 · 刃口 '+Math.round(edge)+' · 石核损伤 '+damage);}
const canv=$('stoneCanvas'),cx=canv.getContext('2d'),cc=$('cordCanvas').getContext('2d');let hitMarks=[],lastStrike={x:0,y:0};function drawBench(){const w=worlds[world];if(w.task==='cord'){drawCord();return}cx.clearRect(0,0,720,470);let g=cx.createRadialGradient(350,220,30,360,270,310);g.addColorStop(0,'#766b5c');g.addColorStop(1,'#292925');cx.fillStyle=g;cx.fillRect(0,0,720,470);cx.fillStyle='#141a18aa';cx.beginPath();cx.ellipse(350,380,222,39,0,0,Math.PI*2);cx.fill();const points=[[190,175],[258,99],[388,84],[512,154],[548,278],[423,351],[263,335],[185,255]];cx.beginPath();points.forEach(([x,y],i)=>i?cx.lineTo(x,y):cx.moveTo(x,y));cx.closePath();cx.fillStyle=['#777b75','#87817c','#827f74'][material];cx.fill();cx.lineWidth=6;cx.strokeStyle='#c7b9a0';cx.stroke();cx.beginPath();cx.moveTo(190,175);cx.lineTo(335,182);cx.lineTo(388,84);cx.moveTo(335,182);cx.lineTo(548,278);cx.lineTo(423,351);cx.moveTo(335,182);cx.lineTo(263,335);cx.strokeStyle='#e4d6b352';cx.lineWidth=4;cx.stroke();cx.beginPath();cx.moveTo(263,335);cx.lineTo(185,255);cx.lineTo(190,175);cx.strokeStyle='#252927a6';cx.lineWidth=5;cx.stroke();let impactPoints=[[256,122],[378,99],[508,184],[516,291],[397,338],[259,317],[196,246],[205,181]];impactPoints.forEach(([x,y],i)=>{let hit=hitMarks.filter(h=>h.zone===i).length;cx.beginPath();cx.arc(x,y,20+hit*2,0,Math.PI*2);cx.fillStyle=hit?'#f8c87955':'#d8b27c33';cx.fill();cx.strokeStyle=hit?'#ecb55b':'#d9c396af';cx.lineWidth=2;cx.stroke();cx.fillStyle='#fff4d1';cx.font='bold 18px system-ui';cx.textAlign='center';cx.fillText(hit?String(hit):'✦',x,y+6)});hitMarks.forEach((h,i)=>{cx.beginPath();cx.moveTo(h.x,h.y);cx.lineTo(h.x-21+(i%3)*9,h.y+30);cx.lineTo(h.x+11,h.y+34);cx.closePath();cx.fillStyle='#eee3c9bb';cx.fill()});if(attempt>0){cx.fillStyle='#ffe0ad';cx.font='bold 20px system-ui';cx.fillText(Q('Flakes removed: '+attempt,'已剥片：'+attempt),350,45)} }
function drawCord(){cc.clearRect(0,0,720,470);let g=cc.createLinearGradient(0,0,720,470);g.addColorStop(0,'#524a37');g.addColorStop(1,'#292f27');cc.fillStyle=g;cc.fillRect(0,0,720,470);cc.lineCap='round';for(let k=0;k<12;k++){cc.beginPath();let y=85+k*24;for(let x=130;x<=590;x+=8){let wave=Math.sin(x*.035+twist*.7+k*.4)*Math.min(14,twist*1.3);if(x===130)cc.moveTo(x,y);else cc.lineTo(x,y+wave)}cc.lineWidth=4.5+(material===1?1:0);cc.strokeStyle=['#b99455','#d9c88e','#b9a269'][material];cc.stroke()}cc.fillStyle='#ead4a7';cc.font='bold 21px system-ui';cc.textAlign='center';cc.fillText(Q('SWIPE  ⇄  TO TWIST','左右滑动 ⇄ 捻合'),360,47);cc.fillStyle='#d7b77d';cc.fillRect(118,75,10,310);cc.fillRect(592,75,10,310);}
function stoneHit(evt){if(worlds[world].task==='cord'||completed)return;const r=canv.getBoundingClientRect(),x=(evt.clientX-r.left)/r.width*720,y=(evt.clientY-r.top)/r.height*470;const pts=[[256,122],[378,99],[508,184],[516,291],[397,338],[259,317],[196,246],[205,181]];let closest=pts.map((p,i)=>({i,dist:Math.hypot(p[0]-x,p[1]-y)})).sort((a,b)=>a.dist-b.dist)[0];if(closest.dist>75){toast(Q('Strike nearer the marked stone rim.','请敲击石核标出的边缘。'));return}let repeats=hitMarks.filter(h=>h.zone===closest.i).length;attempt++;let m=materials[worlds[world].task][material];let gain=Math.max(1,Math.round(m.edge/7)+(repeats===0?6:-13)+(closest.i%3===0?3:0));edge=Math.max(0,Math.min(100,edge+gain));damage=Math.min(100,damage+Math.max(3,Math.round(7+m.brittle/20)+repeats*10));hitMarks.push({zone:closest.i,x:pts[closest.i][0],y:pts[closest.i][1]});tone(160+gain*17,.08);updateMeters();drawBench();if(damage>=90)toast(Q('The core is badly fractured. Try another piece.','石核破损严重，建议重新选材。'));}
let swipeStart=null;function onCordDown(e){if(worlds[world].task!=='cord')return;swipeStart={x:e.clientX,y:e.clientY};$('cordCanvas').setPointerCapture?.(e.pointerId)}function onCordUp(e){if(!swipeStart||completed)return;let dx=e.clientX-swipeStart.x;swipeStart=null;if(Math.abs(dx)<28){toast(Q('Swipe farther across the fibres.','请沿纤维再多滑动一些。'));return}let dir=Math.sign(dx),m=materials.cord[material];twist++;let correct=prevDir===0||prevDir!==dir;quality=Math.max(0,Math.min(100,quality+Math.round((correct?10:-5)*m.tough/65)));damage=Math.min(100,damage+(correct?1:9));prevDir=dir;tone(correct?340:150,.06);updateMeters();drawBench();}
function doTest(){if(completed)return;let cord=worlds[world].task==='cord';let pass=cord?(twist>=6&&quality>=55&&damage<60):false;
 if(!cord){pass=attempt>=3&&edge>=(worlds[world].task==='flake'?42:35)&&damage<82}let result=$('testResult');result.classList.add('on');if(pass){completed=true;result.innerHTML='<strong style="color:#b2ffd0">'+Q('TEST PASSED · USEFUL OBJECT','测试成功 · 做出可用作品')+'</strong><div>'+Q('The outcome depends on your choices. Try a different material in another run.','结果受到你的材料与操作选择影响，下次可以尝试另一种材料。')+'</div><button class="workbtn" id="finish">'+Q('Return with your creation','带着作品返回营地')+'</button>';$('finish').onclick=()=>{ $('work').classList.remove('open');$('resultOverlay').classList.add('on');$('resultTitle').textContent=Q('You made it!','你亲手做出来了！');$('resultDesc').textContent=Q('You experienced a reconstructed ancient craft and can now draw another archaeological setting.','你完成了一次古代工艺情境体验。可以继续抽取另一个历史时期和区域。');tone(600,.2)}}else{result.innerHTML='<strong style="color:#ffc2aa">'+Q('TEST FAILED — revise and retry','测试失败：修改后再试')+'</strong><div>'+Q(cord?'Check alternating twist, strength and damage.':'Check the number and spread of blows, edge usefulness, and core damage.',cord?'检查是否交替捻合、绳索强度与损伤。':'检查敲击次数、位置分布、有效刃口与石核损伤。')+'</div>';tone(110,.16)}}
$('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';try{localStorage.setItem('hands_lang',lang)}catch(e){}translate()};$('sound').onclick=()=>{sound=!sound;$('sound').classList.toggle('active',sound);tone(420)};$('draw').onclick=drawWorldRandom;$('start').onclick=()=>openWork(false);$('labEntry').onclick=()=>openWork(true);$('play').onclick=()=>openWork(false);$('mentor').onclick=()=>message('mentor');$('observer').onclick=()=>message('observer');$('collector').onclick=()=>message('collector');$('mentorBtn').onclick=()=>message('mentor');$('helpBtn').onclick=()=>message('context');$('close').onclick=()=>$('work').classList.remove('open');$('mode').onclick=()=>{modern=!modern;renderWork()};$('resetBtn').onclick=()=>{resetState();hitMarks=[];renderWork()};$('testBtn').onclick=doTest;$('next').onclick=()=>{$('resultOverlay').classList.remove('on');$('testResult').classList.remove('on');hitMarks=[];drawWorldRandom()};canv.addEventListener('pointerdown',stoneHit);$('cordCanvas').addEventListener('pointerdown',onCordDown);$('cordCanvas').addEventListener('pointerup',onCordUp);$('cordCanvas').addEventListener('pointercancel',()=>swipeStart=null);window.addEventListener('keydown',e=>{if(e.key==='Escape'){$('work').classList.remove('open');$('resultOverlay').classList.remove('on')}});translate();
window.__qa={get:()=>({lang,world,attempt,edge,damage,twist,quality,completed}),chooseWorld:n=>{world=n;resetState();hitMarks=[];drawWorld()},stone:(zone)=>{let x=[[256,122],[378,99],[508,184],[516,291],[397,338],[259,317],[196,246],[205,181]][zone];let r=canv.getBoundingClientRect();stoneHit({clientX:r.left+x[0]/720*r.width,clientY:r.top+x[1]/470*r.height})},cord:dir=>{swipeStart={x:200};onCordUp({clientX:200+dir*70})},test:doTest};})();
