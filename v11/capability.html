<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>能力图谱 · 博罗新视角</title>
<meta name="description" content="交互式放射图：先猜哪类能力现场最多，再点击节点探查现场与相邻方向；不做排名、不预测，缺证据处标注待补。">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="../assets/boluo-access.js?v=20261108-inline2" data-bl-access="inline"></script>
<link rel="stylesheet" href="./lens.css?v=20261110-lens">
</head>
<body class="lens-body">
<header class="lens-top">
 <a class="lens-brand" href="./lens.html">博罗 · 新视角<small>用能力与结构看现场，不做排名</small></a>
 <nav class="lens-pager" id="lensPager"></nav>
</header>

<main class="lens-wrap">
 <p class="lens-kick">CAPABILITY MAP · 能力与复杂度</p>
 <h1 class="lens-h1">博罗攒下了哪些能力，<br>这些能力还能组合出什么？</h1>
 <p class="lens-lede">长期增长靠可复用生产能力的积累与组合，而非单个产业规模。先猜、再点节点探查，最后揭晓。</p>
 <p class="lens-meta" id="lensMeta"></p>

 <div class="viz-guess">
  先猜一下：<b>哪一类能力挂的现场最多？</b>（点一个你的判断，再去图上验证）
  <div class="row" id="guessRow"></div>
  <div class="hint" id="guessHint"></div>
 </div>

 <div class="viz-card">
  <svg class="viz-svg" viewBox="0 0 360 380" id="capSvg" role="img" aria-label="博罗能力放射图"></svg>
  <div class="viz-legend">
   <span><i style="background:#23a3a7"></i>已投产为主</span>
   <span><i style="background:#1369eb"></i>在途/在建为主</span>
   <span><i style="background:#9aa8b9"></i>单口径</span>
  </div>
 </div>

 <div class="viz-detail" id="capDetail"></div>

 <div class="lens-foot">
  <b>口径说明：</b>能力类别依据现场工艺与产品归纳，属分析判断；节点大小对应现场数量，不代表产值或重要性。状态分「已投产 / 在途 / 退出」，不合并。<br>
  <b>数据缺口：</b>「能相邻长出什么」需设备通用度、专利、技能同源等公开证据，当前标注待补，交火山引擎采集，不做推断。
 </div>
</main>

<script src="./discovery-data.js?v=20261109-struct"></script>
<script>
(function(){
 const D=window.BoluoDiscoveryData;
 if(!D){document.getElementById('capDetail').innerHTML='数据未加载';return;}
 const evMap={};D.events.forEach(function(e){evMap[e.id]=e;});

 const CAPS=[
  {key:'copper',name:'铜箔与电池材料',short:'铜箔电池',en:'COPPER & BATTERY',color:'#1369eb',ids:['copper','shenyuan','jiage','xincheng','jinliyuan'],
   gap:'待补：铜箔规格与电池结构的技术同源证据、可相邻的结构件与回收材料方向。'},
  {key:'precision',name:'精密机械与材料',short:'精密机械',en:'PRECISION',color:'#1369eb',ids:['qicaihong','hande','xingrui','sanren','quanli','jiayou','longxi','yixin','jintian','xunling','cement'],
   gap:'待补：设备加工精度与通用覆盖范围、可相邻的精密结构件方向。'},
  {key:'food',name:'食品与无菌灌装',short:'食品灌装',en:'FOOD & FILLING',color:'#23a3a7',ids:['yetai','dongweifeng','xianghao'],
   gap:'待补：无菌线可灌装品类、包装材料同源与可相邻食品方向。'},
  {key:'platform',name:'园区平台与招商',short:'园区平台',en:'PLATFORM',color:'#1369eb',ids:['futian','luofufuture','sign4','huzhen'],
   gap:'待补：厂房适配行业、签约项目实际入园与开工率。'},
  {key:'tour',name:'户外运动与文旅',short:'户外文旅',en:'TOUR & SPORTS',color:'#23a3a7',ids:['henghe','mofang','minsu','road218','fubo','tianhong','taimeig','dongshan','luofushanju','litian'],
   gap:'待补：运营主体与客流技能、可相邻的康养/研学方向。'},
  {key:'agri',name:'农业种植与初加工',short:'农业加工',en:'AGRICULTURE',color:'#9aa8b9',ids:['tea'],
   gap:'待补：可加工农产品清单、合作社与农户带动能力；现有口径仅新陂合作社。'}
 ];
 CAPS.forEach(function(c){c.count=c.ids.filter(function(id){return evMap[id];}).length;});

 const PAGES=[['lens.html','入口'],['capability.html','能力'],['value-chain.html','环节'],['resilience.html','韧性'],['foundational.html','基础'],['connections.html','连接']];
 document.getElementById('lensPager').innerHTML=PAGES.map(function(p){
  return '<a href="'+p[0]+'"'+(p[0]==='capability.html'?' class="cur"':'')+'>'+p[1]+'</a>';}).join('');
 document.getElementById('lensMeta').textContent='数据版本 '+D.version+' · 核对于 '+D.checkedAt;

 let picked=null,active=null,revealed=false;
 const CX=180,CY=175,R=95;
 function pos(i){const ang=(-90+i*60)*Math.PI/180;return {x:CX+R*Math.cos(ang),y:CY+R*Math.sin(ang),ang:ang};}

 function drawSvg(){
  let s='';
  CAPS.forEach(function(c,i){
   const p=pos(i);
   const dim=(active&&active!==c.key)?'opacity:.35':'';
   s+='<g style="'+dim+'"><line x1="'+CX+'" y1="'+CY+'" x2="'+p.x+'" y2="'+p.y+'" stroke="'+(active===c.key?'#17212f':'#d4dce6')+'" stroke-width="'+(active===c.key?2.2:1.2)+'"/>';
   const rr=14+c.count*1.3;
   s+='<g class="viz-node" data-key="'+c.key+'"><circle cx="'+p.x+'" cy="'+p.y+'" r="'+rr+'" fill="'+c.color+'" stroke="'+(active===c.key?'#17212f':'#fff')+'" stroke-width="'+(active===c.key?3:2)+'"/>';
   if(revealed)s+='<text class="viz-count" x="'+p.x+'" y="'+p.y+'">'+c.count+'</text>';
   const cos=Math.cos(p.ang);
   let lx,ly,anchor;
   if(cos>0.35){lx=p.x+rr+8;ly=p.y;anchor='start';}
   else if(cos<-0.35){lx=p.x-rr-8;ly=p.y;anchor='end';}
   else{lx=p.x;ly=p.y+(p.ang<0?-(rr+10):(rr+10));anchor='middle';}
   s+='<text class="viz-nlabel" x="'+lx+'" y="'+ly+'" text-anchor="'+anchor+'" dominant-baseline="central">'+c.short+'</text></g></g>';
  });
  s+='<circle cx="'+CX+'" cy="'+CY+'" r="17" fill="#17212f"/><text x="'+CX+'" y="'+CY+'" style="fill:#fff;font-size:10px;font-weight:800;text-anchor:middle;dominant-baseline:central">博罗</text>';
  document.getElementById('capSvg').innerHTML=s;
  Array.prototype.forEach.call(document.querySelectorAll('.viz-node'),function(g){
   g.addEventListener('click',function(){select(g.getAttribute('data-key'));});
  });
 }

 function chip(id){
  const e=evMap[id];if(!e)return '';
  const num=e.big?(' · '+e.big+(e.unit||'')):'';
  return '<span class="lens-chip"><i class="st '+e.state+'"></i>'+(e.town||'全县')+num+'</span>';
 }
 function drawDetail(){
  const c=CAPS.find(function(x){return x.key===active;});
  if(!c){document.getElementById('capDetail').innerHTML='<p style="margin:0;font-size:12px;color:#8495a8">点上方按钮或图中节点，开始探查。</p>';return;}
  document.getElementById('capDetail').innerHTML='<h4>'+c.name+' · '+c.count+' 个现场</h4><p class="cap-en">'+c.en+'</p>'
   +'<div class="lens-chips" style="margin-bottom:11px">'+c.ids.map(chip).join('')+'</div>'
   +'<div class="lens-gap"><b>相邻方向 · </b>'+c.gap+'</div>';
 }
 function drawGuess(){
  document.getElementById('guessRow').innerHTML=CAPS.map(function(c){
   return '<button data-key="'+c.key+'"'+(picked===c.key?' class="picked"':'')+'>'+c.name+'</button>';}).join('')
   +'<button id="revealBtn" style="background:#17212f;color:#fff;border-color:#17212f">'+(revealed?'重新猜':'揭晓答案')+'</button>';
  Array.prototype.forEach.call(document.querySelectorAll('#guessRow button[data-key]'),function(b){
   b.addEventListener('click',function(){if(revealed)reset();picked=b.getAttribute('data-key');select(picked);});
  });
  document.getElementById('revealBtn').addEventListener('click',function(){revealed?reset():reveal();});
 }
 function select(key){active=key;drawSvg();drawDetail();drawGuess();}
 function reveal(){
  revealed=true;
  const top=CAPS.slice().sort(function(a,b){return b.count-a.count;})[0];
  const ok=picked===top.key;
  document.getElementById('guessHint').innerHTML='实际最多的是<b>'+top.name+'</b>（'+top.count+' 个现场）。'
   +(picked?(ok?'你猜对了。':'你猜的是「'+CAPS.find(function(c){return c.key===picked;}).name+'」，差一点。'):'你还没猜，先选一个。');
  drawSvg();drawGuess();
 }
 function reset(){revealed=false;picked=null;document.getElementById('guessHint').textContent='';drawSvg();drawGuess();}

 drawGuess();drawSvg();drawDetail();
})();
</script>
</body>
</html>
