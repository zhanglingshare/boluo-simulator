<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>区域韧性 · 博罗新视角</title>
<meta name="description" content="交互式折线剖面：探查抵抗、恢复、适应、更新四能力的公开证据与缺口，恢复能力显示为待补低谷；定性档位非数字评分，附投资断崖与滞后，缺证据处待补。">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="../assets/boluo-access.js?v=20261108-inline2" data-bl-access="inline"></script>
<link rel="stylesheet" href="./lens.css?v=20261110-lens">
</head>
<body class="lens-body">
<header class="lens-top">
 <a class="lens-brand" href="./lens.html">博罗 · 新视角<small>用能力与结构看现场，不做排名</small></a>
 <nav class="lens-pager" id="lensPager"></nav>
</header>

<main class="lens-wrap">
 <p class="lens-kick">RESILIENCE · 区域韧性</p>
 <h1 class="lens-h1">同样的冲击，<br>结构不同结果不同</h1>
 <p class="lens-lede">韧性不是预测未来，而是看清抵抗、恢复、适应、更新四能力各自有多少公开证据。先猜哪个维度证据最薄，再点节点探查。</p>
 <p class="lens-meta" id="lensMeta"></p>

 <div class="viz-guess">
  先猜一下：<b>四个维度里，哪个当前公开证据最薄？</b>
  <div class="row" id="guessRow"></div>
  <div class="hint" id="guessHint"></div>
 </div>

 <div class="viz-card">
  <svg class="viz-svg" viewBox="0 0 360 290" id="resSvg" role="img" aria-label="韧性四能力折线剖面"></svg>
  <div class="viz-legend">
   <span><i style="background:#1369eb"></i>证据档位折线（定性非评分）</span>
   <span><i style="background:#b6c2d0"></i>待补低谷</span>
  </div>
 </div>

 <div class="viz-detail" id="resDetail"></div>

 <div class="res-grid" style="margin-top:14px">
  <div class="res-card">
   <h3>投资断崖</h3>
   <p class="res-sub">工业投资连续两年走弱，2026 年数据未公布</p>
   <div class="cliff" id="cliffBars"></div>
   <p class="res-lag" id="cliffFoot"></p>
  </div>
 </div>

 <div class="lens-foot">
  <b>口径说明：</b>四能力按公开证据的有无做定性标注，不打综合分、不做排名；「部分证据」指有宏观或现场证据但缺细分效果数据。<br>
  <b>滞后效应：</b>结构调整通常缓慢，冲击的影响可能在后续年份才显现；恢复速度当前无公开时间序列，标注待补。
 </div>
</main>

<script src="./discovery-data.js?v=20261109-struct"></script>
<script>
(function(){
 const D=window.BoluoDiscoveryData;
 if(!D){document.getElementById('resDetail').innerHTML='数据未加载';return;}
 const factory=D.topics.factory;

 const ABILITY=[
  {key:'resist',name:'抵抗',en:'RESISTANCE',level:'part',pos:[95,78],
   proof:'规上总产值超 2000 亿、规上增加值增速 +8.9%，工业仍在扩张；同时工业投资 −44.7%。',
   gap:'缺分行业承压数据，无法判断哪些环节更脆弱。'},
  {key:'recover',name:'恢复',en:'RECOVERY',level:'gap',pos:[245,78],
   proof:'当前没有恢复速度与时间序列的公开数据。',
   gap:'待补：受冲击后回到原水平所需时间、历史冲击的恢复记录。'},
  {key:'adapt',name:'适应',en:'ADAPTATION',level:'part',pos:[95,232],
   proof:'有东维丰从东莞迁入、食品无菌线、园区平台等承接与转向现场。',
   gap:'缺这些现场的实际产出与要素再配置效果数据。'},
  {key:'renew',name:'更新',en:'RENEWAL',level:'part',pos:[245,232],
   proof:'出现 AI、电池、户外文旅等新方向，但多为在建或在途。',
   gap:'新方向能否形成持续能力，尚待投产与运营验证。'}
 ];

 const PAGES=[['lens.html','入口'],['capability.html','能力'],['value-chain.html','环节'],['resilience.html','韧性'],['foundational.html','基础'],['connections.html','连接']];
 document.getElementById('lensPager').innerHTML=PAGES.map(function(p){
  return '<a href="'+p[0]+'"'+(p[0]==='resilience.html'?' class="cur"':'')+'>'+p[1]+'</a>';}).join('');
 document.getElementById('lensMeta').textContent='数据版本 '+D.version+' · 核对于 '+D.checkedAt;

 let picked=null,active=null,revealed=false;
 const XS=[62,152,242,332],HIGH=80,LOW=195,BASE=228;
 function yOf(a){return a.level==='part'?HIGH:LOW;}
 function drawSvg(){
  let s='';
  s+='<line x1="40" y1="'+HIGH+'" x2="345" y2="'+HIGH+'" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 5"/>'
   +'<text x="40" y="'+(HIGH-7)+'" style="font-size:9px;fill:#9aa8b9">有部分证据</text>';
  s+='<line x1="40" y1="'+LOW+'" x2="345" y2="'+LOW+'" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 5"/>'
   +'<text x="40" y="'+(LOW-7)+'" style="font-size:9px;fill:#9aa8b9">待补</text>';
  s+='<line x1="40" y1="'+BASE+'" x2="345" y2="'+BASE+'" stroke="#cfd8e3" stroke-width="1.4"/>';
  if(revealed){
   let area='M'+XS[0]+','+yOf(ABILITY[0]);
   for(let i=1;i<4;i++)area+=' L'+XS[i]+','+yOf(ABILITY[i]);
   area+=' L'+XS[3]+','+BASE+' L'+XS[0]+','+BASE+' Z';
   s+='<path d="'+area+'" fill="rgba(19,105,235,.12)"/>';
   let line='M'+XS[0]+','+yOf(ABILITY[0]);
   for(let i=1;i<4;i++)line+=' L'+XS[i]+','+yOf(ABILITY[i]);
   s+='<path d="'+line+'" fill="none" stroke="#1369eb" stroke-width="2.4"/>';
  }
  ABILITY.forEach(function(a,i){
   const x=XS[i];
   const dim=(active&&active!==a.key)?'opacity:.35':'';
   s+='<g class="viz-node" data-key="'+a.key+'" style="'+dim+'">';
   if(revealed){
    const y=yOf(a);
    if(a.level==='part'){
     s+='<circle cx="'+x+'" cy="'+y+'" r="'+(active===a.key?8:6)+'" fill="'+(active===a.key?'#17212f':'#1369eb')+'" stroke="#fff" stroke-width="1.5"/>';
    }else{
     s+='<circle cx="'+x+'" cy="'+y+'" r="'+(active===a.key?8:6)+'" fill="#fff" stroke="#9aa8b9" stroke-width="2.4" stroke-dasharray="3 3"/>';
    }
   }
   s+='<text class="viz-nlabel" x="'+x+'" y="'+(BASE+18)+'" text-anchor="middle" style="font-size:12px;fill:#46586e">'+a.name+'</text>';
   s+='<rect x="'+(x-30)+'" y="40" width="60" height="'+(BASE-20)+'" fill="transparent"/>';
   s+='</g>';
  });
  document.getElementById('resSvg').innerHTML=s;
  Array.prototype.forEach.call(document.querySelectorAll('.viz-node'),function(g){
   g.addEventListener('click',function(){select(g.getAttribute('data-key'));});});
 }
 function drawDetail(){
  const a=ABILITY.find(function(x){return x.key===active;});
  if(!a){document.getElementById('resDetail').innerHTML='<p style="margin:0;font-size:12px;color:#8495a8">点上方按钮或图中节点，开始探查。</p>';return;}
  document.getElementById('resDetail').innerHTML='<h4>'+a.name+' · '+(a.level==='part'?'部分证据':'待补')+'</h4><p class="cap-en">'+a.en+'</p>'
   +'<p style="margin:0 0 9px;font-size:11.5px;color:#3f5368;line-height:1.65">'+a.proof+'</p>'
   +'<div class="lens-gap"><b>缺口 · </b>'+a.gap+'</div>';
 }
 function drawGuess(){
  document.getElementById('guessRow').innerHTML=ABILITY.map(function(a){
   return '<button data-key="'+a.key+'"'+(picked===a.key?' class="picked"':'')+'>'+a.name+'</button>';}).join('')
   +'<button id="revealBtn" style="background:#17212f;color:#fff;border-color:#17212f">'+(revealed?'重新猜':'揭晓答案')+'</button>';
  Array.prototype.forEach.call(document.querySelectorAll('#guessRow button[data-key]'),function(b){
   b.addEventListener('click',function(){if(revealed)reset();picked=b.getAttribute('data-key');select(picked);});});
  document.getElementById('revealBtn').addEventListener('click',function(){revealed?reset():reveal();});
 }
 function select(key){active=key;drawSvg();drawDetail();drawGuess();}
 function reveal(){
  revealed=true;
  const thin=ABILITY.find(function(a){return a.level==='gap';});
  const ok=picked===thin.key;
  document.getElementById('guessHint').innerHTML='证据最薄的是<b>'+thin.name+'</b>，当前无公开恢复数据。'
   +(picked?(ok?'你猜对了。':'你猜的是「'+ABILITY.find(function(a){return a.key===picked;}).name+'」，差一点。'):'你还没猜，先选一个。');
  drawSvg();drawGuess();
 }
 function reset(){revealed=false;picked=null;document.getElementById('guessHint').textContent='';drawSvg();drawGuess();}

 // 投资断崖
 if(factory&&factory.cliff){
  const bars=factory.cliff.bars;
  const max=Math.max.apply(null,bars.map(function(b){return b.val||0;}));
  document.getElementById('cliffBars').innerHTML=bars.map(function(b){
   if(!b.val){
    return '<div class="res-bar-row"><span class="res-year">'+b.y+'</span><div class="res-track"></div>'
     +'<span class="res-none">'+b.txt+(b.rate?' · '+b.rate:'')+'</span></div>';
   }
   const w=Math.round(b.val/max*100);
   return '<div class="res-bar-row"><span class="res-year">'+b.y+'</span><div class="res-track">'
    +'<div class="res-fill" style="width:'+w+'%"><span>'+b.txt+'</span></div></div></div>';}).join('');
  document.getElementById('cliffFoot').textContent=factory.cliff.foot||'';
 }

 drawGuess();drawSvg();drawDetail();
})();
</script>
</body>
</html>
