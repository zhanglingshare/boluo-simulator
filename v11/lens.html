<script>
(function(){
 const D=window.BoluoDiscoveryData;

  return '<a href="'+p[0]+'"'+(p[0]==='lens.html'?' class="cur"':'')+'>'+p[1]+'</a>';}).join('');
 document.getElementById('lensMeta').textContent='数据版本 '+D.version+' · 核对于 '+D.checkedAt;

 const ENTRIES=[

  ['value-chain.html','02','产业链环节','原料、加工、配套、出货四环节与卡点。','4 个环节'],

  ['foundational.html','04','基础经济','农业、吃住等维系日常的底盘，连着农户。','130.32 亿元'],
  ['connections.html','05','连接质量','可核验流向、跨城共建与交通连接。','2 条流向']
 ];
 document.getElementById('entryGrid').innerHTML=ENTRIES.map(function(e){
  return '<a class="entry-card" href="'+e[0]+'"><span class="entry-no">'+e[1]+'</span>'
   +'<div class="entry-body"><h3>'+e[2]+'</h3><p>'+e[3]+'</p></div>'
   +'<span class="entry-kpi">'+e[4]+'</span><span class="entry-go">›</span></a>';}).join('');
})();
