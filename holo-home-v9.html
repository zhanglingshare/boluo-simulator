<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070c16">
<title>博罗变化图谱 · 一件事，看它牵动谁</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1828'/%3E%3Cpath d='M9 22 L16 10 L23 18' stroke='%2362e6e0' stroke-width='1.6' fill='none' opacity='.7'/%3E%3Ccircle cx='9' cy='22' r='3' fill='%2379b8ff'/%3E%3Ccircle cx='16' cy='10' r='3.4' fill='%2362e6e0'/%3E%3Ccircle cx='23' cy='18' r='2.6' fill='%23c4a1ff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#070c16; --bg2:#0a1120;
  --panel:rgba(16,26,43,.72); --panel-solid:#101a2b; --panel2:#142238;
  --line:#263650; --line-soft:rgba(120,150,190,.16);
  --text:#edf4ff; --muted:#91a4c0; --faint:#6b7e9c;
  --cyan:#62e6e0; --blue:#79b8ff; --pink:#ff77ad; --gold:#f4c66b;
  --green:#83e0ac; --red:#ff7e86; --violet:#c4a1ff;
  --radius:18px; --radius-sm:12px;
  --shadow:0 24px 70px rgba(0,0,0,.42);
  --font:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--font);color:var(--text);
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%,rgba(60,110,180,.18),transparent 60%),
    radial-gradient(ellipse 60% 50% at 100% 100%,rgba(40,150,150,.10),transparent 60%),
    linear-gradient(160deg,#080d18 0%,#0a1220 50%,#070c16 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button,input,select{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid rgba(98,230,224,.65);outline-offset:2px;border-radius:6px}
::selection{background:rgba(98,230,224,.25)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#263650;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Appbar ---------- */
.appbar{
  height:64px;display:flex;align-items:center;gap:22px;padding:0 22px;position:sticky;top:0;z-index:50;
  background:rgba(8,14,26,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid var(--line-soft);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(145deg,#16283f,#123038);border:1px solid #2a405b;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 4px 14px rgba(0,0,0,.3)}
.brand-mark svg{width:24px;height:24px}
.brand-name{font-size:15px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.brand-sub{font-size:8.5px;letter-spacing:1.6px;color:var(--faint);margin-top:2px}
.topnav{display:flex;align-items:center;gap:4px}
.topnav button{border:0;background:transparent;padding:9px 14px;border-radius:9px;color:var(--muted);font-size:12px;white-space:nowrap;transition:.18s}
.topnav button:hover{background:#16263d;color:#e2ecfa}
.topnav button.active{color:#dff3f1;background:linear-gradient(135deg,#1a2f47,#173340);box-shadow:inset 0 0 0 1px rgba(98,230,224,.14);font-weight:700}
.appbar-spacer{flex:1}
.searchbox{display:flex;align-items:center;gap:9px;width:230px;padding:9px 13px;border:1px solid var(--line);
  border-radius:99px;background:rgba(17,30,49,.8);transition:.2s}
.searchbox:focus-within{border-color:#3d6f8a;box-shadow:0 0 0 3px rgba(98,230,224,.1)}
.searchbox svg{width:15px;height:15px;flex:none;color:var(--faint)}
.searchbox input{width:100%;border:0;outline:0;background:transparent;font-size:11.5px;color:#e2ecfa}
.searchbox input::placeholder{color:var(--faint)}
.appbar-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,#1d3552,#16303a);
  border:1px solid #324764;display:grid;place-items:center;color:var(--cyan);font-size:12px;font-weight:800}

/* ---------- Workspace ---------- */
.workspace{max-width:2000px;margin:0 auto;padding:18px 20px 22px;display:grid;
  grid-template-columns:minmax(0,1fr) 420px;gap:18px;min-height:calc(100vh - 64px)}

/* ---------- Glass deck ---------- */
.deck{position:relative;border-radius:var(--radius);overflow:hidden;min-height:0;
  background:linear-gradient(160deg,rgba(14,24,41,.9),rgba(10,18,33,.94));
  border:1px solid rgba(120,150,190,.18);box-shadow:var(--shadow);display:flex;flex-direction:column}
.deck-head{position:relative;z-index:6;padding:20px 24px 0;pointer-events:none}
.deck-toprow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.kicker{font-size:9.5px;font-weight:800;letter-spacing:2.4px;color:var(--cyan)}
.deck-title{font-size:clamp(22px,2.2vw,30px);font-weight:850;letter-spacing:-.02em;margin:9px 0 7px;line-height:1.2}
.deck-title b{color:var(--cyan);font-variant-numeric:tabular-nums}
.deck-desc{font-size:12px;line-height:1.65;color:var(--muted);max-width:560px}

/* range segmented control */
.range-seg{display:flex;gap:3px;padding:4px;border:1px solid var(--line);border-radius:11px;background:rgba(7,14,25,.6);pointer-events:auto}
.range-seg button{border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:8px;font-size:11.5px;font-weight:700;transition:.18s;white-space:nowrap}
.range-seg button.active{color:#06151c;background:linear-gradient(120deg,#5fe3db,#9ff0d0);box-shadow:0 4px 14px rgba(98,230,224,.25)}
.range-seg button .seg-sub{display:block;font-size:8px;font-weight:600;opacity:.7;margin-top:1px}

/* ---------- 3D stage ---------- */
.stage{position:relative;flex:1;min-height:420px;margin:14px 16px 0;border-radius:14px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%,#0c2236 0%,#07101f 62%,#050b16 100%);
  border:1px solid rgba(90,140,180,.16)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.stage-fallback{position:absolute;inset:0;display:none}
.stage-fallback canvas{width:100%;height:100%}
.stage-hud{position:absolute;inset:0;pointer-events:none;z-index:5}
.hud-chip{position:absolute;background:rgba(7,20,34,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(120,170,200,.2);border-radius:10px;padding:8px 11px;color:#a9c6d8;font-size:9.5px;line-height:1.5}
.hud-tl{top:13px;left:13px}
.hud-tr{top:13px;right:13px;text-align:right}
.hud-bl{bottom:13px;left:13px;max-width:240px}
.hud-br{bottom:13px;right:13px}
.hud-chip b{color:var(--cyan);font-variant-numeric:tabular-nums}

/* HTML label layer */
.label-layer{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.node-tag{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
  background:rgba(9,20,35,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(140,170,200,.22);border-radius:8px;padding:3px 8px;font-size:10.5px;font-weight:700;color:#e6f0fb;
  transition:opacity .25s;will-change:transform,opacity}
.node-tag .tag-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px;box-shadow:0 0 6px currentColor}
.node-tag.focus{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(98,230,224,.3),0 6px 18px rgba(0,0,0,.4)}
.node-tag.grade-c{border-style:dashed}

/* legend */
.legend{position:absolute;left:13px;bottom:13px;z-index:6;display:flex;flex-wrap:wrap;gap:8px 14px;max-width:60%;
  padding:10px 13px;border:1px solid rgba(140,165,200,.18);border-radius:11px;
  background:rgba(8,18,32,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.legend-item{display:flex;align-items:center;gap:6px;color:#a9bccf;font-size:9.5px;white-space:nowrap}
.legend-dot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 7px currentColor}
.legend-line{width:16px;height:0;border-top:2px solid #9ab4d4}
.legend-line.dashed{border-top:2px dashed var(--gold)}

/* ---------- Timeline ---------- */
.timeline{position:relative;z-index:6;margin:14px 16px 16px;padding:13px 16px;
  border:1px solid rgba(120,150,190,.16);border-radius:13px;background:rgba(8,17,31,.8);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.timeline-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.timeline-title{font-size:11px;font-weight:800;color:#dce8f7}
.timeline-title span{color:var(--faint);font-weight:600;margin-left:7px}
.timeline-track{position:relative;display:flex;align-items:center;justify-content:space-between}
.tl-line{position:absolute;left:8px;right:8px;top:50%;height:2px;transform:translateY(-50%);background:#2a3c57;border-radius:2px}
.tl-stop{position:relative;z-index:1;border:1px solid #5e7696;background:#1d304a;border-radius:50%;
  width:13px;height:13px;padding:0;flex:0 0 auto;transition:.18s}
.tl-stop.active{width:18px;height:18px;border-color:var(--cyan);background:var(--cyan);box-shadow:0 0 0 4px rgba(98,230,224,.14),0 0 14px rgba(98,230,224,.4)}
.tl-stop:hover{border-color:#a5d8ff;transform:scale(1.12)}
.tl-labels{display:flex;justify-content:space-between;margin-top:9px;font-size:8.5px;color:var(--faint);font-variant-numeric:tabular-nums}

/* ---------- Right panel ---------- */
.side{display:flex;flex-direction:column;gap:14px;min-height:0}
.panel{border-radius:var(--radius);padding:16px;
  background:linear-gradient(160deg,rgba(18,30,49,.92),rgba(13,23,40,.94));
  border:1px solid rgba(120,150,190,.16);box-shadow:0 16px 44px rgba(0,0,0,.28)}
.panel-head{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.panel-icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(145deg,#1d3552,#173542);border:1px solid rgba(120,170,210,.18);color:var(--cyan)}
.panel-icon svg{width:15px;height:15px}
.panel-title{font-size:13px;font-weight:800;letter-spacing:.1px}
.panel-count{margin-left:auto;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.stat{padding:12px 10px;border-radius:12px;background:rgba(9,19,34,.7);border:1px solid var(--line-soft);text-align:center}
.stat-num{font-family:var(--mono);font-size:21px;font-weight:800;line-height:1;letter-spacing:-.02em}
.stat-lbl{font-size:9px;color:var(--faint);margin-top:6px;letter-spacing:.5px}
.stat:nth-child(1) .stat-num{color:var(--blue)}
.stat:nth-child(2) .stat-num{color:var(--cyan)}
.stat:nth-child(3) .stat-num{color:var(--violet)}
.stat:nth-child(4) .stat-num{color:var(--gold)}

/* change list */
.change-list{display:flex;flex-direction:column;gap:6px;max-height:384px;overflow-y:auto;padding-right:3px}
.change-card{width:100%;text-align:left;padding:9px 11px;border-radius:11px;
  border:1px solid #2a3e59;background:linear-gradient(145deg,rgba(24,39,61,.9),rgba(15,28,46,.92));
  transition:.18s;position:relative;overflow:hidden}
.change-card:hover{border-color:#5b86ad;transform:translateY(-1px)}
.change-card.active{border-color:var(--cyan);box-shadow:inset 3px 0 var(--cyan),0 8px 22px rgba(0,0,0,.3)}
.cc-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.cc-badge{font-size:9px;font-weight:800;border-radius:99px;padding:3px 8px;white-space:nowrap;letter-spacing:.3px}
.cc-date{margin-left:auto;font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cc-title{font-size:11.5px;line-height:1.5;font-weight:700;color:#e9f2fc}
.cc-meta{font-size:9px;color:var(--faint);margin-top:5px}

/* detail */
.detail{display:flex;flex-direction:column}
.detail-kicker{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.detail-title{font-size:14.5px;line-height:1.55;font-weight:850;margin-bottom:11px}
.detail-badge{font-size:9.5px;font-weight:800;border-radius:99px;padding:4px 10px}
.grade-flag{font-size:9px;font-weight:800;border-radius:6px;padding:3px 7px;margin-left:auto}
.grade-a{color:#8fe0b4;background:rgba(80,180,130,.14);border:1px solid rgba(120,210,160,.3)}
.grade-b{color:#9cc4ff;background:rgba(90,140,220,.14);border:1px solid rgba(130,170,230,.3)}
.grade-c{color:var(--gold);background:rgba(210,170,90,.13);border:1px dashed rgba(224,190,120,.45)}
.compare{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.compare-row{padding:10px 11px;border-radius:10px;background:rgba(8,17,30,.6);border:1px solid var(--line-soft)}
.compare-lbl{font-size:9px;font-weight:800;letter-spacing:.8px;margin-bottom:5px}
.compare-row.before .compare-lbl{color:var(--faint)}
.compare-row.after .compare-lbl{color:var(--cyan)}
.compare-copy{font-size:11px;line-height:1.7;color:#d6e2f2}
.evidence-line{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.ev-row{display:flex;align-items:flex-start;gap:8px;font-size:10.5px;line-height:1.55;color:var(--muted)}
.ev-row svg{width:14px;height:14px;flex:none;margin-top:1px;color:var(--cyan)}
.uncertainty{margin-top:8px;padding:10px 12px;border-left:3px solid var(--gold);border-radius:0 9px 9px 0;
  background:rgba(210,170,90,.1);font-size:10.5px;line-height:1.7;color:#f2d4a0}
.uncertainty svg{width:13px;height:13px;vertical-align:-2px;margin-right:5px}
.source-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.src-chip{font-size:9px;color:#a9c2d8;background:rgba(20,36,58,.8);border:1px solid var(--line);
  border-radius:7px;padding:4px 8px}

/* states */
.state-box{padding:26px 18px;text-align:center;border-radius:12px;border:1px dashed var(--line);
  color:var(--muted);font-size:11.5px;line-height:1.7}
.state-box .state-ico{width:40px;height:40px;margin:0 auto 12px;border-radius:12px;display:grid;place-items:center;
  background:rgba(20,36,58,.7);border:1px solid var(--line);color:var(--cyan)}
.state-box .state-ico svg{width:20px;height:20px}
.spinner{width:30px;height:30px;margin:0 auto 12px;border:2.5px solid #263650;border-top-color:var(--cyan);
  border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* toast */
.toast{position:fixed;z-index:100;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  padding:12px 18px;border-radius:12px;background:rgba(10,24,40,.96);border:1px solid rgba(98,230,224,.35);
  color:#dff5f1;box-shadow:0 16px 44px rgba(0,0,0,.5);font-size:12px;opacity:0;pointer-events:none;transition:.28s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.side-note{font-size:9.5px;line-height:1.7;color:var(--faint)}
.side-note b{color:var(--muted)}

/* ---------- Responsive ---------- */
@media(max-width:1280px){
  .workspace{grid-template-columns:minmax(0,1fr) 360px;gap:14px;padding:14px}
  .topnav{display:none}
}
@media(max-width:960px){
  .workspace{grid-template-columns:1fr}
  .searchbox{width:180px}
}
@media(max-width:680px){
  .appbar{height:58px;padding:0 14px;gap:10px}
  .brand-sub{display:none}
  .brand-name{font-size:13.5px}
  .searchbox{width:38px;padding:9px;overflow:hidden}
  .searchbox input{display:none}
  .searchbox.open{width:min(70vw,260px);position:absolute;right:58px}
  .searchbox.open input{display:block}
  .appbar-avatar{display:none}
  .workspace{display:flex;flex-direction:column;padding:12px;gap:12px}
  .deck{order:2}
  .side{order:1}
  .deck-head{padding:16px 16px 0}
  .deck-desc{font-size:11px}
  .range-seg button{padding:7px 12px;font-size:10.5px}
  .stage{min-height:340px;margin:12px 12px 0}
  .timeline{margin:12px}
  .legend{max-width:calc(100% - 26px)}
  .hud-bl{display:none}
  .stats{grid-template-columns:repeat(4,1fr);gap:6px}
  .stat{padding:10px 5px}
  .stat-num{font-size:17px}
  .change-list{max-height:none}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header class="appbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="10.5" stroke="#62e6e0" stroke-width="1.5" opacity=".8"/><ellipse cx="16" cy="16" rx="5" ry="12" stroke="#79b8ff" stroke-width="1.3" transform="rotate(42 16 16)"/><ellipse cx="16" cy="16" rx="5" ry="12" stroke="#c4a1ff" stroke-width="1.2" transform="rotate(-42 16 16)"/><circle cx="16" cy="16" r="2.6" fill="#62e6e0"/></svg>
    </div>
    <div><div class="brand-name">博罗变化图谱</div><div class="brand-sub">BOLUO CHANGE ATLAS</div></div>
  </div>
  <nav class="topnav" aria-label="视图">
    <button class="active" data-view-tab="atlas">变化图谱</button>
    <button data-view-tab="events">变化事件</button>
    <button data-view-tab="method">数据说明</button>
  </nav>
  <div class="appbar-spacer"></div>
  <label class="searchbox" id="searchBox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
    <input id="searchInput" type="search" placeholder="搜索主体、关系或关键词" aria-label="搜索主体、关系或关键词">
  </label>
  <div class="appbar-avatar" aria-hidden="true">博</div>
</header>

<main class="workspace">
  <!-- 左：3D 图谱舱 -->
  <section class="deck" aria-label="变化图谱主画布">
    <div class="deck-head">
      <div class="deck-toprow">
        <div>
          <div class="kicker">CHANGE ATLAS · 变化优先</div>
          <h1 class="deck-title" id="deckTitle">今年以来，博罗变了 <b>12</b> 处</h1>
          <p class="deck-desc" id="deckDesc">在 36 个主体、45 条关系的基本盘上叠加变化。点开一条变化，只亮它牵动的路径；灰色是背景，不是结论。</p>
        </div>
        <div class="range-seg" role="group" aria-label="时间范围">
          <button data-range="month">这个月<span class="seg-sub">近 30 天</span></button>
          <button data-range="year" class="active">今年<span class="seg-sub">2026 全年</span></button>
        </div>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="stage-fallback" id="fallback"><canvas id="fallbackCanvas"></canvas></div>
      <div class="label-layer" id="labelLayer"></div>
      <div class="stage-hud">
        <div class="hud-chip hud-tl" id="hudTl">BOLUO · 3D ATLAS</div>
        <div class="hud-chip hud-tr" id="hudTr">拖拽旋转 · 滚轮缩放</div>
        <div class="hud-chip hud-bl" id="hudBl">连线是关系线索，<b>不等于已证实的因果</b>；C 级为待验证假设。</div>
      </div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="timeline">
      <div class="timeline-head">
        <div class="timeline-title" id="timelineTitle">变化时间轴<span id="timelineSub">按时间排列，点击定位</span></div>
      </div>
      <div class="timeline-track" id="timelineTrack"><div class="tl-line"></div></div>
      <div class="tl-labels" id="timelineLabels"></div>
    </div>
  </section>

  <!-- 右：统计 + 列表 + 详情 -->
  <aside class="side">
    <div class="panel">
      <div class="stats">
        <div class="stat"><div class="stat-num" id="statNodes">–</div><div class="stat-lbl">主体</div></div>
        <div class="stat"><div class="stat-num" id="statEdges">–</div><div class="stat-lbl">关系</div></div>
        <div class="stat"><div class="stat-num" id="statSources">–</div><div class="stat-lbl">来源</div></div>
        <div class="stat"><div class="stat-num" id="statChanges">–</div><div class="stat-lbl">变化</div></div>
      </div>
    </div>

<script>
/* ================= 工具 ================= */
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
function el(tag,attrs,text){
  var n=document.createElement(tag);
  if(attrs)for(var k in attrs){if(k==="class")n.className=attrs[k];else if(k==="html")n.innerHTML=attrs[k];else n.setAttribute(k,attrs[k]);}
  if(text!=null)n.textContent=text;
  return n;
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* ================= 视觉配置 ================= */
var NODE_COLOR={external:"#c4a1ff",eco:"#7ed9aa",agriculture:"#9bd79a",anchor:"#7eb9ff",champion:"#7bcbd0",cluster:"#6dd7cf",legacy:"#9aabc1",energy:"#f1c078",new:"#ffb37b"};
var REL_COLOR={supply_chain:"#79b8ff",regional:"#c4a4ff",commute:"#66d8cf",transport:"#8aaeff",eco_constraint:"#83d7a5",resource_competition:"#ff9d9f",tourism_consumption:"#e0a8ff",investment:"#f1c078"};
var CHANGE_CFG={
  new_entity:{label:"新主体接入",color:"#ffb37b"},
  new_edge:{label:"新连接形成",color:"#79b8ff"},
  strengthen:{label:"连接增强",color:"#62e6e0"},
  weaken:{label:"连接减弱",color:"#f4c66b"},
  exit:{label:"主体退出",color:"#ff7e86"}
};
var NODE_TYPE_LBL={external:"外部联系",eco:"生态底座",agriculture:"特色农业",anchor:"链主企业",champion:"小巨人",cluster:"产业群落",legacy:"老厂基盘",energy:"能源设施",new:"新主体"};
function nodeColor(n){if(n.node_type==="legacy"&&(n.node_status==="exit"||n.change_status==="退出"))return "#ff8f9d";return NODE_COLOR[n.node_type]||"#9ab4d4";}
function shortName(name){
  var special={"高端精密制造项目（具身机器人）":"具身机器人项目","金属绿色冷轧钢项目":"绿色冷轧钢项目","空压机智能制造产业园":"空压机产业园","液冷散热部件项目":"液冷散热项目","独立储能电站（欣城/日盛）":"独立储能电站","固力水泥博罗分公司":"固力水泥（退出）","11家国家级小巨人":"国家级小巨人","74家省级专精特新":"省级专精特新"};
  if(special[name])return special[name];
  return Array.from(name).length>12?Array.from(name).slice(0,11).join("")+"…":name;
}

/* ================= 日期解析 ================= */
/* 界面保留原始字符串；内部仅用于范围比较，不伪造精度 */
function parseDate(raw){
  var s=String(raw||"").trim();
  var m;
  if((m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/)))return new Date(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/(\d{4})-(\d{1,2})/))){
    var yr=+m[1],mo=+m[2];
    var end=s.match(/至\s*(\d{1,2})/);
    if(end)mo=+end[1];
    return new Date(yr,mo,0);
  }
  return null;
}

/* ================= 数据层 ================= */
var Store={
  ready:false,ok:false,
  evidence:null,sources:null,changes:null,
  nodeMap:{},edgeMap:{},sourceMap:{},
  degree:{},
  range:"year",
  selectedId:null,
  searchTerm:"",
  filtered:[],
  focusNodeIds:{},focusEdgeIds:{},
  load:function(){
    var p=Promise.all([
      fetch("./data/relationship-evidence-v1.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error("证据 "+r.status);return r.json();}),
      fetch("./data/relationship-sources-v1.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error("来源 "+r.status);return r.json();}),
      fetch("./data/relationship-changes-v1.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error("变化 "+r.status);return r.json();})
    ]);
    return p.then(function(all){
      Store.evidence=all[0];Store.sources=all[1];Store.changes=all[2];
      Store.nodeMap={};Store.edgeMap={};Store.sourceMap={};
      Store.evidence.nodes.forEach(function(n){Store.nodeMap[n.node_id]=n;});
      Store.evidence.edges.forEach(function(e){Store.edgeMap[e.edge_id]=e;});
      Store.sources.sources.forEach(function(s){Store.sourceMap[s.source_id]=s;});
      Store.degree={};
      Store.evidence.nodes.forEach(function(n){Store.degree[n.node_id]=0;});
      Store.evidence.edges.forEach(function(e){Store.degree[e.source_node_id]=(Store.degree[e.source_node_id]||0)+1;Store.degree[e.target_node_id]=(Store.degree[e.target_node_id]||0)+1;});
      Store.ready=true;Store.ok=true;
      return true;
    }).catch(function(err){Store.ready=true;Store.ok=false;return false;});
  },
  applyRange:function(){
    var now=new Date();
    var list=Store.changes.changes.slice();
    if(Store.range==="month"){
      var cutoff=new Date(now.getTime()-30*86400000);
      list=list.filter(function(c){var d=parseDate(c.event_date);return d&&d>=cutoff;});
    }else{
      var yr=now.getFullYear();
      list=list.filter(function(c){var d=parseDate(c.event_date);return d&&d.getFullYear()===yr;});
    }
    list.sort(function(a,b){var da=parseDate(a.event_date),db=parseDate(b.event_date);return da-db;});
    Store.filtered=list;
    return list;
  },
  getChange:function(id){return Store.changes.changes.filter(function(c){return c.change_id===id;})[0]||null;},
  computeFocus:function(change){
    var nodeIds={},edgeIds={};
    if(change){
      (change.involved_node_ids||[]).forEach(function(id){if(Store.nodeMap[id])nodeIds[id]=true;});
      (change.involved_edge_ids||[]).forEach(function(id){var e=Store.edgeMap[id];if(e){edgeIds[id]=true;nodeIds[e.source_node_id]=true;nodeIds[e.target_node_id]=true;}});
    }
    var mobile=window.innerWidth<=680;
    var hops=mobile?1:2;
    var cap=mobile?9:16;
    var frontier=Object.keys(nodeIds);
    for(var h=0;h<hops;h++){
      var next=[];
      frontier.forEach(function(id){
        Store.evidence.edges.forEach(function(e){
          var other=null;
          if(e.source_node_id===id)other=e.target_node_id;
          else if(e.target_node_id===id)other=e.source_node_id;
          if(other&&!nodeIds[other]){
            var changed=e.change_status&&e.change_status!=="无显著变化";
            next.push({id:other,changed:changed});
          }
        });
      });
      next.sort(function(a,b){return (b.changed?1:0)-(a.changed?1:0);});
      next.forEach(function(o){if(Object.keys(nodeIds).length<cap&&!nodeIds[o.id])nodeIds[o.id]=true;});
      frontier=next.map(function(o){return o.id;});
    }
    Store.focusNodeIds=nodeIds;Store.focusEdgeIds=edgeIds;
    return {nodeIds:nodeIds,edgeIds:edgeIds};
  },
  splitBeforeAfter:function(ba){
    var s=String(ba||"");
    var bm=s.match(/此前[：:]([\s\S]*?)(?:；|;)?此后[：:]/);
    var am=s.match(/此后[：:]([\s\S]*)/);
    return {before:bm?bm[1].replace(/[；;]$/,"").trim():s,after:am?am[1].trim():""};
  },
  latestId:function(){
    var list=Store.applyRange();
    if(!list.length)return null;
    return list[list.length-1].change_id;
  }
};
window.__AtlasStore=Store;
window.__AtlasUtil={$:$,el:el,hashStr:hashStr,clamp:clamp,mulberry32:mulberry32,nodeColor:nodeColor,shortName:shortName,parseDate:parseDate,CHANGE_CFG:CHANGE_CFG,REL_COLOR:REL_COLOR,NODE_COLOR:NODE_COLOR,NODE_TYPE_LBL:NODE_TYPE_LBL};
})();
</script>

<script>
/* ================= 3D 引擎 ================= */
(function(){
"use strict";
var Store=window.__AtlasStore, U=window.__AtlasUtil;
var $=U.$, el=U.el, clamp=U.clamp, mulberry32=U.mulberry32, nodeColor=U.nodeColor, shortName=U.shortName;
var THREE_=window.THREE;

/* ---------- 确定性 3D 力导向布局 ---------- */
function buildLayout(){
  var nodes=Store.evidence.nodes, edges=Store.evidence.edges;
  var layers=[];
  nodes.forEach(function(n){if(layers.indexOf(n.layer)<0)layers.push(n.layer);});
  // 群簇中心：斐波那契球
  var clusterCenter={};
  var L=layers.length;
  layers.forEach(function(ly,i){
    var k=i+0.5, phi=Math.acos(1-2*k/L), theta=Math.PI*(1+Math.sqrt(5))*k;
    var r=13;
    clusterCenter[ly]=new THREE_.Vector3(
      r*Math.sin(phi)*Math.cos(theta),
      r*Math.cos(phi)*0.82,
      r*Math.sin(phi)*Math.sin(theta)
    );
  });
  var rnd=mulberry32(20261102);
  var pos={};
  nodes.forEach(function(n){
    var c=clusterCenter[n.layer];
    pos[n.node_id]=new THREE_.Vector3(
      c.x+(rnd()-0.5)*5,
      c.y+(rnd()-0.5)*5,
      c.z+(rnd()-0.5)*5
    );
  });
  var idx={};nodes.forEach(function(n,i){idx[n.node_id]=i;});
  var ideal=7.5;
  for(var iter=0;iter<420;iter++){
    var temp=1-Math.pow(iter/420,1.6);
    var f=new Array(nodes.length);
    nodes.forEach(function(n,i){f[i]=new THREE_.Vector3();});
    // 斥力
    for(var a=0;a<nodes.length;a++){
      for(var b=a+1;b<nodes.length;b++){
        var pa=pos[nodes[a].node_id],pb=pos[nodes[b].node_id];
        var d=new THREE_.Vector3().subVectors(pa,pb);
        var dist=Math.max(d.length(),0.6);
        var rep=110/(dist*dist);
        d.normalize().multiplyScalar(rep);
        f[a].add(d);f[b].sub(d);
      }
    }
    // 弹簧
    edges.forEach(function(e){
      var i=idx[e.source_node_id],j=idx[e.target_node_id];
      if(i==null||j==null)return;
      var pa=pos[e.source_node_id],pb=pos[e.target_node_id];
      var d=new THREE_.Vector3().subVectors(pb,pa);
      var dist=Math.max(d.length(),0.6);
      var kspring=0.06;
      var force=kspring*(dist-ideal);
      d.normalize().multiplyScalar(force);
      f[i].add(d);f[j].sub(d);
    });
    // 群簇 + 中心引力
    nodes.forEach(function(n,i){
      var c=clusterCenter[n.layer];
      f[i].add(new THREE_.Vector3().subVectors(c,pos[n.node_id]).multiplyScalar(0.012));
      f[i].add(pos[n.node_id].clone().multiplyScalar(-0.008));
    });
    // 应用
    nodes.forEach(function(n,i){
      var maxF=1.6*temp+0.05;
      if(f[i].length()>maxF)f[i].setLength(maxF);
      pos[n.node_id].add(f[i]);
    });
  }
  return pos;
}

/* ---------- 光晕纹理 ---------- */
function glowTexture(){
  var c=document.createElement("canvas");c.width=c.height=128;
  var g=c.getContext("2d");
  var grad=g.createRadialGradient(64,64,0,64,64,64);
  grad.addColorStop(0,"rgba(255,255,255,1)");
  grad.addColorStop(0.25,"rgba(255,255,255,.55)");
  grad.addColorStop(0.6,"rgba(255,255,255,.12)");
  grad.addColorStop(1,"rgba(255,255,255,0)");
  g.fillStyle=grad;g.fillRect(0,0,128,128);
  var t=new THREE_.Texture(c);t.needsUpdate=true;return t;
}

var Atlas3D={
  available:false,scene:null,camera:null,renderer:null,
  positions:null,nodeMeshes:[],nodeGlows:[],edgeLines:[],edgeData:[],
  labelTags:[],glowTex:null,
  raf:null,disposed:false,
  theta:0.7,phi:1.0,radius:30,
  targetTheta:0.7,targetPhi:1.0,targetRadius:30,
  tx:0,ty:0,tz:0, ttx:0,tty:0,ttz:0,
  dragging:false,lastX:0,lastY:0,moved:0,pinchDist:0,
  raycaster:null,pointer:null,
  particleSystem:null,grid:null,
  focusNodeIds:{},focusEdgeIds:{},hasFocus:false,

  init:function(){
    var self=this;
    if(!THREE_)return false;
    try{
      var stage=$("stage");
      var w=stage.clientWidth,h=stage.clientHeight;
      this.renderer=new THREE_.WebGLRenderer({antialias:true,alpha:true,powerPreference:"high-performance"});
      this.renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
      this.renderer.setSize(w,h);
      this.renderer.setClearColor(0x000000,0);
      stage.insertBefore(this.renderer.domElement,stage.firstChild);
      this.available=true;
    }catch(e){this.available=false;return false;}

    this.scene=new THREE_.Scene();
    this.scene.fog=new THREE_.FogExp2(0x07101f,0.011);
    this.camera=new THREE_.PerspectiveCamera(55,w/h,0.1,400);
    this.glowTex=glowTexture();
    this.positions=buildLayout();

    // 网格地面
    var grid=new THREE_.GridHelper(80,32,0x3a8aa0,0x1e4058);
    grid.position.y=-16;
    grid.material.transparent=true;grid.material.opacity=0.42;
    this.scene.add(grid);this.grid=grid;
    var grid2=new THREE_.GridHelper(80,32,0x3a8aa0,0x1e4058);
    grid2.rotation.x=Math.PI/2;grid2.position.z=-16;
    grid2.material.transparent=true;grid2.material.opacity=0.14;
    this.scene.add(grid2);

    // 背景粒子
    var N=window.innerWidth<=680?160:320, rnd=mulberry32(777);
    var pgeo=new THREE_.BufferGeometry(),pvals=new Float32Array(N*3);
    for(var i=0;i<N;i++){
      var rr=30+rnd()*45,th=rnd()*Math.PI*2,ph=Math.acos(2*rnd()-1);
      pvals[i*3]=rr*Math.sin(ph)*Math.cos(th);
      pvals[i*3+1]=rr*Math.cos(ph);
      pvals[i*3+2]=rr*Math.sin(ph)*Math.sin(th);
    }
    pgeo.setAttribute("position",new THREE_.BufferAttribute(pvals,3));
    var pmat=new THREE_.PointsMaterial({color:0x8fd6ff,size:0.32,transparent:true,opacity:0.55,map:this.glowTex,blending:THREE_.AdditiveBlending,depthWrite:false});
    this.particleSystem=new THREE_.Points(pgeo,pmat);
    this.scene.add(this.particleSystem);

    // 边
    var self2=this;
    this.edgeTubes=[];
    Store.evidence.edges.forEach(function(e){
      var pa=self2.positions[e.source_node_id],pb=self2.positions[e.target_node_id];
      if(!pa||!pb)return;
      var g=new THREE_.BufferGeometry().setFromPoints([pa,pb]);
      var isC=e.evidence_grade==="C";
      var colr=new THREE_.Color(U.REL_COLOR[e.relation_type]||0x9ab4d4);
      var mat;
      if(isC){
        mat=new THREE_.LineDashedMaterial({color:colr,dashSize:0.5,gapSize:0.45,transparent:true,opacity:0.4});
      }else{
        mat=new THREE_.LineBasicMaterial({color:colr,transparent:true,opacity:0.32});
      }
      var line=new THREE_.Line(g,mat);
      if(isC)line.computeLineDistances();
      self2.scene.add(line);
      self2.edgeLines.push(line);
      self2.edgeData.push(e);
      // 发光管（默认透明，focus 时亮起）
      var curve=new THREE_.LineCurve3(pa,pb);
      var tg=new THREE_.TubeGeometry(curve,1,0.06,6,false);
      var tm=new THREE_.MeshBasicMaterial({color:colr,transparent:true,opacity:0,blending:THREE_.AdditiveBlending,depthWrite:false});
      var tube=new THREE_.Mesh(tg,tm);
      self2.scene.add(tube);
      self2.edgeTubes.push(tube);
    });

    // 节点
    var nodeGeo=new THREE_.SphereGeometry(1,16,12);
    Store.evidence.nodes.forEach(function(n){
      var col=new THREE_.Color(nodeColor(n));
      var deg=Store.degree[n.node_id]||1;
      var radius=0.72+Math.min(deg,9)*0.092;
      var mat=new THREE_.MeshBasicMaterial({color:col});
      var mesh=new THREE_.Mesh(nodeGeo,mat);
      mesh.scale.setScalar(radius);
      mesh.position.copy(self2.positions[n.node_id]);
      mesh.userData.nodeId=n.node_id;
      mesh.userData.baseRadius=radius;
      self2.scene.add(mesh);
      self2.nodeMeshes.push(mesh);
      // 光晕 sprite
      var smat=new THREE_.SpriteMaterial({map:self2.glowTex,color:col,transparent:true,opacity:0.85,blending:THREE_.AdditiveBlending,depthWrite:false});
      var sp=new THREE_.Sprite(smat);
      sp.scale.setScalar(radius*5.6);
      sp.position.copy(self2.positions[n.node_id]);
      self2.scene.add(sp);
      self2.nodeGlows.push(sp);
    });

    this.raycaster=new THREE_.Raycaster();
    this.pointer=new THREE_.Vector2();
    this.buildLabels();
    this.bindControls();
    this.loop();
    window.addEventListener("resize",function(){self2.resize();});
    return true;
  },

  buildLabels:function(){
    var self=this,layer=$("labelLayer");
    layer.innerHTML="";
    Store.evidence.nodes.forEach(function(n){
      var tag=el("div",{class:"node-tag",id:"tag_"+n.node_id});
      var dot=el("span",{class:"tag-dot"});dot.style.color=nodeColor(n);dot.style.background=nodeColor(n);
      tag.appendChild(dot);
      tag.appendChild(document.createTextNode(shortName(n.name)));
      if(n.evidence_grade==="C")tag.classList.add("grade-c");
      layer.appendChild(tag);
      self.labelTags.push({id:n.node_id,el:tag,node:n});
    });
  },

  resize:function(){
    if(!this.available)return;
    var stage=$("stage"),w=stage.clientWidth,h=stage.clientHeight;
    if(!w||!h)return;
    this.camera.aspect=w/h;this.camera.updateProjectionMatrix();
    this.renderer.setSize(w,h);
  },

  bindControls:function(){
    var self=this,dom=this.renderer.domElement;
    dom.style.cursor="grab";

    function pd(e){
      if(e.pointerType==="touch"&&e.isPrimary===false)return;
      self.dragging=true;self.moved=0;self.lastX=e.clientX;self.lastY=e.clientY;
      dom.style.cursor="grabbing";
      dom.setPointerCapture&&dom.setPointerCapture(e.pointerId);
    }
    function pm(e){
      if(!self.dragging)return;
      var dx=e.clientX-self.lastX,dy=e.clientY-self.lastY;
      self.moved+=Math.abs(dx)+Math.abs(dy);
      self.lastX=e.clientX;self.lastY=e.clientY;
      self.targetTheta-=dx*0.0062;
      self.targetPhi=clamp(self.targetPhi-dy*0.0062,0.16,Math.PI-0.16);
    }
    function pu(e){
      if(!self.dragging)return;
      self.dragging=false;dom.style.cursor="grab";
      if(self.moved<6)self.handleClick(e);
    }
    dom.addEventListener("pointerdown",pd);
    window.addEventListener("pointermove",pm);
    window.addEventListener("pointerup",pu);
    dom.addEventListener("wheel",function(e){
      e.preventDefault();
      self.targetRadius=clamp(self.targetRadius*(1+e.deltaY*0.0011),11,72);
    },{passive:false});

    // 双指捏合
    dom.addEventListener("touchstart",function(e){
      if(e.touches.length===2){
        var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
        self.pinchDist=Math.hypot(dx,dy);
      }
    },{passive:true});
    dom.addEventListener("touchmove",function(e){
      if(e.touches.length===2){
        e.preventDefault();
        var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
        var d=Math.hypot(dx,dy);
        if(self.pinchDist)self.targetRadius=clamp(self.targetRadius*(self.pinchDist/d),11,72);
        self.pinchDist=d;
      }
    },{passive:false});
  },

  handleClick:function(e){
    var rect=this.renderer.domElement.getBoundingClientRect();
    this.pointer.x=((e.clientX-rect.left)/rect.width)*2-1;
    this.pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
    this.raycaster.setFromCamera(this.pointer,this.camera);
    var hits=this.raycaster.intersectObjects(this.nodeMeshes,false);
    if(hits.length){
      var nid=hits[0].object.userData.nodeId;
      window.__AtlasHooks&&window.__AtlasHooks.onNodeClick(nid);
    }
  },

  setFocus:function(nodeIds,edgeIds,hasFocus){
    var self=this;
    this.focusNodeIds=nodeIds||{};this.focusEdgeIds=edgeIds||{};this.hasFocus=!!hasFocus;
    // 节点
    this.nodeMeshes.forEach(function(mesh,i){
      var nid=mesh.userData.nodeId;
      var inFocus=!hasFocus||self.focusNodeIds[nid];
      mesh.visible=true;
      mesh.material.opacity=inFocus?1:0.28;
      mesh.material.transparent=!inFocus;
      var glow=self.nodeGlows[i];
      glow.material.opacity=inFocus?0.95:0.18;
      var base=mesh.userData.baseRadius||1;
      mesh.scale.setScalar(hasFocus&&self.focusNodeIds[nid]?base*1.2:base);
    });
    // 边：direct=变化直接涉及（发光）；neighbor=两端在焦点内的上下文（淡色）
    this.edgeLines.forEach(function(line,i){
      var e=self.edgeData[i];
      var isC=e.evidence_grade==="C";
      var direct=!!self.focusEdgeIds[e.edge_id];
      var neighbor=(self.focusNodeIds[e.source_node_id]&&self.focusNodeIds[e.target_node_id]);
      if(!hasFocus){
        line.material.opacity=isC?0.4:0.32;
      }else if(direct){
        line.material.opacity=isC?0.9:1;
      }else if(neighbor){
        line.material.opacity=isC?0.4:0.42;
      }else{
        line.material.opacity=0.07;
      }
      // 发光管只亮直接路径
      var tube=self.edgeTubes[i];
      if(tube){
        if(hasFocus&&direct)tube.material.opacity=isC?0.6:0.95;
        else tube.material.opacity=0;
      }
    });
    this.focusCamera(nodeIds,hasFocus);
  },

  /* 选中变化时，镜头平滑聚焦到路径包围中心；无焦点回到全景 */
  focusCamera:function(nodeIds,hasFocus){
    var self=this;
    if(!hasFocus){this.ttx=0;this.tty=0;this.ttz=0;this.targetRadius=30;return;}
    var ids=Object.keys(nodeIds);
    if(!ids.length)return;
    var center=new THREE_.Vector3();
    ids.forEach(function(id){var p=self.positions[id];if(p)center.add(p);});
    center.multiplyScalar(1/ids.length);
    var maxR=0;
    ids.forEach(function(id){var p=self.positions[id];if(p)maxR=Math.max(maxR,p.distanceTo(center));});
    this.ttx=center.x;this.tty=center.y;this.ttz=center.z;
    this.targetRadius=clamp(maxR*2.3+6,12,38);
  },

  resetView:function(){
    this.targetTheta=0.7;this.targetPhi=1.0;this.targetRadius=30;
    this.ttx=0;this.tty=0;this.ttz=0;
  },

  loop:function(){
    var self=this;
    if(this.disposed)return;
    this.raf=requestAnimationFrame(function(){self.loop();});
    // 阻尼
    this.theta+=(this.targetTheta-this.theta)*0.12;
    this.phi+=(this.targetPhi-this.phi)*0.12;
    this.radius+=(this.targetRadius-this.radius)*0.12;
    this.tx+=(this.ttx-this.tx)*0.1; this.ty+=(this.tty-this.ty)*0.1; this.tz+=(this.ttz-this.tz)*0.1;
    var sphi=Math.sin(this.phi);
    this.camera.position.set(
      this.tx+this.radius*sphi*Math.sin(this.theta),
      this.ty+this.radius*Math.cos(this.phi),
      this.tz+this.radius*sphi*Math.cos(this.theta)
    );
    this.camera.lookAt(this.tx,this.ty,this.tz);
    if(this.particleSystem){this.particleSystem.rotation.y+=0.0007;this.particleSystem.rotation.x+=0.0002;}

    // 节点查找缓存
    if(!this.meshById){this.meshById={};this.nodeMeshes.forEach(function(m){self.meshById[m.userData.nodeId]=m;});}
    // 标签投影
    var stage=$("stage"),w=stage.clientWidth,h=stage.clientHeight;
    var v=new THREE_.Vector3();
    this.labelTags.forEach(function(t){
      var mesh=self.meshById[t.id];
      if(!mesh)return;
      v.copy(mesh.position).project(self.camera);
      var behind=v.z>1;
      var sx=(v.x*0.5+0.5)*w,sy=(-v.y*0.5+0.5)*h;
      var onScreen=!behind&&sx>-60&&sx<w+60&&sy>-40&&sy<h+40;
      var important=t.node.change_status!=="无显著变化"||(Store.degree[t.id]||0)>=3;
      var show=onScreen&&(self.hasFocus?!!self.focusNodeIds[t.id]:important);
      if(show){
        t.el.style.transform="translate(-50%,-50%) translate("+sx.toFixed(1)+"px,"+sy.toFixed(1)+"px)";
        t.el.style.opacity=self.hasFocus&&self.focusNodeIds[t.id]?1:(self.hasFocus?0:0.92);
        t.el.classList.toggle("focus",self.hasFocus&&!!self.focusNodeIds[t.id]);
      }else{
        t.el.style.opacity=0;
      }
    });

    this.renderer.render(this.scene,this.camera);
  },

  dispose:function(){
    this.disposed=true;
    if(this.raf)cancelAnimationFrame(this.raf);
    if(this.renderer){
      this.renderer.dispose();
      if(this.renderer.domElement.parentNode)this.renderer.domElement.parentNode.removeChild(this.renderer.domElement);
    }
  }
};
window.__Atlas3D=Atlas3D;
})();
</script>

<script>
/* ================= 2D 降级引擎（纯 Canvas，不依赖 WebGL） ================= */
(function(){
"use strict";
var Store=window.__AtlasStore,U=window.__AtlasUtil;
var $=U.$,el=U.el,clamp=U.clamp,mulberry32=U.mulberry32,nodeColor=U.nodeColor,shortName=U.shortName;

function v3(x,y,z){return {x:x,y:y,z:z};}
function add(a,b){return {x:a.x+b.x,y:a.y+b.y,z:a.z+b.z};}
function sub(a,b){return {x:a.x-b.x,y:a.y-b.y,z:a.z-b.z};}
function scale(a,s){return {x:a.x*s,y:a.y*s,z:a.z*s};}
function len(a){return Math.hypot(a.x,a.y,a.z);}
function norm(a){var l=Math.max(len(a),1e-6);return scale(a,1/l);}

function buildLayout2D(){
  var nodes=Store.evidence.nodes,edges=Store.evidence.edges;
  var layers=[];nodes.forEach(function(n){if(layers.indexOf(n.layer)<0)layers.push(n.layer);});
  var cc={},L=layers.length;
  layers.forEach(function(ly,i){
    var k=i+0.5,phi=Math.acos(1-2*k/L),theta=Math.PI*(1+Math.sqrt(5))*k,r=13;
    cc[ly]=v3(r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi)*0.82,r*Math.sin(phi)*Math.sin(theta));
  });
  var rnd=mulberry32(20261102),pos={};
  nodes.forEach(function(n){var c=cc[n.layer];pos[n.node_id]=v3(c.x+(rnd()-0.5)*5,c.y+(rnd()-0.5)*5,c.z+(rnd()-0.5)*5);});
  var idx={};nodes.forEach(function(n,i){idx[n.node_id]=i;});
  for(var iter=0;iter<420;iter++){
    var temp=1-Math.pow(iter/420,1.6),f=[];
    nodes.forEach(function(){f.push(v3(0,0,0));});
    for(var a=0;a<nodes.length;a++)for(var b=a+1;b<nodes.length;b++){
      var d=sub(pos[nodes[a.node_id]],pos[nodes[b.node_id]]),dist=Math.max(len(d),0.6),rep=110/(dist*dist);
      d=scale(norm(d),rep);f[a]=add(f[a],d);f[b]=sub(f[b],d);
    }
    edges.forEach(function(e){
      var i=idx[e.source_node_id],j=idx[e.target_node_id];if(i==null||j==null)return;
      var d=sub(pos[e.target_node_id],pos[e.source_node_id]),dist=Math.max(len(d),0.6);
      d=scale(norm(d),0.06*(dist-7.5));f[i]=add(f[i],d);f[j]=sub(f[j],d);
    });
    nodes.forEach(function(n,i){
      f[i]=add(f[i],scale(sub(cc[n.layer],pos[n.node_id]),0.012));
      f[i]=add(f[i],scale(pos[n.node_id],-0.008));
    });
    nodes.forEach(function(n,i){
      var mf=1.6*temp+0.05;
      if(len(f[i])>mf)f[i]=scale(norm(f[i]),mf);
      pos[n.node_id]=add(pos[n.node_id],f[i]);
    });
  }
  return pos;
}

var Atlas2D={
  canvas:null,ctx:null,pos:null,raf:null,disposed:false,
  theta:0.7,phi:1.15,zoom:1,
  dragging:false,lastX:0,lastY:0,moved:0,pinch:0,
  screen:{},focusNodeIds:{},focusEdgeIds:{},hasFocus:false,

  init:function(){
    var stage=$("stage");
    this.canvas=$("fallbackCanvas");
    this.ctx=this.canvas.getContext("2d");
    $("fallback").style.display="block";
    $("labelLayer").style.display="none";
    this.pos=buildLayout2D();
    this.resize();
    this.bind();
    var self=this;
    (function frame(){if(self.disposed)return;self.raf=requestAnimationFrame(frame);self.draw();})();
    window.addEventListener("resize",function(){self.resize();});
    return true;
  },
  resize:function(){
    var stage=$("stage"),w=stage.clientWidth,h=stage.clientHeight,dpr=Math.min(window.devicePixelRatio||1,2);
    this.canvas.width=w*dpr;this.canvas.height=h*dpr;
    this.canvas.style.width=w+"px";this.canvas.style.height=h+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.w=w;this.h=h;
  },
  project:function(p){
    var ct=Math.cos(this.theta),st=Math.sin(this.theta),cp=Math.cos(this.phi),sp=Math.sin(this.phi);
    var x1=p.x*ct+p.z*st, z1=-p.x*st+p.z*ct;
    var y1=p.y*cp-z1*sp, z2=p.y*sp+z1*cp;
    var cam=40,s=cam/(cam+z2);
    return {x:this.w/2+x1*s*this.zoom,y:this.h/2+y1*s*this.zoom,s:s,z:z2};
  },
  draw:function(){
    var self=this,ctx=this.ctx;
    ctx.clearRect(0,0,this.w,this.h);
    // 背景网格
    ctx.save();ctx.strokeStyle="rgba(60,130,160,.12)";ctx.lineWidth=1;
    for(var gx=0;gx<=10;gx++){var x=gx*this.w/10;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,this.h);ctx.stroke();}
    for(var gy=0;gy<=8;gy++){var y=gy*this.h/8;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(this.w,y);ctx.stroke();}
    ctx.restore();
    this.screen={};
    // 边
    Store.evidence.edges.forEach(function(e){
      var pa=self.pos[e.source_node_id],pb=self.pos[e.target_node_id];if(!pa||!pb)return;
      var a=self.project(pa),b=self.project(pb),isC=e.evidence_grade==="C";
      var inFocus=!self.hasFocus||self.focusEdgeIds[e.edge_id]||(self.focusNodeIds[e.source_node_id]&&self.focusNodeIds[e.target_node_id]);
      var op=self.hasFocus?(inFocus?0.95:0.07):(isC?0.45:0.32);
      ctx.save();ctx.globalAlpha=op;ctx.strokeStyle=U.REL_COLOR[e.relation_type]||"#9ab4d4";ctx.lineWidth=inFocus?1.6:1;
      if(isC){ctx.setLineDash([5,4]);}
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore();
    });
    // 节点（按 z 排序，远的先画）
    var arr=Store.evidence.nodes.map(function(n){return {n:n,p:self.project(self.pos[n.node_id])};}).sort(function(a,b){return b.p.z-a.p.z;});
    arr.forEach(function(o){
      var n=o.n,pr=o.p,inFocus=!self.hasFocus||self.focusNodeIds[n.node_id];
      var deg=Store.degree[n.node_id]||1,r=(4+Math.min(deg,9)*0.55)*pr.s*self.zoom;
      self.screen[n.node_id]={x:pr.x,y:pr.y,r:r};
      var col=nodeColor(n);
      ctx.save();ctx.globalAlpha=inFocus?1:0.3;
      var grad=ctx.createRadialGradient(pr.x,pr.y,0,pr.x,pr.y,r*2.6);
      grad.addColorStop(0,col);grad.addColorStop(0.3,col+"aa");grad.addColorStop(1,"transparent");
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(pr.x,pr.y,r*2.6,0,7);ctx.fill();
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(pr.x,pr.y,r,0,7);ctx.fill();
      if(inFocus){ctx.globalAlpha=0.92;ctx.font="700 11px Inter,sans-serif";ctx.fillStyle="#e6f0fb";ctx.textAlign="center";
        ctx.fillText(shortName(n.name),pr.x,pr.y-r-7);}
      ctx.restore();
    });
  },
  bind:function(){
    var self=this,c=this.canvas;
    function pd(e){self.dragging=true;self.moved=0;self.lastX=e.clientX;self.lastY=e.clientY;}
    function pm(e){if(!self.dragging)return;var dx=e.clientX-self.lastX,dy=e.clientY-self.lastY;self.moved+=Math.abs(dx)+Math.abs(dy);
      self.lastX=e.clientX;self.lastY=e.clientY;self.theta-=dx*0.006;self.phi=clamp(self.phi-dy*0.006,0.2,Math.PI-0.2);}
    function pu(e){if(!self.dragging)return;self.dragging=false;if(self.moved<6)self.click(e);}
    c.addEventListener("pointerdown",pd);window.addEventListener("pointermove",pm);window.addEventListener("pointerup",pu);
    c.addEventListener("wheel",function(e){e.preventDefault();self.zoom=clamp(self.zoom*(1+e.deltaY*0.001),0.5,2.4);},{passive:false});
    c.addEventListener("touchstart",function(e){if(e.touches.length===2){var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;self.pinch=Math.hypot(dx,dy);}},{passive:true});
    c.addEventListener("touchmove",function(e){if(e.touches.length===2){e.preventDefault();var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;var d=Math.hypot(dx,dy);if(self.pinch)self.zoom=clamp(self.zoom*(d/self.pinch),0.5,2.4);self.pinch=d;}},{passive:false});
  },
  click:function(e){
    var rect=this.canvas.getBoundingClientRect(),cx=e.clientX-rect.left,cy=e.clientY-rect.top,best=null,bd=1e9;
    for(var id in this.screen){var s=this.screen[id],d=Math.hypot(s.x-cx,s.y-cy);if(d<Math.max(s.r,14)&&d<bd){bd=d;best=id;}}
    if(best)window.__AtlasHooks&&window.__AtlasHooks.onNodeClick(best);
  },
  setFocus:function(n,e,h){this.focusNodeIds=n||{};this.focusEdgeIds=e||{};this.hasFocus=!!h;},
  resetView:function(){this.theta=0.7;this.phi=1.15;this.zoom=1;},
  dispose:function(){this.disposed=true;if(this.raf)cancelAnimationFrame(this.raf);}

})();

<script>
/* ================= 主控制器 ================= */
(function(){
"use strict";
var Store=window.__AtlasStore,U=window.__AtlasUtil;
var $=U.$,el=U.el,clamp=U.clamp,nodeColor=U.nodeColor,shortName=U.shortName,parseDate=U.parseDate;

/* ---------- toast ---------- */
var toastTimer=null;
function toast(msg){
  var t=$("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove("show");},2600);
}

/* ---------- 图例 ---------- */
function renderLegend(){
  var box=$("legend");box.innerHTML="";
  // 节点类型（取数据中出现的主要类型，精简）
  [["anchor","链主"],["cluster","群落"],["agriculture","农业"],["new","新主体"],["eco","生态"]].forEach(function(p){
    var item=el("div",{class:"legend-item"});

    dot.style.background=U.NODE_COLOR[p[0]];dot.style.color=U.NODE_COLOR[p[0]];
    item.appendChild(dot);item.appendChild(document.createTextNode(p[1]));box.appendChild(item);
  });
  var li1=el("div",{class:"legend-item"});li1.appendChild(el("span",{class:"legend-line"}));li1.appendChild(document.createTextNode("已观测关系"));box.appendChild(li1);
  var li2=el("div",{class:"legend-item"});li2.appendChild(el("span",{class:"legend-line dashed"}));li2.appendChild(document.createTextNode("C 级待验证"));box.appendChild(li2);
}

/* ---------- 统计 ---------- */
function renderStats(){
  $("statNodes").textContent=Store.evidence.nodes.length;
  $("statEdges").textContent=Store.evidence.edges.length;
  $("statSources").textContent=Store.sources.sources.length;
  $("statChanges").textContent=Store.filtered.length;
}

/* ---------- 变化列表 ---------- */
function renderList(){
  var box=$("changeList"),state=$("listState");
  box.innerHTML="";state.hidden=true;
  var term=Store.searchTerm.toLowerCase();
  var list=Store.filtered.filter(function(c){
    if(!term)return true;
    var hay=[c.title,c.event_date,U.CHANGE_CFG[c.change_type].label].join(" ").toLowerCase();
    var nodeHay=(c.involved_node_ids||[]).map(function(id){var n=Store.nodeMap[id];return n?n.name:"";}).join(" ").toLowerCase();
    return hay.indexOf(term)>=0||nodeHay.indexOf(term)>=0;
  });

  if(!Store.filtered.length){
    box.innerHTML="";
    state.hidden=false;
    state.innerHTML='<div class="state-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg></div>这个时间段暂未检测到变化。<br>切换到「今年」可查看全年 12 处。';
    return;
  }
  if(!list.length){box.innerHTML="";state.hidden=false;state.textContent="没有匹配「"+Store.searchTerm+"」的变化。";return;}
  list.forEach(function(c){
    var cfg=U.CHANGE_CFG[c.change_type];

    card.appendChild(el("div",{class:"cc-title"},c.title));

    card.appendChild(el("div",{class:"cc-meta"},"涉及 "+ncount+" 个主体 · "+ecount+" 条关系"));
    card.addEventListener("click",function(){selectChange(c.change_id);});

  });

/* ---------- 详情卡 ---------- */
function detailGrade(change){
  var grades=(change.involved_edge_ids||[]).map(function(id){var e=Store.edgeMap[id];return e?e.evidence_grade:null;}).filter(Boolean);
  if(grades.indexOf("C")>=0)return {cls:"grade-c",txt:"含 C 级待验证"};
  if(grades.indexOf("B")>=0)return {cls:"grade-b",txt:"含 B 级推断"};
  return {cls:"grade-a",txt:"A 级公开证据"};
}
function renderDetail(change){
  if(!change){
    $("detailTitle").textContent="未选择变化";
    $("detailCompare").innerHTML="";$("detailEvidence").innerHTML="";$("detailSources").innerHTML="";
    $("detailUncertainty").hidden=true;$("detailGrade").textContent="";$("detailTypeBadge").textContent="";
    return;
  }
  var cfg=U.CHANGE_CFG[change.change_type];
  var badge=$("detailTypeBadge");badge.textContent=cfg.label;
  badge.style.color=cfg.color;badge.style.background=cfg.color+"22";badge.style.border="1px solid "+cfg.color+"44";
  var dg=detailGrade(change);
  var gflag=$("detailGrade");gflag.className="grade-flag "+dg.cls;gflag.textContent=dg.txt;

  $("detailTitle").textContent=change.title;
  var ba=Store.splitBeforeAfter(change.before_after);
  var cmp=$("detailCompare");cmp.innerHTML="";
  var rb=el("div",{class:"compare-row before"});rb.appendChild(el("div",{class:"compare-lbl"},"此前"));rb.appendChild(el("div",{class:"compare-copy"},ba.before));
  var ra=el("div",{class:"compare-row after"});ra.appendChild(el("div",{class:"compare-lbl"},"此后"));ra.appendChild(el("div",{class:"compare-copy"},ba.after));
  cmp.appendChild(rb);cmp.appendChild(ra);

  // 证据行
  var ev=$("detailEvidence");ev.innerHTML="";
  var meta=el("div",{class:"ev-row"});
  meta.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8v5M12 16h.01"/></svg>';
  meta.appendChild(el("span",null,"涉及 "+(change.involved_node_ids||[]).length+" 个主体、"+(change.involved_edge_ids||[]).length+" 条关系，核验于 "+change.last_verified_at));
  ev.appendChild(meta);
  (change.involved_edge_ids||[]).forEach(function(id){
    var e=Store.edgeMap[id];if(!e)return;
    var row=el("div",{class:"ev-row"});
    var ic=el("span",null);ic.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:14px;height:14px"><path d="M4 12h16M14 6l6 6-6 6"/></svg>';
    row.appendChild(ic);
    var txt=e.relation_description+"（"+e.evidence_grade+"级";
    if(e.confidence)txt+="·"+e.confidence+"置信";
    txt+="）";
    row.appendChild(el("span",null,txt));
    ev.appendChild(row);
    if(e.evidence_grade==="C"&&e.counter_evidence){
      var ce=el("div",{class:"ev-row"});ce.style.color="#f2d4a0";ce.style.paddingLeft="22px";
      ce.appendChild(el("span",null,"待验证原因："+e.counter_evidence));
      ev.appendChild(ce);
    }
  });

  // 不确定项
  var un=$("detailUncertainty");
  if(change.uncertainty){un.hidden=false;un.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>'+change.uncertainty;}
  else un.hidden=true;

  // 来源
  var sc=$("detailSources");sc.innerHTML="";
  (change.source_ids||[]).forEach(function(id){
    var s=Store.sourceMap[id];
    var chip=el("span",{class:"src-chip",title:s?(s.title+" · "+s.publisher):id});
    chip.textContent=s?s.publisher:id;
    sc.appendChild(chip);
  });
}

/* ---------- 时间轴 ---------- */
function renderTimeline(){
  var track=$("timelineTrack"),labels=$("timelineLabels");
  track.innerHTML='<div class="tl-line"></div>';labels.innerHTML="";
  Store.filtered.forEach(function(c){
    var stop=el("button",{class:"tl-stop"+(c.change_id===Store.selectedId?" active":""),"data-id":c.change_id,"aria-label":c.title+" "+c.event_date});
    stop.addEventListener("click",function(){selectChange(c.change_id);});
    track.appendChild(stop);
    labels.appendChild(el("span",null,c.event_date.length>7?c.event_date.slice(5):c.event_date));
  });
}

/* ---------- 标题 ---------- */
function renderHeading(){
  var n=Store.filtered.length;
  if(Store.range==="month"){
    $("deckTitle").innerHTML='近 30 天，博罗变了 <b>'+n+'</b> 处';
    $("deckDesc").textContent="滚动近 30 天的变化，叠加在 36 个主体、45 条关系的基本盘上。点开一条，只看它牵动的路径。";
  }else{
    $("deckTitle").innerHTML='今年以来，博罗变了 <b>'+n+'</b> 处';
    $("deckDesc").textContent="在 36 个主体、45 条关系的基本盘上叠加变化。点开一条变化，只亮它牵动的路径；灰色是背景，不是结论。";
  }
}

/* ---------- 选中变化 ---------- */
function selectChange(id){
  var c=Store.getChange(id);
  Store.selectedId=id;
  if(c){
    var f=Store.computeFocus(c);
    engine&&engine.setFocus(f.nodeIds,f.edgeIds,true);
  }
  renderList();renderDetail(c);renderTimeline();
  if(c&&history.replaceState){history.replaceState(null,"","#change="+id);}
}

/* 取消选择，回到全景（Esc 也可触发） */
function clearSelection(){
  Store.selectedId=null;
  engine&&engine.setFocus({},{},false);
  renderList();renderTimeline();renderDetail(null);
  if(history.replaceState)history.replaceState(null,"",location.pathname+location.search);
}

/* 单节点聚焦（点击的节点不在当前范围变化中） */
function focusSingleNode(nid){
  var nodeIds={},edgeIds={};nodeIds[nid]=true;
  Store.evidence.edges.forEach(function(e){
    if(e.source_node_id===nid||e.target_node_id===nid){
      edgeIds[e.edge_id]=true;nodeIds[e.source_node_id]=true;nodeIds[e.target_node_id]=true;
    }
  });
  engine&&engine.setFocus(nodeIds,edgeIds,true);
  Store.selectedId=null;renderList();renderTimeline();
  var n=Store.nodeMap[nid];
  $("detailTitle").textContent=n?n.name:nid;
  $("detailCompare").innerHTML="";
  var ev=$("detailEvidence");ev.innerHTML="";
  var info=el("div",{class:"ev-row"});info.appendChild(el("span",null,n?n.description:""));ev.appendChild(info);
  $("detailUncertainty").hidden=true;$("detailSources").innerHTML="";
  $("detailTypeBadge").textContent=U.NODE_TYPE_LBL[n.node_type]||"";
  var g=$("detailGrade");g.className="grade-flag grade-a";g.textContent="A 级公开证据";
}

/* ---------- 节点点击 hook ---------- */
window.__AtlasHooks={
  onNodeClick:function(nid){
    var found=Store.filtered.filter(function(c){
      return (c.involved_node_ids||[]).indexOf(nid)>=0||
        (c.involved_edge_ids||[]).some(function(id){var e=Store.edgeMap[id];return e&&(e.source_node_id===nid||e.target_node_id===nid);});
    })[0];
    if(found)selectChange(found.change_id);else focusSingleNode(nid);
  }
};

/* ---------- 引擎初始化 ---------- */
function initEngine(){
  if(window.THREE&&window.__Atlas3D.init()){engine=window.__Atlas3D;}
  else if(window.__Atlas2D.init()){engine=window.__Atlas2D;}
  $("hudTl").textContent=engine===window.__Atlas3D?"BOLUO · 3D ATLAS":"BOLUO · 2D ATLAS";
}

/* ---------- 范围切换 ---------- */
function setRange(r){
  Store.range=r;
  document.querySelectorAll(".range-seg button").forEach(function(b){b.classList.toggle("active",b.getAttribute("data-range")===r);});
  Store.applyRange();
  renderHeading();renderStats();renderList();renderTimeline();
  // 保持当前选中（若仍在范围内），否则选最新
  var keep=Store.selectedId&&Store.filtered.some(function(c){return c.change_id===Store.selectedId;});
  if(keep){selectChange(Store.selectedId);}
  else{
    var latest=Store.filtered.length?Store.filtered[Store.filtered.length-1].change_id:null;
    if(latest)selectChange(latest);
    else{Store.selectedId=null;engine&&engine.setFocus({},{},false);renderDetail(null);}
  }
}

/* ---------- 失败态 ---------- */
function showError(){
  var state=$("listState");state.hidden=false;
  state.innerHTML='<div class="state-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 8v5M12 16h.01"/><circle cx="12" cy="12" r="9"/></svg></div>公开证据文件暂时无法读取。<br>请检查网络或 data/ 路径后重试。';
  $("changeList").innerHTML="";
  var retry=el("button",{class:"change-card",style:"margin-top:10px;text-align:center"});retry.textContent="重新加载";
  retry.addEventListener("click",function(){location.reload();});
  $("changeList").appendChild(retry);
}

/* ---------- 初始化 ---------- */
function boot(){
  renderLegend();
  Store.load().then(function(ok){
    if(!ok){showError();return;}
    // 解析 URL 初始范围（#range=month/year）
    var rangeM=location.hash.match(/range=(month|year)/);
    if(rangeM){
      Store.range=rangeM[1];
      document.querySelectorAll(".range-seg button").forEach(function(b){
        b.classList.toggle("active",b.getAttribute("data-range")===Store.range);
      });
    }
    Store.applyRange();
    initEngine();
    renderHeading();renderStats();renderList();renderTimeline();
    // 深链回放
    var hash=location.hash.match(/change=([A-Za-z0-9]+)/);
    var target=hash?hash[1]:null;
    if(target&&Store.getChange(target)){selectChange(target);}
    else{
      var latest=Store.filtered.length?Store.filtered[Store.filtered.length-1].change_id:null;
      if(latest)selectChange(latest);else{engine&&engine.setFocus({},{},false);renderDetail(null);}
    }
  });

  // 范围按钮
  document.querySelectorAll(".range-seg button").forEach(function(b){
    b.addEventListener("click",function(){setRange(b.getAttribute("data-range"));});
  });
  // 搜索
  var si=$("searchInput"),sb=$("searchBox");
  si.addEventListener("input",function(){Store.searchTerm=si.value.trim();renderList();});
  sb.addEventListener("click",function(){if(window.innerWidth<=680)sb.classList.toggle("open");});
  // 键盘可达：Esc 取消选择回到全景
  document.addEventListener("keydown",function(ev){
    if(ev.key==="Escape"&&Store.selectedId){clearSelection();}
  });
  // 顶部视图 tab
  document.querySelectorAll(".topnav button").forEach(function(b){
    b.addEventListener("click",function(){
      document.querySelectorAll(".topnav button").forEach(function(x){x.classList.remove("active");});
      b.classList.add("active");
      var tab=b.getAttribute("data-view-tab");
      if(tab==="events"){$("changeList").scrollIntoView({behavior:"smooth",block:"center"});toast("变化列表：按时间排列当前范围的变化");}
      else if(tab==="method"){document.querySelector(".side .side-note").scrollIntoView({behavior:"smooth",block:"center"});toast("数据说明：证据等级与口径");}
      else{$("stage").scrollIntoView({behavior:"smooth",block:"center"});}
    });
  });
}
boot();
})();
</script>
</body>
</html>
