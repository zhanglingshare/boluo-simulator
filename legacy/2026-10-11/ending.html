.branches { margin-top: 12px }
.branch-plot {

  background: #b5d9c690;
  content: "";
}
.branch { position: relative; min-width: 0 }
.branch i {

  bottom: var(--axis);
  left: 26%;
  width: 48%;
  height: var(--extent);
  background: var(--fill);
  border-radius: 4px 4px 0 0;
  transform-origin: bottom;
  animation: grow-y .54s ease-out both;
}
.branch b {
  position: absolute;
  bottom: calc(var(--axis) + var(--extent) + 3px);
  left: 50%;
  transform: translateX(-50%);
  color: var(--value-ink);
  font-size: 12px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.scenario-summary { margin: 8px 0 0 }
.investigate { align-self: stretch; padding: 11px 12px; border-left: 3px solid var(--aqua); border-radius: 0 8px 8px 0; background: #1b372c }
.investigate-label { margin: 0; color: var(--aqua); font-size: 12px; font-weight: 750 }
.investigate h4 { margin: 4px 0 0; font-size: clamp(16px, 1.5vw, 22px); line-height: 1.38 }
.investigate details p { margin: 0 0 7px; color: var(--muted); font-size: 13px }
summary { width: fit-content; min-height: 42px; padding: 10px 3px 8px 0; color: var(--muted); cursor: pointer; font-size: 13px }

<script>
(() => {
  'use strict';

  const { topics, sources, scenarios } = JSON.parse(document.getElementById('question-data').textContent);
  const entries = Object.entries(topics);
  const wall = document.getElementById('subject-switch');
  const detail = document.getElementById('question-detail');
  const questionTitle = document.getElementById('question-title');
  const leadChart = document.getElementById('lead-chart');
  const secondaryCharts = document.getElementById('secondary-charts');
  const cases = document.getElementById('case-buttons');
  const path = document.getElementById('case-path');
  const pathSteps = Array.from(path.querySelectorAll('li span'));
  const evidence = document.getElementById('case-evidence');
  const goal = document.getElementById('scenario-goal');
  const sourceDetails = document.getElementById('sources');
  const selectedCases = new Map();
  const selectedMetrics = new Map();
  let currentTopic;

  function format(value, digits = 0) {
    return value.toLocaleString('en-US', {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits
    });
  }

  function signed(value, digits = 1) {
    const sign = value < 0 ? '−' : value > 0 ? '+' : '';
    return sign + format(Math.abs(value), digits);
  }

  function direction(value) {
    return value < 0 ? 'down' : 'up';
  }

  function findMetric(topic, id) {
    return topic.lead.metrics.find(metric => metric.id === id);
  }

  function scale(value, low, high) {
    return (value - low) / (high - low) * 100;
  }

  function track(value, low, high) {
    const start = scale(Math.min(value, 0), low, high);
    const length = Math.abs(value) / (high - low) * 100;
    const zero = scale(0, low, high);
    return `<span class="track" aria-hidden="true" style="--start:${start}%;--length:${length}%;--zero:${zero}%"><i class="bar"></i></span>`;
  }

  function caption(title, scope) {
    return `<figcaption class="chart-caption"><h3>${title}</h3><span class="scope">${scope}</span></figcaption>`;
  }

  function note(message) {
    return message ? `<p class="chart-note">${message}</p>` : '';
  }

  const stage = document.getElementById('guess-stage');
  const shutter = document.getElementById('trial-shutter');
  const reveal = document.getElementById('trial-reveal');
  const ballot = document.getElementById('vote-buttons');
  const verdict = document.getElementById('vote-outcome');
  const retake = document.getElementById('retake');
  const chartDrawer = document.getElementById('chart-drawer');
  const canvas = document.getElementById('impact-canvas');
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const votes = new Map();
  const openTopics = new Set();
  let traceFrame = 0;

  function duelMetrics(key) {
    const topic = topics[key];
    return topic.featured.map(id => findMetric(topic, id));
  }

  function paintTraces(progress) {
    const ctx = canvas.getContext('2d');
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    if (!ctx || width < 50 || height < 50) return;
    const pixelRatio = Math.min(devicePixelRatio || 1, 2);
    if (canvas.width !== Math.round(width * pixelRatio) || canvas.height !== Math.round(height * pixelRatio)) {
      canvas.width = Math.round(width * pixelRatio);
      canvas.height = Math.round(height * pixelRatio);
    }
    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    ctx.clearRect(0, 0, width, height);

    const topic = topics[currentTopic];
    const [first, second] = duelMetrics(currentTopic);
    const [topColor, otherColor] = topic.guess.colors;
    const step = Math.max(Math.abs(first.rate), Math.abs(second.rate)) > 10 ? 10 : 5;
    const bottomLimit = Math.min(first.rate, second.rate) < 0 ? -2 * step : -step;
    const topLimit = 2 * step;
    const x0 = 31;
    const x1 = width - 12;
    const y = rate => 8 + (topLimit - rate) / (topLimit - bottomLimit) * (height - 19);

    ctx.lineWidth = 1;
    ctx.font = '10px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    for (let rate = bottomLimit + step; rate < topLimit; rate += step) {
      const axis = y(rate);
      ctx.strokeStyle = rate === 0 ? '#e6e9b695' : '#a8bb8a31';
      ctx.beginPath();
      ctx.moveTo(x0, axis);
      ctx.lineTo(x1, axis);
      ctx.stroke();
      ctx.fillStyle = '#cbc9a8';
      ctx.fillText(signed(rate, 0) + '%', 0, axis);
    }

    const x = x0 + (x1 - x0) * progress;
    const base = y(0);
    const ya = y(first.rate * progress);
    const yb = y(second.rate * progress);
    const space = ctx.createLinearGradient(x0, 0, x1, 0);
    space.addColorStop(0, '#998d4600');
    space.addColorStop(1, '#e6d87c30');
    ctx.fillStyle = space;
    ctx.beginPath();
    ctx.moveTo(x0, base);
    ctx.lineTo(x, ya);
    ctx.lineTo(x, yb);
    ctx.closePath();
    ctx.fill();

    [[ya, topColor], [yb, otherColor]].forEach(([end, color]) => {
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 9;
      ctx.beginPath();
      ctx.moveTo(x0, base);
      ctx.lineTo(x, end);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, end, 4.5, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.fillStyle = '#f8f4cc';
    ctx.beginPath();
    ctx.arc(x0, base, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawDuel(animate) {
    cancelAnimationFrame(traceFrame);
    if (!animate || motion.matches) {
      paintTraces(1);
      return;
    }
    const start = performance.now();
    const step = time => {
      const progress = Math.min(1, (time - start) / 700);
      paintTraces(1 - (1 - progress) ** 3);
      if (progress < 1) traceFrame = requestAnimationFrame(step);
    };
    traceFrame = requestAnimationFrame(step);
  }

  function renderBallot(topic) {
    const { title, choices } = topic.guess;
    document.getElementById('trial-title').innerHTML = `${title[0]}<br><em>${title[1]}</em>`;
    ballot.innerHTML = choices.map((choice, index) => `<button type="button" data-vote="${index}" aria-controls="trial-reveal" aria-pressed="false">${choice}</button>`).join('');
  }

  function showReveal(visible, animate = false) {
    const topic = topics[currentTopic];
    const picked = votes.get(currentTopic);
    const hasVote = picked !== undefined;
    stage.dataset.open = String(visible);
    detail.hidden = !visible;
    reveal.hidden = !visible;
    shutter.hidden = visible;
    retake.hidden = !visible;
    verdict.textContent = visible && hasVote
      ? (picked === topic.guess.correct ? '你的判断与这一年的数据对上了。' : '这一年的数据给出了另一边的答案。')
      : '';
    verdict.dataset.right = String(hasVote && picked === topic.guess.correct);
    for (const button of ballot.querySelectorAll('[data-vote]')) {
      button.setAttribute('aria-pressed', String(visible && Number(button.dataset.vote) === picked));
    }
    if (!visible) {
      cancelAnimationFrame(traceFrame);
      return;
    }
    document.getElementById('impact-pair').innerHTML = duelMetrics(currentTopic).map((metric, index) => `
      <div class="impact-stat" style="--stat-ink:${topic.guess.colors[index]}">
        <strong>${signed(metric.rate)}<small>%</small></strong><span>${metric.label}</span>
      </div>`
    ).join('');
    let insight = topic.guess.insight;
    if (topic.gap) insight = insight.replace('{gap}', format(findMetric(topic, 'urban').total - findMetric(topic, 'rural').total));
    document.getElementById('trial-insight').textContent = insight;
    reveal.classList.toggle('enter', animate);
    drawDuel(animate);
  }

  function renderLead(topic) {
    const { title, ticks, metrics } = topic.lead;
    const low = ticks[0];
    const high = ticks[ticks.length - 1];
    const axis = ticks.map(tick =>
      `<span class="${tick === 0 ? 'zero' : ''}" style="--pos:${scale(tick, low, high)}%">${signed(tick, 0)}</span>`
    ).join('');
    const rows = metrics.map(metric =>
      `<button type="button" class="metric-row reading ${direction(metric.rate)}" data-metric="${metric.id}"
        aria-controls="metric-reading" aria-pressed="false">
        <span class="metric-name">${metric.label}</span>
        ${track(metric.rate, low, high)}
        <strong class="value">${signed(metric.rate)}%</strong>
      </button>`
    ).join('');
    leadChart.innerHTML = `<figure class="chart lead-chart">
      ${caption(title, '2025 年同比 · %')}
      <div class="divergence" role="group" aria-label="点一项指标查看追问">
        <div class="axis-row" aria-hidden="true"><span></span><div class="axis-ticks">${axis}</div><span></span></div>
        ${rows}
      </div>
      ${note(topic.lead.note)}
      <div class="metric-reading reading" id="metric-reading" aria-live="polite">
        <span id="metric-context"></span><p id="metric-question"></p>
      </div>
    </figure>`;
  }

  function showMetric(id) {
    const metric = findMetric(topics[currentTopic], id);
    selectedMetrics.set(currentTopic, id);
    for (const button of leadChart.querySelectorAll('[data-metric]')) {
      button.setAttribute('aria-pressed', String(button.dataset.metric === id));
    }
    document.getElementById('metric-reading').classList.toggle('down', metric.rate < 0);
    document.getElementById('metric-context').textContent = '追问 · ' + metric.label;
    document.getElementById('metric-question').textContent = metric.question;
  }

  function renderAmounts(topic) {
    const amounts = topic.amounts;
    const rows = amounts.rows || amounts.metricIds.map(id => {
      const metric = findMetric(topic, id);
      return { label: metric.label, value: metric.total, rate: metric.rate };
    });
    return `<figure class="chart">
      ${caption(amounts.title, amounts.scope)}
      <div class="amount-scale" aria-hidden="true"><span>0</span><span>${format(amounts.max)}</span></div>
      ${rows.map(row => `<div class="amount-row reading ${direction(row.rate)}">
        <div class="amount-label"><span>${row.label}</span>
          <strong>${format(row.value, amounts.digits)}<small>同比 ${signed(row.rate)}%</small></strong>
        </div>
        ${track(row.value, 0, amounts.max)}
      </div>`).join('')}
      ${note(amounts.note)}
    </figure>`;
  }

  function renderHistory(topic) {
    const { title, years, series } = topic.history;
    const yearLabels = years.map(year => `<span>${year}</span>`).join('');
    const subplots = series.map(({ metricId, unit, max, previous }) => {
      const metric = findMetric(topic, metricId);
      const values = [...previous, metric.total];
      const bars = values.map((value, index) =>
        `<div class="series-bar" style="--height:${scale(value, 0, max)}%">
          <b><span class="sr-only">${years[index]} 年 </span>${format(value, 2)}</b><i aria-hidden="true"></i>
        </div>`
      ).join('');
      return `<div class="mini-series">
        <div class="series-label">${metric.label} · ${unit}</div>
        <div class="series-bars">${bars}</div>
        <div class="series-years" aria-hidden="true">${yearLabels}</div>
      </div>`;
    }).join('');
    return `<figure class="chart">
      ${caption(title, '2023—2025 年')}
      <div class="series-pair">${subplots}</div>
    </figure>`;
  }

  function renderGap(topic) {
    const { max, oldYear, increases } = topic.gap;
    const ruralNow = findMetric(topic, 'rural').total;
    const urbanNow = findMetric(topic, 'urban').total;
    const years = [
      { year: oldYear, rural: ruralNow - increases.rural, urban: urbanNow - increases.urban },
      { year: 2025, rural: ruralNow, urban: urbanNow }
    ];
    const rows = years.map(({ year, rural, urban }) => {
      const gap = urban - rural;
      return `<div class="gap-row">
        <div class="gap-header"><span>${year} 年</span><strong>差 ${format(gap)} 元</strong></div>
        <div class="gap-track" aria-hidden="true">
          <i class="gap-band" style="--start:${scale(rural, 0, max)}%;--length:${scale(gap, 0, max)}%"></i>
        </div>
        <div class="gap-values"><span>农村 ${format(rural)}</span><span>城镇 ${format(urban)}</span></div>
      </div>`;
    }).join('');
    return `<figure class="chart">
      ${caption('涨得更快，差距缩小多少？', '人均可支配收入 · 元')}
      <div class="amount-scale gap-axis" aria-hidden="true"><span>0</span><span>${format(max)}</span></div>
      ${rows}
      ${note('2020 年数据按公报披露的五年增量倒算。两个年份都用当年的价格。')}
    </figure>`;
  }

  function renderIndustries(industries) {
    const min = -10;
    const max = 29;
    const axis = scale(0, min, max);
    const bars = industries.map(({ full, rate }) =>
      `<div class="branch reading ${direction(rate)}" style="--extent:${Math.abs(rate) / (max - min) * 100}%">
        <i aria-hidden="true"></i><b><span class="sr-only">${full} </span>${signed(rate)}%</b>
      </div>`
    ).join('');
    return `<figure class="chart">
      ${caption('电子设备涨，橡胶塑料跌', '2025 年五个行业增加值同比')}
      <div class="branches">
        <div class="branch-plot" style="--axis:${axis}%">${bars}</div>
        <div class="branch-names" aria-hidden="true">${industries.map(industry => `<span>${industry.label}</span>`).join('')}</div>
      </div>
    </figure>`;
  }

  function renderShares(sizeShares) {
    const colors = ['var(--aqua)', 'var(--blue)', 'var(--lavender)'];
    return `<figure class="chart">
      ${caption('规上工业里，哪类企业占得多？', '2025 年按企业规模')}
      <div class="share-stack" aria-hidden="true">
        ${sizeShares.map(({ share }, index) =>
          `<span style="--share:${share}%;--share-color:${colors[index]}">${format(share, 1)}%</span>`
        ).join('')}
      </div>
      <div class="share-row head" aria-hidden="true"><span>企业规模</span><span>增加值占比</span><span>同比增速</span></div>
      ${sizeShares.map(({ label, share, rate }, index) => `<div class="share-row">
        <span><i aria-hidden="true" style="--share-color:${colors[index]}"></i>${label}</span>
        <span><span class="sr-only">占比 </span>${format(share, 1)}%</span>
        <span class="value"><span class="sr-only">同比 </span>${signed(rate)}%</span>
      </div>`).join('')}
    </figure>`;
  }

  function renderSecondary(topic) {
    if (topic.history) return renderAmounts(topic) + renderHistory(topic);
    if (topic.gap) return renderGap(topic) + renderAmounts(topic);
    return renderIndustries(topic.industries) + renderShares(topic.sizeShares);
  }

  function renderTopic(key) {
    const topic = topics[key];
    currentTopic = key;
    detail.dataset.topic = key;
    renderBallot(topic);
    chartDrawer.open = false;
    questionTitle.innerHTML = `${topic.headline[0]}<wbr><span>${topic.headline[1]}</span>`;
    for (const button of wall.querySelectorAll('[data-question]')) {
      button.setAttribute('aria-pressed', String(button.dataset.question === key));
    }
    renderLead(topic);
    showMetric(selectedMetrics.get(key) || topic.featured.find(id => findMetric(topic, id).rate < 0) || topic.featured[0]);
    secondaryCharts.innerHTML = renderSecondary(topic);
    document.getElementById('scenario-setup').textContent = topic.setup;
    cases.innerHTML = scenarios[key].map(({ label }, index) =>
      `<button type="button" data-case="${index}" aria-pressed="false" aria-controls="case-path follow-question">${label}</button>`
    ).join('');
    evidence.open = false;
    sourceDetails.open = false;
    goal.hidden = !topic.goal;
    if (topic.goal) {
      goal.textContent = `${topic.goal.year} 年城镇新增就业目标 ≥${format(topic.goal.minimum, 2)} ${topic.goal.unit}`;
    }
    document.getElementById('source-list').innerHTML = topic.sourceKeys.map(id => {
      const { label, url } = sources[id];
      return `<li><a href="${url}">${label}</a></li>`;
    }).join('');
  }

  function showQuestion(key, choice, visible) {
    const changed = currentTopic !== key;
    if (changed) renderTopic(key);
    selectedCases.set(key, choice);
    const view = scenarios[key][choice];
    for (const button of cases.querySelectorAll('[data-case]')) {
      button.setAttribute('aria-pressed', String(Number(button.dataset.case) === choice));
    }
    path.dataset.current = String(choice);
    pathSteps.forEach((step, index) => { step.textContent = view.steps[index]; });
    document.getElementById('case-summary').textContent = view.summary;
    document.getElementById('follow-question').textContent = view.question;
    document.getElementById('case-record').textContent = view.record;
    if (changed || detail.hidden === visible) showReveal(visible);
  }

  function syncQuestion() {
    const [key, choice] = location.hash.slice(1).split('/');
    if (!Object.hasOwn(topics, key)) {
      showQuestion('tourists', 0, false);
      return;
    }
    const visible = choice === '0' || choice === '1';
    if (visible) openTopics.add(key);
    showQuestion(key, choice === '1' ? 1 : 0, visible);
  }

  function setAddress(fragment) {
    if (location.hash !== fragment) history.pushState(null, '', fragment);
  }

  wall.addEventListener('click', event => {
    const button = event.target.closest('[data-question]');
    if (!button) return;
    const key = button.dataset.question;
    const choice = selectedCases.get(key) ?? 0;
    const open = openTopics.has(key);
    setAddress(open ? `#${key}/${choice}` : `#${key}`);
    showQuestion(key, choice, open);
  });
  ballot.addEventListener('click', event => {
    const button = event.target.closest('[data-vote]');
    if (!button) return;
    const animate = reveal.hidden;
    votes.set(currentTopic, Number(button.dataset.vote));
    openTopics.add(currentTopic);
    setAddress(`#${currentTopic}/${selectedCases.get(currentTopic)}`);
    showReveal(true, animate);
  });
  retake.addEventListener('click', () => {
    votes.delete(currentTopic);
    openTopics.delete(currentTopic);
    history.replaceState(null, '', `#${currentTopic}`);
    chartDrawer.open = false;
    showReveal(false);
    ballot.querySelector('button').focus();
  });
  leadChart.addEventListener('click', event => {
    const button = event.target.closest('[data-metric]');
    if (button) showMetric(button.dataset.metric);
  });
  cases.addEventListener('click', event => {
    const button = event.target.closest('[data-case]');
    if (!button) return;
    const choice = Number(button.dataset.case);
    setAddress(`#${currentTopic}/${choice}`);
    showQuestion(currentTopic, choice, true);
  });
  window.addEventListener('popstate', syncQuestion);
  window.addEventListener('hashchange', syncQuestion);
  window.addEventListener('resize', () => { if (!reveal.hidden) drawDuel(false); });
  syncQuestion();
})();
</script>
