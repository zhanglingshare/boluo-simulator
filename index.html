async function fetchLive(){
  liveTopics=[];
  const apis=[
    {url:"https://api.vvhan.com/api/hotlist/wbHot",name:"微博热搜"},
    {url:"https://api.vvhan.com/api/hotlist/baiduRD",name:"百度热搜"},
    {url:"https://api.vvhan.com/api/hotlist/zhihuHot",name:"知乎热榜"},
    {url:"https://api.vvhan.com/api/hotlist/douyinHot",name:"抖音热点"},
    {url:"https://api.vvhan.com/api/hotlist/toutiao",name:"今日头条"},
    {url:"https://api.vvhan.com/api/hotlist/bili",name:"B站热门"}
  ];
  for(const api of apis){
    try{
      const r=await fetch(api.url);
      const j=await r.json();
      if(j.data&&Array.isArray(j.data)){
        j.data.forEach((it,i)=>{
          const title=it.title||it.word||"";
          if(KW.some(k=>title.includes(k))){
            liveTopics.push({
              t:title,
              h:Math.max(60, 95-i*1.5),
              c:"city",
              src:api.name+"·实时",
              d:`来自${api.name}实时榜第${i+1}位`,
              why:"热搜在榜——这是正在被讨论的事。",
              live:true
            });
          }
        });
      }
    }catch(e){}
  }
}

          <span class="heatnum">${Math.round(x.hs)}°</span>
          <span style="flex:1;height:6px;background:#16233a;border-radius:3px;overflow:hidden"><i style="display:block;height:100%;width:${x.hs}%;background:linear-gradient(90deg,#4ade80,#fbbf24)"></i></span>
          <span class="src">${x.src}</span>
        </div>
        <div class="detail" style="font-size:12.5px;color:#cbd5e1;margin-top:8px">${x.d}<br><span style="color:#fbbf24">→ ${x.why}</span></div>
      </div>`;
    }
    return `<div class="topic ${catCls}" style="animation-delay:${i*50}ms" onclick="this.classList.toggle('open')">
      <div class="rank">${i+1}</div>
      <div class="body">
        <div class="t">${x.t}${liveBadge}</div>
        <div class="meta">
          <span class="heat"><i style="width:${Math.min(100,x.hs)}%;background:${heatColor}"></i></span>
          <span>${Math.round(x.hs)}°</span>
          <span class="src">${x.src}</span>
          <span class="cat-tag" style="background:${tagBg};color:${tagFg}">${catName}</span>
        </div>
        <div class="detail">${x.d}<br><span style="color:#fbbf24">→ ${x.why}</span></div>
      </div>
    </div>`;
  }).join("");
}

document.querySelectorAll(".cat").forEach(b=>{

});
