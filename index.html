<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  :root{
    --ink:#eef4fb; --sub:rgba(226,238,250,.74); --muted:rgba(198,218,234,.56);
    --line:rgba(255,255,255,.13); --card:rgba(18,34,56,.40); --card-hover:rgba(26,48,76,.56);
    --cyan:#7cc8ff; --accent:#6ce0f1;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  body{
    min-height:100vh; font-family:var(--font); color:var(--ink);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    background:#0a1730 url("assets/portal-bg.jpg") center/cover no-repeat fixed;
  }
  .scrim{position:fixed;inset:0;z-index:0;pointer-events:none;

      linear-gradient(180deg,rgba(7,16,34,.42) 0%,rgba(7,16,34,.18) 45%,rgba(7,16,34,.62) 100%);}
  .wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;
    padding:clamp(22px,4.5vh,52px) clamp(20px,6vw,86px);}
  .kicker{margin:0;text-align:center;font-size:12px;letter-spacing:.42em;text-indent:.42em;
    color:var(--sub);font-weight:600;text-transform:uppercase}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:880px;width:100%;margin:0 auto}
  h1{margin:clamp(18px,3vh,34px) 0 0;font-size:clamp(34px,6.2vw,66px);line-height:1.12;
    font-weight:850;letter-spacing:-.03em}
  .lede{margin:14px 0 0;color:var(--sub);font-size:clamp(14px,1.6vw,18px);line-height:1.6}
  .paths{list-style:none;margin:clamp(26px,4.5vh,46px) 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
  .path{position:relative;display:flex;align-items:center;gap:clamp(16px,2.4vw,26px);
    padding:clamp(17px,2.4vh,24px) clamp(18px,2.6vw,30px);
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    -webkit-backdrop-filter:blur(18px) saturate(1.25);backdrop-filter:blur(18px) saturate(1.25);
    color:var(--ink);text-decoration:none;
    transition:transform .25s ease,background .25s ease,border-color .25s ease,box-shadow .25s ease;}
  .path:hover,.path:focus-visible{transform:translateY(-3px);background:var(--card-hover);
    border-color:rgba(124,200,255,.5);box-shadow:0 18px 40px rgba(3,10,24,.45)}
  .path:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
  .num{flex:none;font-size:clamp(22px,2.6vw,30px);font-weight:800;letter-spacing:.02em;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;min-width:44px}
  .txt{flex:1;min-width:0}
  .txt b{display:block;font-size:clamp(16px,1.9vw,20px);font-weight:750;letter-spacing:-.01em}
  .txt small{display:block;margin-top:6px;color:var(--muted);font-size:clamp(12px,1.4vw,13.5px);line-height:1.5}
  .go{flex:none;color:var(--cyan);font-size:22px;transition:transform .25s ease,color .25s ease}
  .path:hover .go{transform:translateX(5px);color:var(--accent)}
  .foot{margin:clamp(20px,3vh,30px) 0 0;text-align:center;color:var(--muted);font-size:11.5px;letter-spacing:.04em}
  .fade{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.25,1) forwards}
  .d1{animation-delay:.05s}.d2{animation-delay:.14s}.d3{animation-delay:.23s}.d4{animation-delay:.32s}.d5{animation-delay:.41s}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @media (max-width:640px){
    body{background-attachment:scroll}
    .wrap{padding:26px 18px calc(20px + env(safe-area-inset-bottom))}
    .kicker{font-size:10.5px;letter-spacing:.32em;text-indent:.32em}
    .paths{gap:12px}
    .path{border-radius:16px;padding:16px 17px;gap:14px}
    .num{min-width:34px}
    .go{font-size:19px}
  }
  @media (prefers-reduced-motion:reduce){
    .fade{opacity:1;animation:none}
    .path,.go{transition:none}
  }
</style>
