<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>柏塘山茶 · 数据探索台</title>
<meta name="description" content="柏塘山茶产业数据探索台：多类型图表、下拉筛选与证据时间线，全部基于可核验公开数据。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='8' fill='%230f9f6e'/%3E%3Cpath d='M9 23c0-7 5-12 13-13-1 8-6 12-13 13Z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="../assets/boluo-layout.css">
<link rel="stylesheet" href="../assets/boluo-ui.css">
<script defer src="../assets/boluo-system.js"></script>
</head>
<body id="boluo-app" class="bl-site" data-ui-page="tea-deck">

<div class="scene" aria-hidden="true">
  <div class="sky"></div>
  <div class="moon"></div>
  <div class="stars" id="stars"></div>
  <div class="ridge r1"></div>
  <div class="ridge r2"></div>
  <div class="mist"></div>
  <div class="terraces"></div>
  <div class="scene-vignette"></div>
</div>

<main class="dk-wrap" id="dkRoot">
  <div id="dkBoot" class="dk-boot note-line">正在加载产业数据…</div>
</main>

<script>
(function () {
  var SCRIPTS = ['js/data.js', 'js/deck.js'];
  var BACKOFF = [300, 500, 800, 1200, 1800, 2500];
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  function load(src, attempt) {
    attempt = 0;
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = function () { s.remove(); reject(new Error('fail')); };
      document.head.appendChild(s);
    }).catch(function () {
      if (attempt >= BACKOFF.length) return Promise.reject(new Error(src + ' 多次加载失败'));
      return wait(BACKOFF[attempt]).then(function () { return load(src, attempt + 1); });
    });
  }
  SCRIPTS.reduce(function (p, s) { return p.then(function () { return load(s); }); }, Promise.resolve())
    .catch(function () {
      var d = document.getElementById('dkRoot');
      if (d) d.innerHTML = '<div class="dk-boot"><div class="note-line">脚本加载失败，请刷新页面重试。</div><button class="dk-btn" onclick="location.reload()">重新加载</button></div>';
    });
})();
</script>
</body>
</html>
