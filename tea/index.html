<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>柏塘山茶产业情报 · 博罗</title>
<meta name="description" content="博罗县柏塘山茶产业情报：用变化、缺口与口径，看清一门正在被看见的生意。每周更新。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='8' fill='%230f9f6e'/%3E%3Cpath d='M9 23c0-7 5-12 13-13-1 8-6 12-13 13Z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 沉浸式暮色茶山场景（纯 CSS，JS 补充星星） -->
<div class="scene" aria-hidden="true">
  <div class="sky"></div>
  <div class="moon"></div>
  <div class="stars" id="stars"></div>
  <div class="ridge r1"></div>
  <div class="ridge r2"></div>
  <div class="mist"></div>
  <div class="terraces"></div>
  <div class="scene-vignette"></div>
</div>

<!-- 7 屏叙事甲板 -->
<main class="deck" id="deck">
  <div id="boot" class="stage-wrap" style="position:fixed;inset:0;z-index:5;">
    <div class="note-line">正在加载产业数据…</div>
  </div>
</main>

<!-- 内联引导器：随 HTML 到达，动态加载脚本并对瞬时 5xx 自动重试 -->
<script>
(function () {
  var SCRIPTS = ['js/data.js', 'js/holo.js', 'js/holo-2d.js', 'js/holo-gl.js', 'js/story.js'];
  var BACKOFF = [300, 500, 800, 1200, 1800, 2500];
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  function load(src, attempt) {
    attempt = attempt || 0;
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = function () { s.remove(); reject(new Error('fail')); };
      document.head.appendChild(s);
    }).catch(function () {
      if (attempt >= BACKOFF.length) return Promise.reject(new Error(src + ' 多次加载失败'));
      return wait(BACKOFF[attempt]).then(function () { return load(src, attempt + 1); });
    });
  }
  SCRIPTS.reduce(function (p, s) { return p.then(function () { return load(s); }); }, Promise.resolve())
    .catch(function () {
      var d = document.getElementById('deck');
      if (d) d.innerHTML = '<div class="stage-wrap"><div class="note-line">脚本加载失败，请刷新页面重试。</div></div>';
    });
})();
</script>
</body>
</html>
