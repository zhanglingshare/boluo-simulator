name: V11 Wind Path Handoff Browser Check
on:
  push:
    branches: [main]
    paths:
      - "v11/wind.html"
      - "v11/wind.js"
      - "v11/wind-exp.css"
      - "v11/wind-experiments.js"
      - "v11/challenge-link.js"
      - "v11/condition-bridge.js"
      - "tests/boluo-v11-wind-path-handoff.cjs"
      - ".github/workflows/boluo-v11-wind-path-handoff.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/boluo-wind-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/v11/wind.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/boluo-wind-http.log
          exit 1
      - name: Test pathway handoff, simulation scope and preserved features
        run: node tests/boluo-v11-wind-path-handoff.cjs
      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boluo-v11-wind-path-handoff-audit
          path: artifacts/wind-path-handoff-*.png
          if-no-files-found: warn
          retention-days: 5
