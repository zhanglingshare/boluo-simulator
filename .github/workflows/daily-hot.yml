name: Daily Hot Refresh
on:
  schedule:
    - cron: '0 22 * * *'  # 每天北京时间早上6点
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch hot list
        run: python3 scripts/fetch_hot.py
      - name: Commit
        run: |
          git config user.email "68588368@qq.com"
          git config user.name "zhanglingshare"
          git add hot.json
          git diff --staged --quiet || git commit -m "auto: 每日热搜更新"
          git push
