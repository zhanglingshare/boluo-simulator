name: Boluo 2032 | Full Studio Acceptance
on:
  push:
    paths:
      - 'lab-2032/**'
      - '.github/workflows/boluo-2032-public-demo.yml'
  pull_request:
    paths:
      - 'lab-2032/**'
      - '.github/workflows/boluo-2032-public-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JavaScript syntax and module checks
        run: |
          node --check lab-2032/core.js
          node --check lab-2032/engine.js
          node --check lab-2032/studio.js
          node --check lab-2032/app.js
      - name: Install real browser and Excel fixtures
        run: |
          python -m pip install playwright openpyxl
          python -m playwright install chromium
      - name: End-to-end complete research studio
        run: python lab-2032/tests/full_browser.py
      - name: Preserve original quick Demo regression
        run: python lab-2032/tests/browser_smoke.py
      - name: Save desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boluo-2032-full-research-studio
          path: lab-2032/artifacts/
          retention-days: 7
          if-no-files-found: ignore
