name: V11 Page 12 · Future Structure Lab

on:
  push:
    paths:
      - "v11/future.html"
      - "v11/future.css"
      - "v11/future.js"
      - "v11/future-core.js"
      - "v11/brief.html"
      - "v11/brief.js"
      - "v11/brief-data.js"
      - "tests/boluo-v11-future*.cjs"
      - "tests/boluo-v11-brief.test.cjs"
      - ".github/workflows/boluo-v11-future.yml"
  pull_request:
    paths:
      - "v11/future.html"
      - "v11/future.css"
      - "v11/future.js"
      - "v11/future-core.js"
      - "v11/brief.html"
      - "v11/brief.js"
      - "v11/brief-data.js"
      - "tests/boluo-v11-future*.cjs"
      - "tests/boluo-v11-brief.test.cjs"
      - ".github/workflows/boluo-v11-future.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source and model boundaries
        run: |
          node --check v11/future-core.js
          node --check v11/future.js
          node --check v11/brief-data.js
          node --check v11/brief.js
          node --test tests/boluo-v11-future.test.cjs tests/boluo-v11-brief.test.cjs
      - name: Install Chromium for real browser testing
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Exercise parallel worlds and page-11 handoff on desktop and mobile
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/boluo-v11-future.log 2>&1 &
          sleep 2
          node tests/boluo-v11-future-browser.cjs
      - name: Save desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boluo-v11-page12-future-lab
          path: artifacts/v11-future/*.png
          if-no-files-found: ignore
          retention-days: 7
