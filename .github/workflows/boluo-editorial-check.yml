name: boluo-01-05-editorial-ui-data-audit

on:
  pull_request:
    paths:
      - 'assets/boluo-editorial.css'
      - 'assets/boluo-world-v3.*'
      - 'tests/boluo-world-v3-browser.cjs'
      - 'hot.json'
      - 'index-legacy-2026-11-03.html'
      - 'town.html'
      - 'holo-home-v9.html'
      - 'who.html'
      - 'relation-compare.html'
      - 'docs/boluo-01-05-ui-data-audit-20261103.md'
      - 'tests/boluo-editorial-*'
      - '.github/workflows/boluo-editorial-check.yml'
  push:
    branches: [main]
    paths:
      - 'assets/boluo-editorial.css'
      - 'assets/boluo-world-v3.*'
      - 'tests/boluo-world-v3-browser.cjs'
      - 'hot.json'
      - 'index-legacy-2026-11-03.html'
      - 'town.html'
      - 'holo-home-v9.html'
      - 'who.html'
      - 'relation-compare.html'
      - 'tests/boluo-editorial-*'
      - '.github/workflows/boluo-editorial-check.yml'

permissions:
  contents: read

jobs:
  editorial-data-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify navigation, published sources and revised statistics
        run: |
          node tests/verify_journey.js
          node --test tests/boluo-editorial-data.test.cjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/boluo-editorial.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8765/index-legacy-2026-11-03.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/boluo-editorial.log
          exit 1
      - name: Check 01-05 editorial visuals and interactions at desktop/mobile widths
        run: node tests/boluo-editorial-browser.cjs
      - name: Check coherent five-scene world, deep links, real node drag and mobile UX
        run: node tests/boluo-world-v3-browser.cjs
      - name: Publish visual inspection captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boluo-01-05-editorial-visual-audit
          path: |
            artifacts/boluo-editorial/*.png
            artifacts/boluo-world-v3/*.png
          if-no-files-found: warn
