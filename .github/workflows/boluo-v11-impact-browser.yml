name: V11 Impact Propagation Browser Check
on:
  push:
    branches: [main]
    paths:
      - "v11/impact.html"
      - "v11/impact.css"
      - "v11/impact.js"
      - "v11/impact-premium.css"
      - "tests/boluo-v11-impact-browser.cjs"
      - ".github/workflows/boluo-v11-impact-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/boluo-impact-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/v11/impact.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/boluo-impact-http.log
          exit 1
      - name: Test impact network, navigation and mobile
        run: node tests/boluo-v11-impact-browser.cjs
      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boluo-v11-impact-premium-browser-audit
          path: artifacts/impact-premium-*.png
          if-no-files-found: warn
          retention-days: 5
