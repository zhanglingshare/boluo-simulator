name: public-life-v2 smoke
on:
  push:
    paths:
      - "public-life-v2/**"
      - "data/hot-last.json"
      - "legacy/2026-10-11/life.json"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check public life v2 JS and data wiring
        run: |
          node --check public-life-v2/app.js
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const today=JSON.parse(fs.readFileSync('data/hot-last.json','utf8'));
          const life=JSON.parse(fs.readFileSync('legacy/2026-10-11/life.json','utf8'));
          assert(Array.isArray(today.items)&&today.items.length>0);
          assert(Array.isArray(life.towns)&&life.towns.length>0);
          assert(today.items.every(x=>typeof x.title==='string'));
          assert(life.towns.every(x=>typeof x.n==='string'));
          const js=fs.readFileSync('public-life-v2/app.js','utf8');
          for(const name of ['index.html','towns.html']){
            const html=fs.readFileSync('public-life-v2/'+name,'utf8');
            assert(html.includes('./ui.css')&&html.includes('./app.js'));
          }
          assert(js.includes('../data/hot-last.json'));
          assert(js.includes('../legacy/2026-10-11/life.json'));
          console.log('Public-life-v2 syntax, references and data shapes: OK');
          NODE
