name: V11 Structural Interaction Checks

on:
  push:
    paths:
      - "v11/sem-*.js"
      - "v11/sem-*.css"
      - "v11/sem-*.md"
      - "v11/sem-*.csv"
      - "v11/insights.html"
      - "v11/wind.html"
      - "tests/boluo-v11-sem.test.cjs"
      - ".github/workflows/boluo-v11-sem.yml"
  pull_request:
    paths:
      - "v11/sem-*.js"
      - "v11/sem-*.css"
      - "v11/sem-*.md"
      - "v11/sem-*.csv"
      - "v11/insights.html"
      - "v11/wind.html"
      - "tests/boluo-v11-sem.test.cjs"
      - ".github/workflows/boluo-v11-sem.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check teaching engine and navigation contracts
        run: node --test tests/boluo-v11-sem.test.cjs
