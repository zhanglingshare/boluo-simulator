name: V11 Public Interaction and Disclosure Checks

on:
  push:
    paths:
      - "v11/sem-*.js"
      - "v11/wind-experiments.js"
      - "v11/wind.js"
      - "v11/path-lab.js"
      - "v11/sem-*.css"
      - "v11/wind-exp.css"
      - "v11/sem-*.md"
      - "v11/sem-*.csv"
      - "v11/insights.html"
      - "v11/insight-*.js"
      - "v11/insight-*.css"
      - "v11/wind.html"
      - "tests/boluo-v11-sem.test.cjs"
      - "tests/boluo-v11-insight.test.cjs"
      - "tests/boluo-public-surface.test.cjs"
      - "docs/**"
      - "data/relationship-changes-v1.json"
      - "experiments/holo-single/data/atlas.json"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/boluo-v11-sem.yml"
  pull_request:
    paths:
      - "v11/sem-*.js"
      - "v11/wind-experiments.js"
      - "v11/wind.js"
      - "v11/path-lab.js"
      - "v11/sem-*.css"
      - "v11/wind-exp.css"
      - "v11/sem-*.md"
      - "v11/sem-*.csv"
      - "v11/insights.html"
      - "v11/insight-*.js"
      - "v11/insight-*.css"
      - "v11/wind.html"
      - "tests/boluo-v11-sem.test.cjs"
      - "tests/boluo-v11-insight.test.cjs"
      - "tests/boluo-public-surface.test.cjs"
      - "docs/**"
      - "data/relationship-changes-v1.json"
      - "experiments/holo-single/data/atlas.json"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/boluo-v11-sem.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check teaching engine and navigation contracts
        run: node --test tests/boluo-v11-sem.test.cjs tests/boluo-v11-insight.test.cjs tests/boluo-public-surface.test.cjs
