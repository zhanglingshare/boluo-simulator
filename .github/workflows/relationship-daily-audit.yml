name: relationship-daily-audit

on:
  schedule:
    # 09:30 China Standard Time (UTC+8)
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      check_source_urls:
        description: "Run a full source URL check now"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "data/relationship-evidence-v1.json"
      - "data/relationship-sources-v1.json"
      - "data/relationship-changes-v1.json"
      - "data/inbox/**"
      - "scripts/audit-relationship-data.js"
      - ".github/workflows/relationship-daily-audit.yml"

permissions:
  contents: write

concurrency:
  group: relationship-daily-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate baseline and review candidate package
        id: audit
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CHECK_SOURCE_URLS: ${{ inputs.check_source_urls }}
        run: node scripts/audit-relationship-data.js
      - name: Commit the daily audit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-audit.json data/daily-audit.md
          if git diff --cached --quiet; then
            echo "Audit report unchanged; no commit needed."
          else
            git commit -m "chore: refresh relationship data audit report"
            git push origin HEAD:main
          fi
      - name: Fail the workflow if data validation failed
        if: steps.audit.outcome == 'failure'
        run: |
          echo "Relationship data validation failed. Review data/daily-audit.md."
          exit 1
