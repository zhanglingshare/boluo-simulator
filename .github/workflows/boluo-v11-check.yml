name: V11 existing-page regression checks

on:
  push:
    paths:
      - 'v11/**'
      - 'tests/boluo-v11-*.test.cjs'
      - '.github/workflows/boluo-v11-check.yml'
  pull_request:
    paths:
      - 'v11/**'
      - 'tests/boluo-v11-*.test.cjs'
      - '.github/workflows/boluo-v11-check.yml'

permissions:
  contents: read

jobs:
  v11-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Controller syntax
        run: |
          node --check v11/discovery-data.js
          node --check v11/discovery-core.js
          node --check v11/discovery.js
          node --check v11/discovery-bridge.js
          node --check v11/relations-data.js
          node --check v11/relations-core.js
          node --check v11/relations.js
          node --check v11/relations-handoff.js
          node --check v11/relations-world-data.js
          node --check v11/relations-world-core.js
          node --check v11/relations-world-layout.js
          node --check v11/relations-stage.js
          node --check v11/brief-data.js
          node --check v11/brief.js
      - name: Existing page contracts and research dossier data checks
        run: node --test tests/boluo-v11-challenge.test.cjs tests/boluo-v11-region.test.cjs tests/boluo-v11-region-lab.test.cjs tests/boluo-v11-brief.test.cjs
