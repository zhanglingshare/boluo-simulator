name: Recover V11 Pages publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-v11-pages.yml'

permissions:
  pages: write

jobs:
  inspect-and-clear-failed-publications:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const targets = ['ae7f72dabadad7c0d3c29f1a815aabaee4778cea', '51849a8c1dd529a5347ab81797c9fcf4af0d81b1', '96735eed707715e446cbc4e090658400229b9314'];
            for (const target of targets) {
              const args = { ...context.repo, pages_deployment_id: target };
              try {
                const before = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', args);
                core.info(JSON.stringify({ version: target, status: before.data.status, error: before.data.error }));
                if (!['succeed', 'deployment_cancelled', 'cancelled'].includes(before.data.status)) {
                  const result = await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', args);
                  core.info('Cancellation response: ' + result.status);
                }
              } catch (error) {
                if ([404, 409].includes(error.status)) core.info(target + ': no cancellable publication (' + error.status + ')');
                else throw error;
              }
            }
