name: V11 Page 09 · Decision Challenge

on:
  push:
    paths:
      - "v11/challenge.html"
      - "v11/challenge.js"
      - "v11/challenge.css"
      - "v11/challenge-link.js"
      - "v11/wind.html"
      - "v11/insights.html"
      - "v11/insight-discovery.css"
      - "v11/insight-discovery-core.js"
      - "v11/insight-discovery-lab.js"
      - "v11/insight-workbench.js"
      - "tests/boluo-v11-challenge*.cjs"
      - ".github/workflows/boluo-v11-challenge.yml"
  pull_request:
    paths:
      - "v11/challenge.html"
      - "v11/challenge.js"
      - "v11/challenge.css"
      - "v11/challenge-link.js"
      - "v11/wind.html"
      - "v11/insights.html"
      - "v11/insight-workbench.js"
      - "tests/boluo-v11-challenge*.cjs"
      - ".github/workflows/boluo-v11-challenge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static public privacy, rendering and handoff checks
        run: |
          node --check v11/challenge.js
          node --check v11/challenge-link.js
          node --test tests/boluo-v11-challenge.test.cjs
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local site and exercise 07 → 09 / 08 → 09
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/boluo-v11-challenge.log 2>&1 &
          sleep 2
          node tests/boluo-v11-challenge-browser.cjs
      - name: Upload mobile / desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boluo-v11-page09-desktop-mobile
          path: artifacts/v11-challenge/*.png
          if-no-files-found: warn
          retention-days: 4
