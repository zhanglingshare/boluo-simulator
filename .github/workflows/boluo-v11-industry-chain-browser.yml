name: V11 Industry Chain Browser Check

on:
  push:
    branches: [main]
    paths:
      - "v11/industry-chain.html"
      - "v11/industry-chain-ux.css"
      - "v11/industry-chain-ux.js"
      - "v11/discovery-data.js"
      - "tests/boluo-v11-industry-chain-browser.cjs"
      - ".github/workflows/boluo-v11-industry-chain-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/boluo-industry-chain-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/v11/industry-chain.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/boluo-industry-chain-http.log
          exit 1
      - name: Test data, interactions, and responsive layout
        run: node tests/boluo-v11-industry-chain-browser.cjs
      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boluo-v11-industry-chain-browser-audit
          path: artifacts/industry-chain-*.png
          if-no-files-found: warn
          retention-days: 5
